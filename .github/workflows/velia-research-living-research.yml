name: VELIA Research Living Research
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  research-living:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: velia_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/velia_test
      VELIA_RESEARCH_CENTER_ENABLED: 'false'
      VELIA_RESEARCH_LITERATURE_ENABLED: 'false'
      VELIA_RESEARCH_CLAIM_LEDGER_ENABLED: 'false'
      VELIA_RESEARCH_META_ANALYSIS_ENABLED: 'false'
      VELIA_RESEARCH_SYSTEMATIC_REVIEW_ENABLED: 'false'
      VELIA_RESEARCH_LIVING_RESEARCH_ENABLED: 'false'
      VELIA_RESEARCH_LIVING_RESEARCH_WORKER_ENABLED: 'false'
      VELIA_RESEARCH_PROTOCOL_OFFICER_ENABLED: 'false'
      VELIA_RESEARCH_EXPERIMENT_EXECUTION_ENABLED: 'false'
      VELIA_RESEARCH_COMPUTE_ENABLED: 'false'
      VELIA_RESEARCH_EXPERIMENT_PIPELINE_ENABLED: 'false'
      VELIA_RESEARCH_AUTO_REPORT_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt pytest pytest-asyncio
      - name: Living research and downstream research tests
        run: >
          python -m pytest -q
          tests/test_velia_research_living_research.py
          tests/test_velia_research_systematic_review.py
          tests/test_velia_research_meta_analysis.py
          tests/test_velia_research_claim_ledger.py
          tests/test_velia_research_protocol_officer.py
          tests/test_velia_research_dataset_registry.py
          tests/test_velia_research_experiment_pipeline.py
          tests/test_velia_research_compute.py
          tests/test_velia_research_report.py
      - name: Compile living research surface
        run: >
          python -m compileall -q
          services/velia_research_living_service.py
          services/velia_research_literature_service.py
          services/velia_research_report_service.py
          run_velia_research_worker.py
          velia_research_routes.py
      - name: Static living-research safety and provenance boundary
        run: |
          python - <<'PY'
          from pathlib import Path

          living = Path('services/velia_research_living_service.py').read_text()
          literature = Path('services/velia_research_literature_service.py').read_text()
          report = Path('services/velia_research_report_service.py').read_text()
          worker = Path('run_velia_research_worker.py').read_text()
          routes = Path('velia_research_routes.py').read_text()
          env = Path('.env.example').read_text()

          assert 'VELIA_RESEARCH_LIVING_RESEARCH_ENABLED", False' in living
          assert 'VELIA_RESEARCH_LIVING_RESEARCH_WORKER_ENABLED", False' in living
          assert 'ALLOWED_CADENCE_HOURS = {24, 72, 168, 336, 720}' in living
          assert '"frozen_queries_only": True' in living
          assert '"new_papers_auto_included": False' in living
          assert '"old_reports_mutated": False' in living
          assert '"old_graphs_mutated": False' in living
          assert '"claim_stage_promotion_allowed": False' in living
          assert '"claim_stage_demotion_allowed": False' in living
          assert 'FOR UPDATE SKIP LOCKED' in living
          assert 'MAX_CANDIDATE_WORKS_PER_SCAN = 50' in living
          assert 'MAX_CITATION_CHECKS_PER_SCAN = 20' in living
          assert 'systematic.build_evidence_graph' in living
          assert 'literature.live_discover' in living
          assert 'literature.verify_doi_status' in living
          assert 'research_living_revision_created' in living

          forbidden = (
              'subprocess', 'os.system', 'eval(', 'exec(', 'compile(',
              '__import__(', 'requests.', 'aiohttp.', 'socket.', 'open(',
          )
          for token in forbidden:
              assert token not in living, token

          assert 'def live_discover(' in literature
          assert 'def verify_doi_status(' in literature
          assert '"filter": "doi:" + doi' in literature
          assert '_fetch_json(CROSSREF_URL' in literature
          assert '"update-to"' in literature
          assert 'No indexed update is not proof' in literature

          assert '"version": 8 if living_evidence is not None' in report
          assert '"living_research": living_evidence' in report
          assert '"immutable_living_scan_hash"' in report
          assert '"revision_of_report_hash"' in report
          assert '"living_research_old_report_mutation": False' in report
          assert '"living_research_auto_claim_stage_change": False' in report

          assert 'living_research.run_due_once(worker)' in worker
          assert '/systematic-reviews/{review_id}/living-watch' in routes
          assert '/systematic-reviews/{review_id}/living-scan' in routes
          assert '/living-scans/{scan_id}' in routes
          assert 'VELIA_RESEARCH_LIVING_RESEARCH_ENABLED=false' in env
          assert 'VELIA_RESEARCH_LIVING_RESEARCH_WORKER_ENABLED=false' in env
          PY
