name: Temporary Polywar Squad Maintenance Patch

on:
  push:
    branches:
      - fix/polywar-sql-placeholder-execution
    paths:
      - tools/polywar_squad_maintenance_patch.py
      - .github/workflows/polywar-squad-maintenance-patch.yml

permissions:
  contents: write

jobs:
  patch-squad-maintenance:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout hotfix branch
        uses: actions/checkout@v4
        with:
          ref: fix/polywar-sql-placeholder-execution
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Apply exact maintenance patch
        run: python tools/polywar_squad_maintenance_patch.py

      - name: Validate patched service
        run: |
          python -m py_compile services/polywar_squad_service.py
          git diff --check
          changed="$(git diff --name-only)"
          test "$changed" = "services/polywar_squad_service.py"

      - name: Commit exact patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add services/polywar_squad_service.py
          git commit -m "fix(polywar): guard squad maintenance before schema bootstrap"
          git push origin HEAD:fix/polywar-sql-placeholder-execution
