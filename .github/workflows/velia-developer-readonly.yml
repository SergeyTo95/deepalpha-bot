name: VELIA Developer read-only

on:
  pull_request:
    paths:
      - 'services/kimi_gateway.py'
      - 'services/velia_developer_*.py'
      - 'services/velia_mobile_streaming_service.py'
      - 'skills/velia-design-taste/SKILL.md'
      - 'third_party/taste-skill/**'
      - 'tests/test_velia_developer_*.py'
      - 'tests/test_velia_mobile_streaming_service.py'
      - '.github/workflows/velia-developer-readonly.yml'
      - 'run_web_process.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  developer-readonly-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
      - name: Compile Developer modules
        run: |
          python -m py_compile \
            services/kimi_gateway.py \
            services/velia_developer_github_service.py \
            services/velia_developer_github_write_service.py \
            services/velia_developer_project_service.py \
            services/velia_developer_agent_service.py \
            services/velia_developer_fast_path_service.py \
            services/velia_developer_taste_skill_service.py \
            services/velia_developer_coding_service.py \
            services/velia_developer_chat_runtime_patch.py \
            services/velia_developer_routes.py \
            services/velia_mobile_streaming_service.py \
            run_web_process.py
      - name: Run focused tests
        env:
          PYTHONPATH: .
        run: |
          pytest -q \
            tests/test_velia_developer_github_service.py \
            tests/test_velia_developer_github_write_service.py \
            tests/test_velia_developer_project_service.py \
            tests/test_velia_developer_agent_service.py \
            tests/test_velia_developer_fast_path_service.py \
            tests/test_velia_developer_fast_path_bootstrap.py \
            tests/test_velia_developer_taste_skill_service.py \
            tests/test_velia_developer_taste_integration.py \
            tests/test_velia_developer_coding_service.py \
            tests/test_velia_developer_coding_chat_gate.py \
            tests/test_velia_developer_coding_intent_classifier.py \
            tests/test_velia_developer_chat_runtime_patch.py \
            tests/test_velia_developer_branch_selection.py \
            tests/test_velia_developer_bootstrap.py \
            tests/test_velia_mobile_streaming_service.py
      - name: Verify read-only service boundary and secret handling
        run: |
          ! grep -nE 'create_branch|open_pull_request|apply_patch|run_command|contents.:.?write' \
            services/velia_developer_github_service.py \
            services/velia_developer_project_service.py \
            services/velia_developer_agent_service.py \
            services/velia_developer_fast_path_service.py \
            services/velia_developer_routes.py
          ! grep -R -nE 'VELIA_GITHUB_APP_PRIVATE_KEY\s*=' services tests
          ! grep -R -nE 'INSERT.*access_token|UPDATE.*access_token|authorized_user_token' services/velia_developer_*.py
          ! grep -R -nE 'print\(.*client_secret|logger\..*client_secret|logging\..*client_secret' services/velia_developer_*.py
      - name: Verify Coding Agent guarded write boundary
        run: |
          grep -q 'VELIA_DEVELOPER_WRITE_ENABLED' services/velia_developer_github_write_service.py
          grep -q 'developer_unsafe_write_branch' services/velia_developer_github_write_service.py
          grep -q 'github_contents_write_permission_required' services/velia_developer_github_write_service.py
          grep -q 'github_pull_requests_write_permission_required' services/velia_developer_github_write_service.py
          grep -q '"draft": True' services/velia_developer_github_write_service.py
          ! grep -qE 'merge_pull|/merges|deploy' services/velia_developer_github_write_service.py
          grep -q 'VELIA_DEVELOPER_CODING_PLAN_MAX_COST_USD' services/velia_developer_coding_service.py
          grep -q 'VELIA_DEVELOPER_CODING_MAX_COST_PER_STEP_USD' services/velia_developer_coding_service.py
          grep -q 'VELIA_DEVELOPER_CODING_MAX_JOB_COST_USD' services/velia_developer_coding_service.py
          grep -q 'developer_coding_path_outside_plan' services/velia_developer_coding_service.py
          grep -q 'Выполняй план' services/velia_developer_coding_service.py
          grep -q 'coding_result = _coding_chat_result' services/velia_developer_chat_runtime_patch.py
          grep -q 'if not coding_intent:' services/velia_developer_chat_runtime_patch.py
          grep -q 'test_read_only_repository_questions_are_not_coding_requests' tests/test_velia_developer_coding_intent_classifier.py
          grep -q 'test_explicit_mutation_requests_are_coding_requests' tests/test_velia_developer_coding_intent_classifier.py
      - name: Verify Design Taste adaptation contracts
        run: |
          grep -q 'UPSTREAM_COMMIT = "e988add20dab0fa97d7a76781c48961c8184288e"' services/velia_developer_taste_skill_service.py
          grep -q 'VELIA_DEVELOPER_TASTE_SKILL_ENABLED' services/velia_developer_taste_skill_service.py
          grep -q 'taste_skill.classify(normalized_goal, paths)' services/velia_developer_coding_service.py
          grep -q 'taste_skill.planning_guidance' services/velia_developer_coding_service.py
          grep -q 'taste_skill.execution_guidance' services/velia_developer_coding_service.py
          grep -q 'taste_skill.preflight_checks' services/velia_developer_coding_service.py
          grep -q 'test_backend_only_request_bypasses_taste_layer' tests/test_velia_developer_taste_skill_service.py
          grep -q 'test_android_screen_uses_android_native_mode' tests/test_velia_developer_taste_skill_service.py
          grep -q 'test_ui_plan_prompt_includes_compact_taste_guidance' tests/test_velia_developer_taste_integration.py
          grep -q 'Leonxlnx/taste-skill' third_party/taste-skill/UPSTREAM.md
          grep -q 'MIT License' third_party/taste-skill/LICENSE
          grep -q 'This skill adds prompt guidance only' skills/velia-design-taste/SKILL.md
          python - <<'PY'
          from pathlib import Path

          source = Path('services/velia_developer_coding_service.py').read_text(encoding='utf-8')
          assert source.count('_model_call(') == 3
          PY
      - name: Verify Developer stream resilience contracts
        run: |
          grep -q 'VELIA_DEVELOPER_WALL_TIMEOUT_SECONDS' services/velia_developer_agent_service.py
          grep -q 'VELIA_DEVELOPER_MODEL_ATTEMPTS' services/velia_developer_agent_service.py
          grep -q 'max_attempts=model_attempts' services/velia_developer_agent_service.py
          grep -q 'VELIA_DEVELOPER_ACTION_REASONING_EFFORT", "low"' services/velia_developer_agent_service.py
          grep -q 'reason in {"empty_200", "json_parse_error"}' services/velia_developer_agent_service.py
          grep -q 'PROVIDER_REPAIR:' services/velia_developer_agent_service.py
          ! grep -q 'max_attempts=1' services/velia_developer_agent_service.py
          grep -q 'VELIA_DEVELOPER_MAX_MODEL_CALLS' services/velia_developer_fast_path_service.py
          grep -q 'VELIA_DEVELOPER_MAX_COST_USD' services/velia_developer_fast_path_service.py
          grep -q 'current_feature = "velia_developer_fast"' services/velia_developer_fast_path_service.py
          grep -q 'max_attempts=1' services/velia_developer_fast_path_service.py
          grep -q 'VELIA_DEVELOPER_RESULT_CACHE_TTL_SECONDS' services/velia_developer_fast_path_service.py
          grep -q 'feature == "velia_developer_fast_repair"' services/kimi_gateway.py
          grep -q 'VELIA_DEVELOPER_FAST_REPAIR_MAX_COMPLETION_TOKENS' services/kimi_gateway.py
          grep -q 'VELIA_DEVELOPER_FAST_REPAIR_OUTPUT_TOKENS' services/velia_developer_fast_path_service.py
          grep -q 'VELIA_DEVELOPER_FAST_REPAIR_RESERVE_USD' services/velia_developer_fast_path_service.py
          grep -q 'current_feature = "velia_developer_fast_repair"' services/velia_developer_fast_path_service.py
          grep -q 'test_repair_budget_survives_real_first_call_cost' tests/test_velia_developer_fast_path_service.py
          grep -q 'test_gateway_uses_compact_completion_cap_for_developer_repair' tests/test_velia_developer_fast_path_service.py
          grep -q 'velia_developer_fast_path_service as agent_service' services/velia_developer_chat_runtime_patch.py
          grep -q 'velia_developer_fast_path_service as agent_service' services/velia_developer_routes.py
          grep -q 'developer_deadline_exceeded' services/velia_developer_agent_service.py
          grep -q '_worker_exception_code' services/velia_mobile_streaming_service.py
          grep -q '_sse_event("error", error=error_code)' services/velia_mobile_streaming_service.py
      - name: Verify Developer tool budget contracts
        run: |
          grep -q 'VELIA_DEVELOPER_MAX_TOOL_CALLS", 10' services/velia_developer_agent_service.py
          grep -q 'VELIA_DEVELOPER_MAX_DISCOVERY_CALLS' services/velia_developer_agent_service.py
          grep -q 'VELIA_DEVELOPER_MAX_READ_CALLS' services/velia_developer_agent_service.py
          grep -q 'discovery_calls >= max_discovery' services/velia_developer_agent_service.py
          grep -q 'read_calls >= max_reads' services/velia_developer_agent_service.py
          grep -q 'tool_calls >= max_tools' services/velia_developer_agent_service.py
          grep -q 'developer_tool_loop_detected' services/velia_developer_agent_service.py
          grep -q 'test_agent_forces_final_after_tool_budget_when_evidence_exists' tests/test_velia_developer_agent_service.py
          grep -q 'test_agent_requires_read_after_discovery_budget' tests/test_velia_developer_agent_service.py
          grep -q 'test_duplicate_tool_action_does_not_consume_budget' tests/test_velia_developer_agent_service.py
      - name: Verify ordinary chat integration order
        run: |
          python - <<'PY'
          from pathlib import Path

          source = Path('run_web_process.py').read_text(encoding='utf-8')
          streaming = source.index('install_velia_chat_streaming(velia_chat_service_module)')
          developer_chat = source.index('install_velia_developer_chat(velia_chat_service_module)')
          streaming_route = source.index('setup_velia_mobile_streaming_route(')
          assert streaming < developer_chat < streaming_route
          assert source.count('ensure_velia_developer_chat_tables()') == 1
          PY
      - name: Reject newly added Python bytecode
        if: github.event_name == 'pull_request'
        run: |
          if git diff --name-only --diff-filter=A "origin/${GITHUB_BASE_REF}...HEAD" \
            | grep -E '(^|/)__pycache__/|\.py[co]$'; then
            echo "Generated Python bytecode was added by this PR."
            exit 1
          fi