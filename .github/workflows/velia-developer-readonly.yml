name: VELIA Developer read-only

on:
  pull_request:
    paths:
      - 'services/velia_developer_*.py'
      - 'services/velia_mobile_streaming_service.py'
      - 'tests/test_velia_developer_*.py'
      - 'tests/test_velia_mobile_streaming_service.py'
      - '.github/workflows/velia-developer-readonly.yml'
      - 'run_web_process.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  developer-readonly-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
      - name: Compile Developer modules
        run: |
          python -m py_compile \
            services/velia_developer_github_service.py \
            services/velia_developer_project_service.py \
            services/velia_developer_agent_service.py \
            services/velia_developer_chat_runtime_patch.py \
            services/velia_developer_routes.py \
            services/velia_mobile_streaming_service.py \
            run_web_process.py
      - name: Run focused tests
        env:
          PYTHONPATH: .
        run: |
          pytest -q \
            tests/test_velia_developer_github_service.py \
            tests/test_velia_developer_project_service.py \
            tests/test_velia_developer_agent_service.py \
            tests/test_velia_developer_chat_runtime_patch.py \
            tests/test_velia_developer_branch_selection.py \
            tests/test_velia_developer_bootstrap.py \
            tests/test_velia_mobile_streaming_service.py
      - name: Verify read-only boundary and secret handling
        run: |
          ! grep -R -nE 'create_branch|open_pull_request|apply_patch|run_command|contents.:.?write' services/velia_developer_*.py
          ! grep -R -nE 'VELIA_GITHUB_APP_PRIVATE_KEY\s*=' services tests
          ! grep -R -nE 'INSERT.*access_token|UPDATE.*access_token|authorized_user_token' services/velia_developer_*.py
          ! grep -R -nE 'print\(.*client_secret|logger\..*client_secret|logging\..*client_secret' services/velia_developer_*.py
      - name: Verify Developer stream resilience contracts
        run: |
          grep -q 'VELIA_DEVELOPER_WALL_TIMEOUT_SECONDS' services/velia_developer_agent_service.py
          grep -q 'max_attempts=1' services/velia_developer_agent_service.py
          grep -q 'developer_deadline_exceeded' services/velia_developer_agent_service.py
          grep -q '_worker_exception_code' services/velia_mobile_streaming_service.py
          grep -q '_sse_event("error", error=error_code)' services/velia_mobile_streaming_service.py
      - name: Verify ordinary chat integration order
        run: |
          python - <<'PY'
          from pathlib import Path

          source = Path('run_web_process.py').read_text(encoding='utf-8')
          streaming = source.index('install_velia_chat_streaming(velia_chat_service_module)')
          developer_chat = source.index('install_velia_developer_chat(velia_chat_service_module)')
          streaming_route = source.index('setup_velia_mobile_streaming_route(')
          assert streaming < developer_chat < streaming_route
          assert source.count('ensure_velia_developer_chat_tables()') == 1
          PY
      - name: Reject newly added Python bytecode
        if: github.event_name == 'pull_request'
        run: |
          if git diff --name-only --diff-filter=A "origin/${GITHUB_BASE_REF}...HEAD" \
            | grep -E '(^|/)__pycache__/|\.py[co]$'; then
            echo "Generated Python bytecode was added by this PR."
            exit 1
          fi
