name: Apply VELIA Developer branch selection

on:
  pull_request:
    branches:
      - feature/turbo-short-term-btc

permissions:
  contents: write

jobs:
  apply-test-clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply product patch
        run: python scripts/_tmp_patch_velia_developer_branch_selection.py
      - name: Install focused dependencies
        run: pip install pytest requests cryptography aiohttp
      - name: Compile affected modules
        run: python -m py_compile services/velia_developer_github_service.py services/velia_developer_routes.py
      - name: Run focused tests
        env:
          PYTHONPATH: .
        run: pytest -q tests/test_velia_developer_branch_selection.py tests/test_velia_developer_github_service.py tests/test_velia_developer_connection_diagnostics.py
      - name: Remove one-shot files and commit product source
        run: |
          rm -f scripts/_tmp_patch_velia_developer_branch_selection.py
          rm -f .github/workflows/_tmp_apply_velia_developer_branch_selection.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add services/velia_developer_github_service.py services/velia_developer_routes.py tests/test_velia_developer_branch_selection.py
          git add -u scripts/_tmp_patch_velia_developer_branch_selection.py .github/workflows/_tmp_apply_velia_developer_branch_selection.yml
          git commit -m "Fix VELIA Developer branch selection"
          git push origin HEAD:fix/velia-developer-branch-selection
