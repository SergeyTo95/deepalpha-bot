name: VELIA Desktop preview

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'desktop/**'
      - 'velia_desktop_routes.py'
      - 'tests/test_velia_desktop_gateway.py'
      - '.github/workflows/velia-desktop-preview.yml'

permissions:
  contents: read

jobs:
  adapter-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest aiohttp
      - run: python -m pytest tests/test_velia_desktop_gateway.py -q
      - run: npm test
        working-directory: desktop
      - run: node --check src/main.mjs
        working-directory: desktop
  upstream-build:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
        with:
          version: '11.7.0'
      - run: npm run build:harness
        working-directory: desktop
