name: Gram Treasury Withdraw

on:
  pull_request:
  workflow_dispatch:

jobs:
  gram-treasury-withdraw:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Prove exact head
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          ACTUAL="$(git rev-parse HEAD)"
          EXPECTED="${{ github.event.pull_request.head.sha }}"
          echo "actual=$ACTUAL expected=$EXPECTED"
          test "$ACTUAL" = "$EXPECTED"

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -r requirements.txt
          python -m pip install pytest

      - name: Compile withdrawal surface
        run: |
          python -m py_compile services/gram_treasury_withdrawal_service.py bot/admin.py

      - name: Treasury withdrawal targeted tests
        run: |
          pytest -q tests/test_gram_treasury_withdrawal_service.py

      - name: TEP-74 offline signed transfer probe
        run: |
          python - <<'PY'
          from services.ton_wallet_service import _generate_wallet_real, _wallet_from_mnemonic, _extract_boc_from_transfer
          from services.gram_treasury_withdrawal_service import _build_usdt_transfer_payload, _build_jetton_wallet_transfer

          source_seed, source_address, _ = _generate_wallet_real()
          _, destination_address, _ = _generate_wallet_real()
          _, jetton_wallet_address, _ = _generate_wallet_real()

          body = _build_usdt_transfer_payload(
              destination_address=destination_address,
              response_destination=source_address,
              amount_raw=1_000_001,
              memo='offline-probe',
              query_id=42,
          )
          assert body.to_boc(False)

          wallet, _public_key, _private_key, regenerated = _wallet_from_mnemonic(source_seed)
          assert regenerated == source_address
          transfer = _build_jetton_wallet_transfer(wallet, jetton_wallet_address, 0, body)
          boc = _extract_boc_from_transfer(transfer)
          assert boc and len(boc) > 20
          print('TEP-74 offline signed transfer probe: OK')
          PY

      - name: Existing Treasury and Gram security regression
        run: |
          pytest -q tests/test_treasury_financial_security.py tests/test_ton_security_hotfix.py

      - name: Fail-closed money and secret boundary
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          service = Path('services/gram_treasury_withdrawal_service.py').read_text(encoding='utf-8')
          admin = Path('bot/admin.py').read_text(encoding='utf-8')
          assert 'VELIA_GRAM_TREASURY_WITHDRAW_ENABLED' in service
          assert 'VELIA_GRAM_TREASURY_USDT_WITHDRAW_ENABLED' in service
          assert 'TON_WALLET_ENABLED=true' not in service
          assert 'TON_SEED_EXPORT_ENABLED=true' not in service
          assert "status='submitting'" in service
          assert 'FOR UPDATE' in service
          assert 'submission_uncertain' in service
          assert 'CANONICAL_USDT_MASTER' in service
          assert '✅ CONFIRM WITHDRAWAL' in admin
          assert 'memo/tag' in admin.lower()
          print('Gram Treasury withdrawal fail-closed boundary: OK')
          PY

      - name: Conflict marker check
        shell: bash
        run: |
          if grep -R -n "<<<<<<<\|=======\|>>>>>>>" services/gram_treasury_withdrawal_service.py bot/admin.py tests/test_gram_treasury_withdrawal_service.py; then
            echo "Conflict marker found"
            exit 1
          fi
