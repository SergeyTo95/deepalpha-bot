name: VELIA Creem Billing
on:
  push:
    branches: [feature/turbo-short-term-btc]
    paths:
      - 'services/velia_creem_*.py'
      - 'services/velia_mobile_commercial_routes.py'
      - 'tests/test_velia_creem_*.py'
      - '.github/workflows/velia-creem-billing.yml'
  pull_request:
    paths:
      - 'services/velia_creem_*.py'
      - 'services/velia_mobile_commercial_routes.py'
      - 'tests/test_velia_creem_*.py'
      - '.github/workflows/velia-creem-billing.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: billing
          POSTGRES_PASSWORD: ci-only-not-production
          POSTGRES_DB: billing
        ports:
          - 5432:5432
        options: >-
          --health-cmd 'pg_isready -U billing'
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      PYTHONPATH: .
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
      VELIA_CREEM_TEST_DATABASE_URL: postgresql://billing:ci-only-not-production@localhost:5432/billing
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pytest==8.4.2 aiohttp==3.14.3 requests==2.34.2 psycopg2-binary==2.9.9 python-dotenv
      - run: python -m pytest tests/test_velia_creem_billing.py tests/test_velia_creem_routes.py tests/test_velia_creem_postgres.py -q --tb=short
