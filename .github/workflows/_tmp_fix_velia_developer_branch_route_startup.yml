name: Fix VELIA Developer branch route startup

on:
  pull_request:
    branches:
      - feature/turbo-short-term-btc
    paths:
      - '.github/workflows/_tmp_fix_velia_developer_branch_route_startup.yml'

permissions:
  contents: write

jobs:
  fix-test-clean:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Apply startup hotfix and runtime regression
        run: |
          python3 - <<'PY'
          from pathlib import Path

          route_path = Path('services/velia_developer_routes.py')
          route_source = route_path.read_text(encoding='utf-8')
          broken = 'f"{_PREFIX}/repositories/{repository_id}/branches",'
          fixed = 'f"{_PREFIX}/repositories/{{repository_id}}/branches",'
          if route_source.count(broken) != 1:
              raise SystemExit('expected exactly one broken repository route registration')
          route_path.write_text(route_source.replace(broken, fixed), encoding='utf-8')

          test_path = Path('tests/test_velia_developer_branch_selection.py')
          test_source = test_path.read_text(encoding='utf-8')
          test_source = test_source.replace(
              'from pathlib import Path\n\nfrom services import velia_developer_github_service as github\n',
              'from aiohttp import web\n\nfrom services import velia_developer_github_service as github\nfrom services import velia_developer_routes as routes\n',
          )
          old_test = '''def test_repository_branch_route_is_registered():\n    source = Path("services/velia_developer_routes.py").read_text(encoding="utf-8")\n    assert '/repositories/{repository_id}/branches' in source\n    assert 'async def repository_branches' in source\n'''
          new_test = '''def test_repository_branch_route_registration_executes_at_runtime():\n    app = web.Application()\n\n    routes.setup_velia_developer_routes(app, object())\n\n    registered_paths = {resource.canonical for resource in app.router.resources()}\n    assert "/mobile-api/v1/developer/repositories/{repository_id}/branches" in registered_paths\n'''
          if old_test not in test_source:
              raise SystemExit('old source-only route test not found')
          test_path.write_text(test_source.replace(old_test, new_test), encoding='utf-8')
          PY

      - name: Compile affected modules
        run: python3 -m py_compile services/velia_developer_routes.py services/velia_developer_github_service.py

      - name: Run focused Developer tests
        run: pytest -q tests/test_velia_developer*.py

      - name: Remove one-shot workflow and commit product hotfix
        run: |
          rm -f .github/workflows/_tmp_fix_velia_developer_branch_route_startup.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add services/velia_developer_routes.py tests/test_velia_developer_branch_selection.py
          git add -u .github/workflows/_tmp_fix_velia_developer_branch_route_startup.yml
          git commit -m "Fix VELIA Developer branch route startup"
          git push origin HEAD:fix/velia-developer-branch-route-startup
