name: Temporary VELIA Developer empty response fix

on:
  pull_request:
    branches:
      - feature/turbo-short-term-btc
    paths:
      - '.github/scripts/_tmp_apply_velia_empty_200_fix.py'
      - '.github/workflows/_tmp_velia_developer_empty_200_fix.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-test-clean:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
      - name: Apply focused patch
        run: python .github/scripts/_tmp_apply_velia_empty_200_fix.py
      - name: Compile affected modules
        run: |
          python -m py_compile \
            services/kimi_gateway.py \
            services/velia_developer_agent_service.py \
            services/velia_developer_chat_runtime_patch.py \
            services/velia_mobile_streaming_service.py
      - name: Run Developer and streaming tests
        env:
          PYTHONPATH: .
        run: |
          pytest -q \
            tests/test_velia_developer_agent_service.py \
            tests/test_velia_developer_chat_runtime_patch.py \
            tests/test_velia_mobile_streaming_service.py \
            tests/test_velia_developer_github_service.py \
            tests/test_velia_developer_project_service.py \
            tests/test_velia_developer_branch_selection.py \
            tests/test_velia_developer_bootstrap.py
      - name: Verify retry and reasoning contracts
        run: |
          python - <<'PY'
          from pathlib import Path
          source = Path('services/velia_developer_agent_service.py').read_text(encoding='utf-8')
          assert 'VELIA_DEVELOPER_ACTION_REASONING_EFFORT", "low"' in source
          assert 'action_reasoning not in {"low", "high", "max"}' in source
          assert 'max_attempts=model_attempts' in source
          assert 'reason in {"empty_200", "json_parse_error"}' in source
          assert 'PROVIDER_REPAIR:' in source
          assert 'max_attempts=1' not in source
          PY
      - name: Remove temporary automation
        run: |
          rm -f .github/scripts/_tmp_apply_velia_empty_200_fix.py
          rm -f .github/workflows/_tmp_velia_developer_empty_200_fix.yml
      - name: Commit clean product patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No product changes to commit.'
            exit 1
          fi
          git commit -m 'Fix VELIA Developer empty Kimi responses'
          git push origin HEAD:${{ github.head_ref }}
