name: VELIA Developer bootstrap

on:
  pull_request:
    paths:
      - 'run_web_process.py'
      - 'services/velia_developer_routes.py'
      - 'tests/test_velia_developer_bootstrap.py'
      - '.github/workflows/velia-developer-bootstrap.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bootstrap-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run bootstrap contract tests
        env:
          PYTHONPATH: .
        run: python -m pytest -q tests/test_velia_developer_bootstrap.py
