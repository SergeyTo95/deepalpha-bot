name: Watchlist idempotency migration

on:
  pull_request:
    paths:
      - "db/database.py"
      - "tests/test_watchlist_idempotency_migration_postgres.py"
      - ".github/workflows/watchlist-idempotency-migration.yml"
  workflow_dispatch:

jobs:
  postgres-migration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: deepalpha_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/deepalpha_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest psycopg2-binary
      - name: Run focused PostgreSQL migration regression test
        run: pytest -q tests/test_watchlist_idempotency_migration_postgres.py
