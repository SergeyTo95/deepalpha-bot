name: Watchlist idempotency migration

on:
  pull_request:
    paths:
      - "db/database.py"
      - "tests/test_watchlist_idempotency_migration_postgres.py"
      - ".github/workflows/watchlist-idempotency-migration.yml"
  workflow_dispatch:

jobs:
  postgres-migration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: deepalpha_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/deepalpha_test
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/deepalpha_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest psycopg2-binary
      - name: Run production migration smoke
        run: |
          python - <<'PY'
          import os
          import psycopg2
          from db.database import migrate_watchlist_slot_purchases_idempotency_index

          conn = psycopg2.connect(os.environ["TEST_DATABASE_URL"])
          conn.autocommit = False
          cur = conn.cursor()

          cur.execute("DROP TABLE IF EXISTS watchlist_slot_purchases CASCADE")
          cur.execute("""
          CREATE TABLE watchlist_slot_purchases (
              id BIGSERIAL PRIMARY KEY,
              user_id BIGINT NOT NULL,
              idempotency_key TEXT NOT NULL,
              created_at TIMESTAMP DEFAULT now(),
              UNIQUE(idempotency_key)
          )
          """)

          migrate_watchlist_slot_purchases_idempotency_index(cur)
          conn.commit()

          cur.execute("""
          SELECT indexname, indexdef
          FROM pg_indexes
          WHERE tablename='watchlist_slot_purchases'
          ORDER BY indexname
          """)
          print(cur.fetchall())

          cur.close()
          conn.close()
          PY
      - name: Run focused PostgreSQL migration regression test
        run: |
          set -o pipefail
          PYTHONPATH=. python -m pytest -vv -rA --tb=long -s tests/test_watchlist_idempotency_migration_postgres.py 2>&1 | tee postgres-migration-test.log
      - name: Upload PostgreSQL test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: postgres-migration-test-log
          path: postgres-migration-test.log
