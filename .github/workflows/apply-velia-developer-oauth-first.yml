name: Apply VELIA Developer OAuth-first

on:
  push:
    branches:
      - fix/velia-developer-oauth-first
  pull_request:
    branches:
      - feature/turbo-short-term-btc

permissions:
  contents: write

jobs:
  apply-test-clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/velia-developer-oauth-first
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply product patch
        run: python .github/scripts/apply_velia_developer_oauth_first.py
      - name: Install focused dependencies
        run: pip install pytest aiohttp requests cryptography psycopg2-binary
      - name: Compile affected modules
        run: python -m py_compile services/velia_developer_routes.py services/velia_developer_github_service.py
      - name: Run focused tests
        env:
          PYTHONPATH: .
        run: pytest -q tests/test_velia_developer_routes.py tests/test_velia_developer_github_service.py tests/test_velia_developer_bootstrap.py
      - name: Remove one-shot files and commit product source
        run: |
          rm -f .github/scripts/apply_velia_developer_oauth_first.py
          rm -f .github/workflows/apply-velia-developer-oauth-first.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: start VELIA GitHub connection with OAuth" || exit 0
          git push origin HEAD:fix/velia-developer-oauth-first
