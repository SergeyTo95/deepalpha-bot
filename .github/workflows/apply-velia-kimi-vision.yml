name: Apply VELIA Kimi vision

on:
  push:
    branches:
      - feature/velia-kimi-vision
    paths:
      - "tools/apply_velia_kimi_vision.py"
      - ".github/workflows/apply-velia-kimi-vision.yml"
  pull_request:
    branches:
      - feature/turbo-short-term-btc
    paths:
      - "tools/apply_velia_kimi_vision.py"
      - ".github/workflows/apply-velia-kimi-vision.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/velia-kimi-vision
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest

      - name: Apply focused implementation
        run: python tools/apply_velia_kimi_vision.py

      - name: Compile changed modules
        run: |
          python -m py_compile \
            services/kimi_gateway.py \
            services/velia_attachment_service.py \
            tests/test_velia_attachment_kimi_vision.py

      - name: Run focused tests
        run: |
          pytest -q \
            tests/test_velia_attachment_kimi_vision.py \
            tests/test_velia_attachment_service.py

      - name: Remove one-shot machinery
        run: |
          rm tools/apply_velia_kimi_vision.py
          rm .github/workflows/apply-velia-kimi-vision.yml

      - name: Commit verified product change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add services/kimi_gateway.py \
                  services/velia_attachment_service.py \
                  tests/test_velia_attachment_kimi_vision.py \
                  tools/apply_velia_kimi_vision.py \
                  .github/workflows/apply-velia-kimi-vision.yml
          git diff --cached --check
          git commit -m "add Kimi vision to VELIA File Analyst"
          git push origin HEAD:feature/velia-kimi-vision
