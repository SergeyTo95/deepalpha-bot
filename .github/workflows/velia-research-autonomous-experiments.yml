name: VELIA Research Autonomous Experiments
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  research-autonomous-experiments:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: velia_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/velia_test
      VELIA_RESEARCH_CENTER_ENABLED: 'false'
      VELIA_RESEARCH_AUTONOMY_ENABLED: 'false'
      VELIA_RESEARCH_DIRECTOR_ENABLED: 'false'
      VELIA_RESEARCH_EXPERIMENT_EXECUTION_ENABLED: 'false'
      VELIA_RESEARCH_COMPUTE_ENABLED: 'false'
      VELIA_RESEARCH_EXPERIMENT_PIPELINE_ENABLED: 'false'
      VELIA_RESEARCH_AUTO_REPORT_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt pytest pytest-asyncio
      - name: Autonomous experiment pipeline tests
        run: >
          python -m pytest -q
          tests/test_velia_research_experiment_pipeline.py
          tests/test_velia_research_compute.py
          tests/test_velia_research_director.py
          tests/test_velia_research_report.py
      - name: Compile experiment pipeline surface
        run: >
          python -m compileall -q
          services/velia_research_compute_service.py
          services/velia_research_experiment_pipeline_service.py
          services/velia_research_director_service.py
          services/velia_research_report_service.py
          run_velia_research_worker.py
          velia_research_routes.py
      - name: Static autonomous execution boundary
        run: |
          python - <<'PY'
          from pathlib import Path

          pipeline = Path('services/velia_research_experiment_pipeline_service.py').read_text()
          compute = Path('services/velia_research_compute_service.py').read_text()
          director = Path('services/velia_research_director_service.py').read_text()
          report = Path('services/velia_research_report_service.py').read_text()
          routes = Path('velia_research_routes.py').read_text()
          env = Path('.env.example').read_text()

          assert 'VELIA_RESEARCH_EXPERIMENT_PIPELINE_ENABLED", False' in pipeline
          assert '"invented_numeric_data_allowed": False' in pipeline
          assert '"arbitrary_code": False' in pipeline
          assert '"arbitrary_shell": False' in pipeline
          assert '"arbitrary_file_access": False' in pipeline
          assert '"arbitrary_url_fetch": False' in pipeline
          assert 'ANALYSIS_KIND_TO_OPERATION' in pipeline
          assert 'compute._validate_request' in pipeline
          assert 'compute.verify_reproducibility' in pipeline
          assert 'safety.classify' in pipeline

          forbidden = (
              'subprocess', 'os.system', 'eval(', 'exec(', 'compile(',
              '__import__(', 'requests.', 'aiohttp.', 'socket.', 'open(',
          )
          for token in forbidden:
              assert token not in pipeline, token

          assert 'def verify_reproducibility' in compute
          assert 'experiment_pipeline.run_ready' in director
          assert 'reports.build_report' in director
          assert '"computational_evidence": computational' in report
          assert 'uq_velia_research_report_snapshot' in report

          assert '/experiment-plans' in routes
          assert '/experiment-pipeline/run' in routes
          assert '/experiment-reviews' in routes
          assert 'VELIA_RESEARCH_EXPERIMENT_PIPELINE_ENABLED=false' in env
          assert 'VELIA_RESEARCH_AUTO_REPORT_ENABLED=false' in env
          PY
