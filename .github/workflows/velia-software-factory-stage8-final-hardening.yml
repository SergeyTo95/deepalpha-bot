name: VELIA Software Factory Stage 8 Final Hardening

on:
  pull_request:
    branches:
      - feature/turbo-short-term-btc
    paths:
      - "services/velia_software_factory_stage8_final_hardening_patch.py"
      - "services/velia_software_factory_stage8_greenfield_runtime_patch.py"
      - "services/velia_software_factory_stage8_release_runtime_patch.py"
      - "services/velia_software_factory_delivery_gate_service.py"
      - "tests/test_velia_software_factory_stage8_final_hardening.py"
      - "tests/test_velia_software_factory_stage8_full_autonomy.py"
      - ".github/workflows/velia-software-factory-stage8-final-hardening.yml"
  push:
    branches:
      - feature/turbo-short-term-btc
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  final-hardening-and-production-acceptance:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out exact source commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest pytest-asyncio

      - name: Verify exact checkout
        run: |
          echo "checked_out_sha=$(git rev-parse HEAD)"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          else
            test "$(git rev-parse HEAD)" = "${{ github.sha }}"
          fi

      - name: Run Stage 8 final acceptance boundary
        id: acceptance
        continue-on-error: true
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          set -euo pipefail
          python -m py_compile \
            services/velia_software_factory_stage8_final_hardening_patch.py \
            services/velia_software_factory_stage8_greenfield_runtime_patch.py \
            services/velia_software_factory_stage8_release_runtime_patch.py
          python -m pytest -q \
            tests/test_velia_software_factory_stage8_final_hardening.py \
            tests/test_velia_software_factory_stage8_full_autonomy.py \
            tests/test_velia_software_factory_stage7_limited_admin_rollout.py
          python - <<'PY'
          from contextlib import contextmanager
          from types import SimpleNamespace

          from services import velia_software_factory_stage8_final_hardening_patch as hardening
          from services import velia_software_factory_stage8_greenfield_runtime_patch as atomic
          from services import velia_software_factory_stage8_release_runtime_patch as stage8_release_runtime

          def execution(objective):
              return {"plan": {"objective": objective}}

          assert hardening._strict_release_authorized(
              execution("Deploy this app after approval is given by me")
          ) is False
          assert hardening._strict_release_authorized(
              execution("Deploy once authorization has been granted by us")
          ) is False
          assert atomic._conditional_noun_deferred_approval(
              "Deploy this app if approval is given by me"
          ) is True
          assert atomic._conditional_noun_deferred_approval(
              "Deploy this app provided that authorization has been granted by us"
          ) is True
          assert hardening._zero_merge_terminal_release(
              {
                  "status": "blocked",
                  "merged_count": 0,
                  "stop_requested": True,
                  "items": [{"status": "failed", "merge_commit_sha": ""}],
              }
          ) is False

          # Prove the durable-stop DDL is once-per-process. A fake connection is
          # sufficient here; the exact-head Railway preview separately proves the
          # real PostgreSQL migration/startup path.
          migration_events = []

          class MigrationCursor:
              def execute(self, query, params=None):
                  migration_events.append(" ".join(str(query).split()))
              def close(self):
                  pass

          class MigrationConnection:
              def cursor(self):
                  return MigrationCursor()
              def commit(self):
                  migration_events.append("migration_commit")
              def rollback(self):
                  migration_events.append("migration_rollback")
              def close(self):
                  pass

          original_atomic_get_connection = atomic.get_connection
          original_release_ensure = stage8_release_runtime.ensure_stage8_release_tables
          original_schema_ready = atomic._DURABLE_STOP_SCHEMA_READY
          try:
              atomic._DURABLE_STOP_SCHEMA_READY = False
              atomic.get_connection = lambda: MigrationConnection()
              stage8_release_runtime.ensure_stage8_release_tables = lambda execution_module: None
              atomic._ensure_durable_stop_schema(object())
              first_event_count = len(migration_events)
              atomic._ensure_durable_stop_schema(object())
              assert len(migration_events) == first_event_count
              assert sum("ALTER TABLE velia_software_factory_stage8_releases" in event for event in migration_events) == 2
              assert sum("CREATE INDEX IF NOT EXISTS idx_velia_factory_stage8_retired_release" in event for event in migration_events) == 1
              assert sum("pg_advisory_xact_lock" in event for event in migration_events) == 1
              assert migration_events.count("migration_commit") == 1
          finally:
              atomic.get_connection = original_atomic_get_connection
              stage8_release_runtime.ensure_stage8_release_tables = original_release_ensure
              atomic._DURABLE_STOP_SCHEMA_READY = original_schema_ready

          # This acceptance fixture deliberately exercises wrapper installation
          # without a live PostgreSQL connection. Production schema migration is
          # covered by the real Railway preview; never add a production test-mode bypass.
          original_ensure_durable_stop_schema = atomic._ensure_durable_stop_schema
          atomic._ensure_durable_stop_schema = lambda execution_module: None
          try:
              installer_module = SimpleNamespace(
                  _workspace_stage8_final_hardening_installed=True,
                  execute_release=lambda user_id, release_id: {
                      "execution_id": release_id,
                      "status": "blocked",
                  },
              )
              atomic._install_release_atomicity_hardening(installer_module)
              assert hardening._strict_release_authorized(
                  execution("Deploy this app if approval is given by me")
              ) is False
              assert hardening._strict_release_authorized(
                  execution("Deploy this app provided that authorization has been granted by us")
              ) is False

              events = []

              class Cursor:
                  rowcount = 0
                  def __init__(self):
                      self._row = None
                  def execute(self, query, params):
                      normalized = " ".join(str(query).split())
                      if "FROM velia_software_factory_stage8_releases" in normalized and "FOR UPDATE" in normalized:
                          events.append("coordinator_row_locked")
                          self._row = ("workspace-1", "plan-old", "release-old", False)
                      elif normalized.startswith("UPDATE velia_software_factory_stage8_releases SET"):
                          assert "retired_release_execution_id" in normalized
                          assert "stop_requested=FALSE" in normalized
                          events.append("coordinator_binding_cleared")
                          self.rowcount = 1
                      else:
                          raise AssertionError(f"unexpected SQL: {normalized}")
                  def fetchone(self):
                      return self._row

              class Connection:
                  def commit(self):
                      events.append("coordinator_state_committed")

              @contextmanager
              def fake_release_lock(release_id):
                  assert release_id == "release-old"
                  events.append("release_lock_enter")
                  yield Connection(), Cursor()
                  events.append("release_lock_exit")

              original_lock = hardening._release_operation_lock
              hardening._release_operation_lock = fake_release_lock
              try:
                  release = {
                      "execution_id": "release-old",
                      "plan_id": "plan-old",
                      "status": "blocked",
                      "merged_count": 0,
                      "stop_requested": False,
                      "items": [{"status": "failed", "merge_commit_sha": ""}],
                  }
                  module = SimpleNamespace(
                      get_release_execution=lambda user_id, release_id: dict(release),
                      cancel_release_preflight=lambda user_id, plan_id: (
                          events.append("preflight_retired") or {"status": "cancelled"}
                      ),
                  )
                  atomic._atomic_zero_merge_rotate(
                      module,
                      9,
                      {"plan_id": "plan-old", "release_execution_id": "release-old"},
                      release,
                  )
              finally:
                  hardening._release_operation_lock = original_lock

              assert events.index("release_lock_enter") < events.index("preflight_retired")
              assert events.index("preflight_retired") < events.index("coordinator_binding_cleared")
              assert events.index("coordinator_binding_cleared") < events.index("coordinator_state_committed")
              assert events.index("coordinator_state_committed") < events.index("release_lock_exit")

              # A stop addressed to a retired release must mark the coordinator and
              # the currently active replacement execution before the transaction commits.
              stop_events = []

              class StopCursor:
                  def __init__(self):
                      self._row = None
                  def execute(self, query, params):
                      normalized = " ".join(str(query).split())
                      if normalized.startswith("UPDATE velia_software_factory_stage8_releases SET"):
                          stop_events.append("coordinator_stop_persisted")
                          self._row = ("workspace-1", "release-new", "release-old", "retrying_candidate")
                      elif normalized.startswith("UPDATE velia_software_factory_release_executions SET"):
                          assert params == ("release-new", 9)
                          stop_events.append("active_release_stop_persisted")
                      else:
                          raise AssertionError(f"unexpected stop SQL: {normalized}")
                  def fetchone(self):
                      return self._row
                  def close(self):
                      pass

              class StopConnection:
                  def __init__(self):
                      self.cursor_obj = StopCursor()
                  def cursor(self):
                      return self.cursor_obj
                  def commit(self):
                      stop_events.append("stop_transaction_committed")
                  def rollback(self):
                      stop_events.append("stop_transaction_rolled_back")
                  def close(self):
                      pass

              original_atomic_get_connection = atomic.get_connection
              atomic.get_connection = lambda: StopConnection()
              try:
                  marker = atomic._mark_coordinator_stop(object(), 9, "release-old")
              finally:
                  atomic.get_connection = original_atomic_get_connection
              assert marker["workspace_execution_id"] == "workspace-1"
              assert marker["release_execution_id"] == "release-new"
              assert stop_events == [
                  "coordinator_stop_persisted",
                  "active_release_stop_persisted",
                  "stop_transaction_committed",
              ]
          finally:
              atomic._ensure_durable_stop_schema = original_ensure_durable_stop_schema
          PY

      - name: Publish independent production acceptance status
        if: always() && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          ACCEPTANCE_OUTCOME: ${{ steps.acceptance.outcome }}
          REPOSITORY: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.request

          outcome = os.environ.get("ACCEPTANCE_OUTCOME", "failure")
          state = "success" if outcome == "success" else "failure"
          description = (
              "Stage 8 production acceptance passed"
              if state == "success"
              else "Stage 8 production acceptance failed"
          )
          repository = os.environ["REPOSITORY"]
          sha = os.environ["COMMIT_SHA"]
          payload = json.dumps(
              {
                  "state": state,
                  "context": "VELIA Stage 8 Acceptance",
                  "description": description,
                  "target_url": f"https://github.com/{repository}/actions/runs/{os.environ['RUN_ID']}",
              }
          ).encode("utf-8")
          request = urllib.request.Request(
              f"https://api.github.com/repos/{repository}/statuses/{sha}",
              data=payload,
              method="POST",
              headers={
                  "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                  "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28",
                  "Content-Type": "application/json",
              },
          )
          with urllib.request.urlopen(request, timeout=30) as response:
              if response.status not in (200, 201):
                  raise SystemExit(f"status publish failed: HTTP {response.status}")
          PY

      - name: Fail workflow when acceptance failed
        if: steps.acceptance.outcome != 'success'
        run: exit 1