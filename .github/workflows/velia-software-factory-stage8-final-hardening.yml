name: VELIA Software Factory Stage 8 Final Hardening

on:
  pull_request:
    branches:
      - feature/turbo-short-term-btc
    paths:
      - "services/velia_software_factory_stage8_final_hardening_patch.py"
      - "services/velia_software_factory_stage8_greenfield_runtime_patch.py"
      - "services/velia_software_factory_stage8_release_runtime_patch.py"
      - "services/velia_software_factory_delivery_gate_service.py"
      - "tests/test_velia_software_factory_stage8_final_hardening.py"
      - "tests/test_velia_software_factory_stage8_full_autonomy.py"
      - ".github/workflows/velia-software-factory-stage8-final-hardening.yml"
  push:
    branches:
      - feature/turbo-short-term-btc
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  final-hardening-and-production-acceptance:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out exact source commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest pytest-asyncio

      - name: Verify exact checkout
        run: |
          echo "checked_out_sha=$(git rev-parse HEAD)"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          else
            test "$(git rev-parse HEAD)" = "${{ github.sha }}"
          fi

      - name: Run Stage 8 final acceptance boundary
        id: acceptance
        continue-on-error: true
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          set -euo pipefail
          python -m py_compile \
            services/velia_software_factory_stage8_final_hardening_patch.py \
            services/velia_software_factory_stage8_greenfield_runtime_patch.py \
            services/velia_software_factory_stage8_release_runtime_patch.py
          python -m pytest -q \
            tests/test_velia_software_factory_stage8_final_hardening.py \
            tests/test_velia_software_factory_stage8_full_autonomy.py \
            tests/test_velia_software_factory_stage7_limited_admin_rollout.py

      - name: Publish independent production acceptance status
        if: always() && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          ACCEPTANCE_OUTCOME: ${{ steps.acceptance.outcome }}
          REPOSITORY: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.request

          outcome = os.environ.get("ACCEPTANCE_OUTCOME", "failure")
          state = "success" if outcome == "success" else "failure"
          description = (
              "Stage 8 production acceptance passed"
              if state == "success"
              else "Stage 8 production acceptance failed"
          )
          repository = os.environ["REPOSITORY"]
          sha = os.environ["COMMIT_SHA"]
          payload = json.dumps(
              {
                  "state": state,
                  "context": "VELIA Stage 8 Acceptance",
                  "description": description,
                  "target_url": f"https://github.com/{repository}/actions/runs/{os.environ['RUN_ID']}",
              }
          ).encode("utf-8")
          request = urllib.request.Request(
              f"https://api.github.com/repos/{repository}/statuses/{sha}",
              data=payload,
              method="POST",
              headers={
                  "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                  "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28",
                  "Content-Type": "application/json",
              },
          )
          with urllib.request.urlopen(request, timeout=30) as response:
              if response.status not in (200, 201):
                  raise SystemExit(f"status publish failed: HTTP {response.status}")
          PY

      - name: Fail workflow when acceptance failed
        if: steps.acceptance.outcome != 'success'
        run: exit 1
