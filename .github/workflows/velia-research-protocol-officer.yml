name: VELIA Research Protocol Officer
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  research-protocol-officer:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: velia_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/velia_test
      VELIA_RESEARCH_CENTER_ENABLED: 'false'
      VELIA_RESEARCH_DATASET_REGISTRY_ENABLED: 'false'
      VELIA_RESEARCH_PROTOCOL_OFFICER_ENABLED: 'false'
      VELIA_RESEARCH_EXPERIMENT_EXECUTION_ENABLED: 'false'
      VELIA_RESEARCH_COMPUTE_ENABLED: 'false'
      VELIA_RESEARCH_EXPERIMENT_PIPELINE_ENABLED: 'false'
      VELIA_RESEARCH_AUTO_REPORT_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt pytest pytest-asyncio
      - name: Protocol officer and downstream research tests
        run: >
          python -m pytest -q
          tests/test_velia_research_protocol_officer.py
          tests/test_velia_research_dataset_registry.py
          tests/test_velia_research_experiment_pipeline.py
          tests/test_velia_research_compute.py
          tests/test_velia_research_report.py
      - name: Compile protocol officer surface
        run: >
          python -m compileall -q
          services/velia_research_protocol_service.py
          services/velia_research_dataset_service.py
          services/velia_research_experiment_pipeline_service.py
          services/velia_research_report_service.py
          run_velia_research_worker.py
          velia_research_routes.py
      - name: Static preregistration and quality boundary
        run: |
          python - <<'PY'
          from pathlib import Path

          service = Path('services/velia_research_protocol_service.py').read_text()
          datasets = Path('services/velia_research_dataset_service.py').read_text()
          pipeline = Path('services/velia_research_experiment_pipeline_service.py').read_text()
          routes = Path('velia_research_routes.py').read_text()
          report = Path('services/velia_research_report_service.py').read_text()
          env = Path('.env.example').read_text()

          assert 'VELIA_RESEARCH_PROTOCOL_OFFICER_ENABLED", False' in service
          assert '"preregistration_required_for_test_split": True' in service
          assert '"test_rows_exposed_by_api": False' in service
          assert 'ALLOWED_CORRECTIONS = {"none", "bonferroni", "holm"}' in service
          assert 'NormalDist().inv_cdf' in service
          assert 'test_values_used_to_choose_protocol": False' in service
          assert 'identical_full_rows_cross_train_test_boundary' in service
          assert 'research_protocol_correction_required' in service
          assert 'protocol_hash' in service
          assert 'safety.classify' in service

          forbidden = (
              'subprocess', 'os.system', 'eval(', 'exec(', 'compile(',
              '__import__(', 'requests.', 'aiohttp.', 'socket.', 'open(',
          )
          for token in forbidden:
              assert token not in service, token

          assert 'confirmatory_authorized: bool = False' in datasets
          assert 'research_preregistration_required' in datasets
          assert 'protocol.authorize_test_plan' in pipeline
          assert 'protocol.verify_authorization' in pipeline
          assert '"analysis_mode": analysis_mode' in pipeline
          assert '"protocol_snapshot": protocol_snapshot' in pipeline

          assert 'research_dataset_rows_not_exposed' in routes
          assert '/missions/{mission_id}/protocols' in routes
          assert '/protocols/{protocol_id}/correct-pvalues' in routes
          assert '"immutable_protocol_hashes"' in report
          assert 'VELIA_RESEARCH_PROTOCOL_OFFICER_ENABLED=false' in env
          PY
