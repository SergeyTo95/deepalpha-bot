name: Temporary coding quote hardening

on:
  push:
    branches:
      - feature/coding-token-quote-gate

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/coding-token-quote-gate
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply hardening patch
        run: |
          python - <<'PY'
          from pathlib import Path

          runtime_path = Path('services/velia_agent_chat_conflict_patch.py')
          text = runtime_path.read_text(encoding='utf-8')

          old = '        presentation["summary"] = (summary + ("\\n\\n" if summary else "") + line)[:1800]'
          new = '        presentation["summary"] = (line + ("\\n\\n" + summary if summary else ""))[:1800]'
          assert old in text
          text = text.replace(old, new, 1)

          old = '''        coding_job_before = (\n            coding_service.active_job(int(user_id), str(conversation_id))\n            if pricing_enabled and coding_scope\n            else None\n        )\n'''
          new = '''        if pricing_enabled and coding_scope:\n            try:\n                coding_quote.reconcile_quotes_for_user(\n                    user_id=int(user_id),\n                    conversation_id=str(conversation_id),\n                )\n            except Exception:\n                logger.exception(\n                    "VELIA_CODING_QUOTE_RECONCILE_SWEEP_FAILED user_id=%s conversation_id=%s",\n                    int(user_id),\n                    str(conversation_id),\n                )\n\n        coding_job_before = (\n            coding_service.active_job(int(user_id), str(conversation_id))\n            if pricing_enabled and coding_scope\n            else None\n        )\n'''
          assert old in text
          text = text.replace(old, new, 1)

          marker = '''                    return _decorate_quote_presentation(\n                        enriched,\n                        quote=quote,\n                        user_id=int(user_id),\n                        conversation_id=str(conversation_id),\n                        request_id=str(request_id or ""),\n                        message=message,\n                    )\n                raise\n'''
          replacement = '''                    return _decorate_quote_presentation(\n                        enriched,\n                        quote=quote,\n                        user_id=int(user_id),\n                        conversation_id=str(conversation_id),\n                        request_id=str(request_id or ""),\n                        message=message,\n                    )\n                if exc.code == "developer_coding_quote_already_started":\n                    raw = _coding_result(\n                        text=coding_quote.already_started_text(message, quote),\n                        request_id=request_id,\n                        reason="developer_coding_already_started",\n                        job=coding_job_before,\n                        quote=quote,\n                    )\n                    enriched = developer_presentation.enrich_result_best_effort(\n                        raw,\n                        user_id=int(user_id),\n                        conversation_id=str(conversation_id),\n                        request_id=str(request_id or ""),\n                        message=str(message or ""),\n                    )\n                    enriched = coding_quote.enrich_result_with_quote(\n                        enriched,\n                        user_id=int(user_id),\n                        conversation_id=str(conversation_id),\n                        request_id=str(request_id or ""),\n                        message=message,\n                        quote=quote,\n                    )\n                    return _decorate_quote_presentation(\n                        enriched,\n                        quote=quote,\n                        user_id=int(user_id),\n                        conversation_id=str(conversation_id),\n                        request_id=str(request_id or ""),\n                        message=message,\n                    )\n                raise\n'''
          assert marker in text
          text = text.replace(marker, replacement, 1)

          old = '''        except Exception:\n            if charged_quote and coding_job_before:\n                try:\n                    coding_quote.refund_quote(\n                        user_id=int(user_id),\n                        job_id=str(coding_job_before.get("job_id") or ""),\n                    )\n                except Exception:\n                    logger.exception(\n                        "VELIA_CODING_QUOTE_REFUND_FAILED job_id=%s user_id=%s",\n                        str(coding_job_before.get("job_id") or ""),\n                        int(user_id),\n                    )\n            raise\n'''
          new = '''        except Exception:\n            if charged_quote and coding_job_before:\n                job_id = str(coding_job_before.get("job_id") or "")\n                try:\n                    coding_quote.mark_refund_pending(\n                        user_id=int(user_id),\n                        job_id=job_id,\n                    )\n                except Exception:\n                    logger.exception(\n                        "VELIA_CODING_QUOTE_REFUND_PENDING_FAILED job_id=%s user_id=%s",\n                        job_id,\n                        int(user_id),\n                    )\n                try:\n                    coding_quote.refund_quote(\n                        user_id=int(user_id),\n                        job_id=job_id,\n                    )\n                except Exception:\n                    logger.exception(\n                        "VELIA_CODING_QUOTE_REFUND_FAILED job_id=%s user_id=%s",\n                        job_id,\n                        int(user_id),\n                    )\n            raise\n'''
          assert old in text
          text = text.replace(old, new, 1)

          old = '''        if charged_quote and coding_job_before:\n            if reason == "developer_coding_completed":\n                coding_quote.consume_quote(str(coding_job_before.get("job_id") or ""))\n                quote = coding_quote.quote_for_job(str(coding_job_before.get("job_id") or ""))\n            else:\n                try:\n                    quote = coding_quote.refund_quote(\n                        user_id=int(user_id),\n                        job_id=str(coding_job_before.get("job_id") or ""),\n                    )\n                except Exception:\n                    logger.exception(\n                        "VELIA_CODING_QUOTE_REFUND_FAILED job_id=%s user_id=%s",\n                        str(coding_job_before.get("job_id") or ""),\n                        int(user_id),\n                    )\n                    quote = charged_quote\n'''
          new = '''        if charged_quote and coding_job_before:\n            job_id = str(coding_job_before.get("job_id") or "")\n            if reason == "developer_coding_completed":\n                try:\n                    coding_quote.consume_quote(job_id)\n                    quote = coding_quote.quote_for_job(job_id)\n                except Exception:\n                    # GitHub execution already succeeded. Billing finalization is\n                    # reconciled later; never turn a successful coding result into\n                    # a client-visible failure or invite a dangerous retry.\n                    logger.exception(\n                        "VELIA_CODING_QUOTE_CONSUME_DEFERRED job_id=%s user_id=%s",\n                        job_id,\n                        int(user_id),\n                    )\n                    quote = charged_quote\n            else:\n                try:\n                    coding_quote.mark_refund_pending(\n                        user_id=int(user_id),\n                        job_id=job_id,\n                    )\n                except Exception:\n                    logger.exception(\n                        "VELIA_CODING_QUOTE_REFUND_PENDING_FAILED job_id=%s user_id=%s",\n                        job_id,\n                        int(user_id),\n                    )\n                try:\n                    quote = coding_quote.refund_quote(\n                        user_id=int(user_id),\n                        job_id=job_id,\n                    )\n                except Exception:\n                    logger.exception(\n                        "VELIA_CODING_QUOTE_REFUND_DEFERRED job_id=%s user_id=%s",\n                        job_id,\n                        int(user_id),\n                    )\n                    quote = {**charged_quote, "status": "refund_pending"}\n'''
          assert old in text
          text = text.replace(old, new, 1)

          old = '''    elif status == "insufficient":\n        line = coding_quote.insufficient_text(message, quote)\n    elif status == "consumed":\n'''
          new = '''    elif status == "insufficient":\n        line = coding_quote.insufficient_text(message, quote)\n    elif status == "charged":\n        line = coding_quote.already_started_text(message, quote)\n    elif status == "refund_pending":\n        line = (\n            f"Возврат {price} VELIA-токенов за незавершённое выполнение поставлен в очередь."\n            if russian else f"A refund of {price} VELIA tokens is pending reconciliation."\n        )\n    elif status == "consumed":\n'''
          assert old in text
          text = text.replace(old, new, 1)
          runtime_path.write_text(text, encoding='utf-8')

          quote_path = Path('services/velia_developer_coding_quote_service.py')
          text = quote_path.read_text(encoding='utf-8')
          old = '''            SELECT q.job_id, q.status, j.status\n            FROM velia_developer_coding_quotes q\n'''
          new = '''            SELECT q.job_id, q.status AS quote_status, j.status AS job_status\n            FROM velia_developer_coding_quotes q\n'''
          assert old in text
          text = text.replace(old, new, 1)
          quote_path.write_text(text, encoding='utf-8')

          service_test = Path('tests/test_velia_developer_coding_quote_service.py')
          text = service_test.read_text(encoding='utf-8')
          text = text.replace('self.quote_status in {"charged", "consumed"}', 'self.quote_status in {"charged", "consumed", "refund_pending"}')
          old = '''def test_consumed_quote_is_idempotent_and_never_debits_again(monkeypatch):\n    cursor = _Cursor(balance=500, quote_status="consumed", quoted=120)\n    conn = _Connection(cursor)\n    monkeypatch.setattr(quote, "ensure_coding_quote_tables", lambda: None)\n    monkeypatch.setattr(quote, "get_connection", lambda: conn)\n\n    result = quote.charge_quote(user_id=7, job_id="job-1")\n\n    assert result["status"] == "consumed"\n    assert not any("UPDATE users SET token_balance" in sql for sql, _ in cursor.statements)\n    assert conn.commits == 1\n'''
          new = '''def test_duplicate_approval_for_consumed_quote_is_rejected_without_second_debit(monkeypatch):\n    cursor = _Cursor(balance=500, quote_status="consumed", quoted=120)\n    conn = _Connection(cursor)\n    monkeypatch.setattr(quote, "ensure_coding_quote_tables", lambda: None)\n    monkeypatch.setattr(quote, "get_connection", lambda: conn)\n\n    with pytest.raises(quote.CodingQuoteError) as exc:\n        quote.charge_quote(user_id=7, job_id="job-1")\n\n    assert exc.value.code == "developer_coding_quote_already_started"\n    assert not any("UPDATE users SET token_balance" in sql for sql, _ in cursor.statements)\n\n\ndef test_refund_pending_quote_can_be_retried_exactly_once(monkeypatch):\n    cursor = _Cursor(balance=380, quote_status="refund_pending", quoted=120)\n    conn = _Connection(cursor)\n    monkeypatch.setattr(quote, "ensure_coding_quote_tables", lambda: None)\n    monkeypatch.setattr(quote, "get_connection", lambda: conn)\n\n    result = quote.refund_quote(user_id=7, job_id="job-1")\n\n    assert result["status"] == "refunded"\n    credits = [sql for sql, _ in cursor.statements if "UPDATE users SET token_balance=token_balance+%s" in sql]\n    assert len(credits) == 1\n'''
          assert old in text
          text = text.replace(old, new, 1)
          service_test.write_text(text, encoding='utf-8')

          runtime_test = Path('tests/test_velia_developer_coding_quote_runtime.py')
          text = runtime_test.read_text(encoding='utf-8')
          marker = '    monkeypatch.setattr(runtime.coding_service, "active_job", active_job)\n'
          replacement = marker + '    monkeypatch.setattr(runtime.coding_quote, "reconcile_quotes_for_user", lambda **kwargs: {})\n'
          assert marker in text
          text = text.replace(marker, replacement, 1)

          old = '''    events = []\n    monkeypatch.setattr(runtime.coding_quote, "refund_quote", lambda **kwargs: events.append("refund") or {\n'''
          new = '''    events = []\n    monkeypatch.setattr(runtime.coding_quote, "mark_refund_pending", lambda **kwargs: events.append("refund_pending") or {\n        "quoted_tokens": 120,\n        "balance_tokens": 500,\n        "status": "refund_pending",\n    })\n    monkeypatch.setattr(runtime.coding_quote, "refund_quote", lambda **kwargs: events.append("refund") or {\n'''
          assert old in text
          text = text.replace(old, new, 1)
          text = text.replace('    assert events == ["refund"]\n', '    assert events == ["refund_pending", "refund"]\n', 1)

          text = text.replace(
              '    assert "120 VELIA-токенов" in summary\n',
              '    assert summary.startswith("Стоимость выполнения всего плана — 120 VELIA-токенов")\n',
              1,
          )

          text += '''\n\ndef test_duplicate_approval_for_charged_quote_never_reenters_execution_or_refunds(monkeypatch):\n    monkeypatch.setattr(runtime, "_quote_enabled", lambda: True)\n    _patch_router(monkeypatch, message="Выполни план", active_job=lambda *args: JOB)\n    charged = {\n        "job_id": "job-1",\n        "user_id": 7,\n        "quoted_tokens": 120,\n        "balance_tokens": 500,\n        "status": "charged",\n        "charged_tokens": 120,\n    }\n    monkeypatch.setattr(runtime.coding_quote, "quote_for_job", lambda job_id: charged)\n\n    def duplicate(**kwargs):\n        raise runtime.coding_quote.CodingQuoteError(\n            "developer_coding_quote_already_started", status=409, quote=charged\n        )\n\n    monkeypatch.setattr(runtime.coding_quote, "charge_quote", duplicate)\n    monkeypatch.setattr(runtime.coding_quote, "refund_quote", lambda **kwargs: pytest.fail("duplicate approval must not refund"))\n    monkeypatch.setattr(runtime.coding_quote, "enrich_result_with_quote", lambda result, **kwargs: result)\n    monkeypatch.setattr(runtime, "_decorate_quote_presentation", lambda result, **kwargs: result)\n    monkeypatch.setattr(runtime.developer_presentation, "enrich_result_best_effort", _presentation)\n    module = SimpleNamespace(\n        generate_velia_chat_result=lambda *args, **kwargs: pytest.fail("duplicate approval must not execute")\n    )\n    runtime.install(module)\n    result = module.generate_velia_chat_result(\n        "prompt", user_id=7, conversation_id="conversation-1", request_id="request-1"\n    )\n    assert result["reason"] == "developer_coding_already_started"\n\n\ndef test_successful_execution_survives_transient_consume_failure(monkeypatch):\n    monkeypatch.setattr(runtime, "_quote_enabled", lambda: True)\n    active_values = iter([JOB, JOB, None])\n    _patch_router(monkeypatch, message="Выполни план", active_job=lambda *args: next(active_values, None))\n    pending = {\n        "job_id": "job-1",\n        "user_id": 7,\n        "quoted_tokens": 120,\n        "balance_tokens": 500,\n        "status": "pending",\n    }\n    monkeypatch.setattr(runtime.coding_quote, "quote_for_job", lambda job_id: pending)\n    monkeypatch.setattr(runtime.coding_quote, "charge_quote", lambda **kwargs: {**pending, "status": "charged", "charged_tokens": 120})\n    monkeypatch.setattr(runtime.coding_quote, "consume_quote", lambda job_id: (_ for _ in ()).throw(RuntimeError("db transient")))\n    monkeypatch.setattr(runtime.coding_quote, "refund_quote", lambda **kwargs: pytest.fail("successful execution must not refund"))\n    monkeypatch.setattr(runtime.coding_quote, "enrich_result_with_quote", lambda result, **kwargs: result)\n    monkeypatch.setattr(runtime, "_decorate_quote_presentation", lambda result, **kwargs: result)\n    monkeypatch.setattr(runtime.developer_presentation, "enrich_result_best_effort", _presentation)\n\n    module = SimpleNamespace(generate_velia_chat_result=lambda *args, **kwargs: {\n        "ok": True,\n        "provider": "velia_coding_agent",\n        "reason": "developer_coding_completed",\n        "request_id": kwargs.get("request_id"),\n        "text": "done",\n    })\n    runtime.install(module)\n    result = module.generate_velia_chat_result(\n        "prompt", user_id=7, conversation_id="conversation-1", request_id="request-1"\n    )\n    assert result["reason"] == "developer_coding_completed"\n'''
          runtime_test.write_text(text, encoding='utf-8')

          workflow = Path('.github/workflows/velia-coding-token-quote.yml')
          text = workflow.read_text(encoding='utf-8')
          marker = '          assert "coding_quote.consume_quote" in runtime\n'
          replacement = marker + '          assert "coding_quote.mark_refund_pending" in runtime\n          assert "coding_quote.reconcile_quotes_for_user" in runtime\n          assert "developer_coding_quote_already_started" in quote\n          assert "refund_pending" in quote\n'
          assert marker in text
          workflow.write_text(text.replace(marker, replacement, 1), encoding='utf-8')
          PY
      - name: Validate focused tests
        run: |
          python -m pip install -q -r requirements.txt pytest pytest-asyncio
          python -m py_compile services/velia_developer_coding_quote_service.py services/velia_agent_chat_conflict_patch.py tests/test_velia_developer_coding_quote_service.py tests/test_velia_developer_coding_quote_runtime.py
          python -m pytest -q tests/test_velia_developer_coding_quote_service.py tests/test_velia_developer_coding_quote_runtime.py
      - name: Commit final patch and remove helper
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/_tmp-coding-quote-hardening.yml
          git add services/velia_developer_coding_quote_service.py services/velia_agent_chat_conflict_patch.py tests/test_velia_developer_coding_quote_service.py tests/test_velia_developer_coding_quote_runtime.py .github/workflows/velia-coding-token-quote.yml
          git commit -m "Harden coding quote financial reconciliation"
          git push origin HEAD:feature/coding-token-quote-gate
