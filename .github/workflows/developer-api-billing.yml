name: Developer API billing

on:
  pull_request:
    branches:
      - feature/turbo-short-term-btc
    paths:
      - "developer_api_admin_routes.py"
      - "developer_api_routes.py"
      - "run_web_process.py"
      - "services/developer_api_billing_service.py"
      - "services/developer_api_service.py"
      - "tests/test_developer_api_billing.py"
      - "tests/test_developer_api_foundation.py"
      - "docs/developer_api_v1.md"
      - "docs/developer_api_billing.md"
      - ".github/workflows/developer-api-billing.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: developer-api-billing-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  billing-foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest pytest-asyncio

      - name: Compile billing and API modules
        run: |
          python -m py_compile \
            services/developer_api_billing_service.py \
            services/developer_api_service.py \
            developer_api_admin_routes.py \
            developer_api_routes.py \
            run_web_process.py

      - name: Verify ledger remains append-only
        run: |
          grep -q "BEFORE UPDATE OR DELETE ON api_credit_ledger" services/developer_api_billing_service.py
          ! grep -RIn "UPDATE api_credit_ledger\|DELETE FROM api_credit_ledger" \
            services/developer_api_billing_service.py developer_api_admin_routes.py

      - name: Verify public execution remains disabled
        run: |
          ! grep -En "add_(post|get)\(.*(/api/v1/analyses|/api/v1/opportunities)" developer_api_routes.py

      - name: Run focused tests
        run: |
          PYTHONPATH=. python -m pytest -q \
            tests/test_developer_api_billing.py \
            tests/test_developer_api_foundation.py
