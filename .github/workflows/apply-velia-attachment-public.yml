name: Apply VELIA attachment public contract

on:
  push:
    branches:
      - feature/velia-file-analyst-attachments
    paths:
      - .github/workflows/apply-velia-attachment-public.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feature/velia-file-analyst-attachments
          fetch-depth: 0

      - name: Apply and verify patch
        run: |
          git apply --check .github/velia-attachment-public.patch
          git apply .github/velia-attachment-public.patch
          rm -f .github/velia-attachment-public.patch
          rm -f .github/workflows/apply-velia-attachment-public.yml

      - name: Commit public contract
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "security: hide private VELIA attachment fields"
          git push origin HEAD:feature/velia-file-analyst-attachments
