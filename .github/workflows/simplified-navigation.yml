name: Simplified bot navigation

on:
  pull_request:
    branches:
      - feature/turbo-short-term-btc
    paths:
      - "services/simplified_navigation_patch.py"
      - "run_bot_process.py"
      - "tests/test_simplified_navigation_patch.py"
      - ".github/workflows/simplified-navigation.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: simplified-navigation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  simplified-navigation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest pytest-asyncio

      - name: Compile changed modules
        run: |
          python -m py_compile services/simplified_navigation_patch.py run_bot_process.py

      - name: Ensure removed buttons stay hidden
        run: |
          ! grep -En "KeyboardButton\(\"(💡 Сигнал часа|💡 Signal of the hour|🔮 Личный сигнал|🔮 Personal signal)\"\)" services/simplified_navigation_patch.py

      - name: Run focused tests
        run: |
          PYTHONPATH=. python -m pytest -q \
            tests/test_simplified_navigation_patch.py \
            tests/test_free_opportunity_menu_patch.py \
            tests/test_free_opportunity_scanner.py
