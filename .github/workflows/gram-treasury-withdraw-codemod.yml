name: Gram Treasury Withdraw Codemod

on:
  push:
    branches:
      - feature/gram-treasury-withdraw-v1

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feature/gram-treasury-withdraw-v1
          fetch-depth: 0

      - name: Apply codemod
        run: python scripts/apply_gram_treasury_withdraw_admin.py

      - name: Compile changed Python
        run: python -m py_compile bot/admin.py services/gram_treasury_withdrawal_service.py

      - name: Commit generated admin changes
        shell: bash
        run: |
          if git diff --quiet -- bot/admin.py; then
            echo "No generated changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bot/admin.py
          git commit -m "feat: add Gram Treasury withdrawal admin flow"
          git push origin HEAD:feature/gram-treasury-withdraw-v1
