name: Temporary VELIA symbol windows

on:
  pull_request:
    branches:
      - feature/turbo-short-term-btc
    paths:
      - '.github/scripts/_tmp_apply_velia_symbol_windows.py'
      - '.github/workflows/_tmp_velia_symbol_windows.yml'

concurrency:
  group: velia-symbol-windows
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  patch-test-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: perf/velia-developer-symbol-windows
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
      - name: Apply symbol-window patch
        run: python .github/scripts/_tmp_apply_velia_symbol_windows.py
      - name: Compile affected modules
        run: |
          python -m py_compile \
            services/velia_developer_github_service.py \
            services/velia_developer_fast_path_service.py
      - name: Run full Developer regressions
        env:
          PYTHONPATH: .
        run: |
          pytest -q \
            tests/test_velia_developer_fast_path_service.py \
            tests/test_velia_developer_fast_path_bootstrap.py \
            tests/test_velia_developer_agent_service.py \
            tests/test_velia_developer_github_service.py \
            tests/test_velia_developer_project_service.py \
            tests/test_velia_developer_chat_runtime_patch.py \
            tests/test_velia_developer_branch_selection.py \
            tests/test_velia_developer_bootstrap.py \
            tests/test_velia_mobile_streaming_service.py
      - name: Verify retrieval and cost contracts
        run: |
          grep -q 'def read_relevant_windows' services/velia_developer_github_service.py
          grep -q 'def _relevant_line_windows' services/velia_developer_github_service.py
          grep -q 'max_windows_per_file=max_windows_per_file' services/velia_developer_fast_path_service.py
          grep -q 'VELIA_DEVELOPER_FAST_EVIDENCE_CHARS_PER_WINDOW' services/velia_developer_fast_path_service.py
          grep -q 'VELIA_DEVELOPER_MAX_MODEL_CALLS' services/velia_developer_fast_path_service.py
          ! grep -R -nE 'create_branch|open_pull_request|apply_patch|run_command|contents.:.?write' services/velia_developer_fast_path_service.py services/velia_developer_github_service.py
      - name: Commit product code
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            services/velia_developer_github_service.py \
            services/velia_developer_fast_path_service.py \
            tests/test_velia_developer_fast_path_service.py
          git commit -m 'Improve VELIA Developer symbol-aware retrieval'
          git push origin HEAD:perf/velia-developer-symbol-windows
