name: Live API commercial launch

on:
  pull_request:
    branches:
      - feature/turbo-short-term-btc
    paths:
      - "developer_api_commercial_routes.py"
      - "developer_api_commercial_admin_routes.py"
      - "run_api_commercial_worker.py"
      - "run_web_process.py"
      - "services/developer_api_commercial_launch_service.py"
      - "services/developer_api_commercial_runtime_patch.py"
      - "services/developer_api_openapi_service.py"
      - "webapp/developer.html"
      - "webapp/developer_commercial.js"
      - "webapp/developer_commercial.css"
      - "docs/developer_api_v1.md"
      - "docs/api_commercial_launch.md"
      - "docs/openapi.json"
      - "docs/deepalpha_api.postman_collection.json"
      - "scripts/live_api_commercial_launch_smoke.py"
      - "tests/test_live_api_commercial_launch.py"
      - "tests/test_api_commercial_launch.py"
      - "tests/test_openapi_docs.py"
      - ".env.example"
      - ".github/workflows/live-api-commercial-launch.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: live-api-commercial-launch-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  commercial-launch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest pytest-asyncio

      - name: Compile commercial Python modules
        run: |
          python -m py_compile developer_api_commercial_routes.py
          python -m py_compile developer_api_commercial_admin_routes.py
          python -m py_compile run_api_commercial_worker.py
          python -m py_compile run_web_process.py
          python -m py_compile services/developer_api_commercial_launch_service.py
          python -m py_compile services/developer_api_commercial_runtime_patch.py
          python -m py_compile services/developer_api_openapi_service.py
          python -m py_compile scripts/live_api_commercial_launch_smoke.py

      - name: Validate Developer Portal JavaScript
        run: node --check webapp/developer_commercial.js

      - name: Validate committed API artifacts
        run: |
          python -m json.tool docs/openapi.json >/dev/null
          python -m json.tool docs/deepalpha_api.postman_collection.json >/dev/null
          PYTHONPATH=. python -m pytest -q tests/test_openapi_docs.py tests/test_openapi_contract.py

      - name: Run focused commercial launch tests
        run: |
          PYTHONPATH=. python -m pytest -q \
            tests/test_live_api_commercial_launch.py \
            tests/test_api_commercial_launch.py

      - name: Run Developer API regression suites
        run: |
          PYTHONPATH=. python -m pytest -q \
            tests/test_developer_api_foundation.py \
            tests/test_developer_api_billing.py \
            tests/test_developer_portal.py \
            tests/test_quick_analysis_api.py \
            tests/test_api_beta_hardening.py \
            tests/test_signed_webhooks.py \
            tests/test_opportunity_scan_api.py \
            tests/test_openapi_contract.py
