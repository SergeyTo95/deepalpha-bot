name: Apply GitHub OAuth installation binding

on:
  pull_request:
    branches:
      - feature/turbo-short-term-btc
    paths:
      - 'tools/apply_github_oauth_installation_binding.py'
      - '.github/workflows/apply-github-oauth-installation-binding.yml'

permissions:
  contents: write

jobs:
  apply-test-and-clean:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/velia-developer-readonly
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
      - name: Apply OAuth binding patch
        run: python tools/apply_github_oauth_installation_binding.py
      - name: Compile Developer modules
        run: |
          python -m py_compile \
            services/velia_developer_github_service.py \
            services/velia_developer_project_service.py \
            services/velia_developer_agent_service.py \
            services/velia_developer_routes.py \
            run_web_process.py
      - name: Run focused Developer tests
        env:
          PYTHONPATH: .
        run: |
          pytest -q \
            tests/test_velia_developer_github_service.py \
            tests/test_velia_developer_project_service.py \
            tests/test_velia_developer_agent_service.py \
            tests/test_velia_developer_bootstrap.py
      - name: Verify secrets are not persisted or logged
        run: |
          ! grep -R -nE 'INSERT.*access_token|UPDATE.*access_token|authorized_user_token|print\(.*client_secret|logger\..*client_secret' services/velia_developer_*.py
          ! grep -R -nE 'create_branch|open_pull_request|apply_patch|run_command|contents.:.?write' services/velia_developer_*.py
      - name: Commit clean product source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/apply-github-oauth-installation-binding.yml tools/apply_github_oauth_installation_binding.py
          git add \
            services/velia_developer_github_service.py \
            services/velia_developer_routes.py \
            tests/test_velia_developer_github_service.py \
            tests/test_velia_developer_bootstrap.py
          git commit -m 'Verify GitHub installation ownership with OAuth'
          git push origin HEAD:feature/velia-developer-readonly
