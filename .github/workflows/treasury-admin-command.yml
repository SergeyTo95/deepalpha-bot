name: Treasury admin command routing

on:
  pull_request:
    paths:
      - "bot/admin.py"
      - "telegram_bot.py"
      - "app.py"
      - "requirements.txt"
      - "tests/test_treasury_admin_command.py"
      - ".github/workflows/treasury-admin-command.yml"
  push:
    paths:
      - "bot/admin.py"
      - "telegram_bot.py"
      - "app.py"
      - "requirements.txt"
      - "tests/test_treasury_admin_command.py"
      - ".github/workflows/treasury-admin-command.yml"

jobs:
  treasury-admin-command:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest
      - name: Run focused treasury admin command regression tests
        run: |
          set -o pipefail
          PYTHONPATH=. python -m pytest \
            -vv -rA --tb=long -s \
            tests/test_treasury_admin_command.py \
            2>&1 | tee treasury-admin-command-test.log
      - name: Upload treasury routing test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: treasury-admin-command-test-log
          path: treasury-admin-command-test.log
