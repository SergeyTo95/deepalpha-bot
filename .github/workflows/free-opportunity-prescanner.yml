name: Free opportunity pre-scanner

on:
  pull_request:
    branches:
      - feature/turbo-short-term-btc
    paths:
      - "agents/opportunity_agent.py"
      - "services/free_opportunity_scanner.py"
      - "services/free_opportunity_runtime_patch.py"
      - "run_bot_process.py"
      - "tests/test_free_opportunity_scanner.py"
      - "docs/free_opportunity_prescanner.md"
      - ".github/workflows/free-opportunity-prescanner.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: free-opportunity-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  free-opportunity:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest

      - name: Compile changed modules
        run: |
          python -m py_compile \
            agents/opportunity_agent.py \
            services/free_opportunity_scanner.py \
            services/free_opportunity_runtime_patch.py \
            run_bot_process.py

      - name: Enforce zero paid-provider imports in scanner
        run: |
          ! grep -Eini "llm_service|call_llm|call_gemini|call_kimi|NewsAgent|DecisionAgent|gemini_gateway|kimi_gateway" services/free_opportunity_scanner.py

      - name: Run focused tests
        run: |
          PYTHONPATH=. python -m pytest -q tests/test_free_opportunity_scanner.py
