name: Probe VELIA Developer stream resilience

on:
  pull_request:
    branches:
      - feature/turbo-short-term-btc
    paths:
      - '.github/workflows/_tmp_probe_velia_developer_stream_resilience.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe production startup and streaming auth boundary
        run: |
          python3 - <<'PY'
          import json
          import socket
          import ssl
          import urllib.error
          import urllib.request

          base = "https://deepalpha-ai.com"
          host = "deepalpha-ai.com"
          addresses = sorted({item[4][0] for item in socket.getaddrinfo(host, 443, type=socket.SOCK_STREAM)})
          print("dns_addresses=", addresses)
          if not addresses:
              raise SystemExit("DNS returned no addresses")

          context = ssl.create_default_context()

          def request_json(path, *, expected, method="GET", payload=None):
              data = None if payload is None else json.dumps(payload).encode("utf-8")
              request = urllib.request.Request(
                  base + path,
                  data=data,
                  method=method,
                  headers={
                      "Accept": "application/json",
                      "Content-Type": "application/json",
                      "User-Agent": "VELIA-developer-stream-resilience-probe/1",
                  },
              )
              try:
                  with urllib.request.urlopen(request, timeout=20, context=context) as response:
                      raw = response.read(4096)
                      body = json.loads(raw.decode("utf-8")) if raw and response.headers.get_content_type() == "application/json" else {}
                      status = response.status
              except urllib.error.HTTPError as error:
                  raw = error.read(4096)
                  try:
                      body = json.loads(raw.decode("utf-8")) if raw else {}
                  except Exception:
                      body = {}
                  status = error.code
              print(f"{method} {path} status={status} error={body.get('error')}")
              if status != expected:
                  raise SystemExit(f"unexpected status for {path}: {status}, expected {expected}")
              return body

          request_json("/", expected=200)
          request_json("/mobile-connect", expected=200)
          stream = request_json(
              "/mobile-api/v1/conversations/probe/messages/stream",
              expected=401,
              method="POST",
              payload={
                  "content": "probe",
                  "idempotency_key": "probe-12345678",
              },
          )
          if stream.get("error") != "unauthorized":
              raise SystemExit(f"unexpected stream boundary: {stream}")
          print("production_probe=success")
          PY
