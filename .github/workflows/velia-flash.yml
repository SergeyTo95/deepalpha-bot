name: VELIA Flash
on:
  pull_request:
    branches: [feature/turbo-short-term-btc]
    paths:
      - 'services/velia_flash_service.py'
      - 'services/velia*chat*'
      - 'services/velia_mobile*'
      - 'velia_mobile_routes.py'
      - 'bonsai_worker/**'
      - 'tests/test_velia_flash.py'
      - '.github/workflows/velia-flash.yml'
  push:
    branches: [feature/turbo-short-term-btc]
    paths:
      - 'services/velia_flash_service.py'
      - 'tests/test_velia_flash.py'
      - '.github/workflows/velia-flash.yml'
permissions:
  contents: read
jobs:
  flash:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: velia_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      VELIA_FLASH_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/velia_test
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pytest requests psycopg2-binary python-dotenv aiohttp tonsdk cryptography pillow pypdf python-multipart
      - run: python -m pytest -q tests/test_velia_flash.py tests/test_velia_chat_service.py tests/test_velia_mobile_hardening_service.py tests/test_velia_chat_streaming_runtime_patch.py tests/test_velia_attachment_transport_compatibility.py tests/test_velia_attachment_review_regressions.py tests/test_velia_attachment_final_privacy_routing.py tests/test_velia_attachment_final_review_regressions.py
