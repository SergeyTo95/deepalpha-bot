name: Finalize VELIA Developer integration

on:
  push:
    branches:
      - feature/velia-developer-readonly
    paths:
      - '.github/workflows/apply-velia-developer-registration.yml'

permissions:
  contents: write

jobs:
  finalize-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/velia-developer-readonly
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
      - name: Apply branch validator hardening
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('services/velia_developer_github_service.py')
          text = path.read_text(encoding='utf-8')
          old = 'or normalized.endswith("/"):'
          new = 'or normalized.endswith("/") or "//" in normalized:'
          if new not in text:
              if old not in text:
                  raise SystemExit('branch validator anchor not found')
              text = text.replace(old, new, 1)
              path.write_text(text, encoding='utf-8')
          PY
      - name: Compile changed modules and bootstrap
        run: |
          python -m py_compile \
            services/velia_developer_github_service.py \
            services/velia_developer_project_service.py \
            services/velia_developer_agent_service.py \
            services/velia_developer_routes.py \
            run_web_process.py
      - name: Run focused tests
        env:
          PYTHONPATH: .
        run: |
          pytest -q \
            tests/test_velia_developer_github_service.py \
            tests/test_velia_developer_project_service.py \
            tests/test_velia_developer_agent_service.py
      - name: Verify integration and read-only boundary
        run: |
          grep -q 'from services.velia_developer_routes import setup_velia_developer_routes' run_web_process.py
          grep -q 'setup_velia_developer_routes(' run_web_process.py
          ! grep -R -nE 'create_branch|open_pull_request|apply_patch|run_command|contents.:.?write' services/velia_developer_*.py
      - name: Commit clean product source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/apply-velia-developer-registration.yml
          git add services/velia_developer_github_service.py run_web_process.py
          git commit -m 'Finalize VELIA Developer read-only integration'
          git push origin HEAD:feature/velia-developer-readonly
