name: Apply VELIA Developer registration

on:
  push:
    branches:
      - feature/velia-developer-readonly
    paths:
      - 'tools/register_velia_developer_routes.py'
      - '.github/workflows/apply-velia-developer-registration.yml'
  pull_request:
    branches:
      - feature/turbo-short-term-btc
    paths:
      - 'tools/register_velia_developer_routes.py'
      - '.github/workflows/apply-velia-developer-registration.yml'

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/velia-developer-readonly
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
      - name: Register routes
        run: python tools/register_velia_developer_routes.py
      - name: Compile changed modules
        run: |
          python -m py_compile \
            services/velia_developer_github_service.py \
            services/velia_developer_project_service.py \
            services/velia_developer_agent_service.py \
            services/velia_developer_routes.py \
            "$(cat .developer_registration_path)"
      - name: Run focused tests
        env:
          PYTHONPATH: .
        run: |
          pytest -q \
            tests/test_velia_developer_github_service.py \
            tests/test_velia_developer_project_service.py \
            tests/test_velia_developer_agent_service.py
      - name: Verify route registration
        run: |
          target="$(cat .developer_registration_path)"
          grep -q 'from services.velia_developer_routes import setup_velia_developer_routes' "$target"
          grep -q 'setup_velia_developer_routes(' "$target"
      - name: Commit clean integration
        run: |
          target="$(cat .developer_registration_path)"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/apply-velia-developer-registration.yml tools/register_velia_developer_routes.py
          rm -f .developer_registration_path
          git add "$target"
          git commit -m 'Register VELIA Developer read-only routes'
          git push origin HEAD:feature/velia-developer-readonly
