name: Velia projects and DeepAlpha
on:
  pull_request:
  push:
    branches: [feature/turbo-short-term-btc]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    if: ${{ github.event_name != 'push' }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: velia_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/velia_test
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt pytest pytest-asyncio
      - run: >-
          python -m pytest -q tests/test_velia_projects.py
          tests/test_velia_plugin_router_limits.py tests/test_velia_plugin_service.py
          tests/test_velia_chat_streaming_runtime_patch.py tests/test_velia_mobile_streaming_service.py
      - run: python -m compileall -q services velia_project_routes.py run_web_process.py
