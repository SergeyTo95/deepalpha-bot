name: Apply VELIA Developer OAuth callback fix

on:
  push:
    branches:
      - fix/velia-developer-oauth-callback-discovery

permissions:
  contents: write

jobs:
  apply-test-and-clean:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/velia-developer-oauth-callback-discovery
          fetch-depth: 0
      - name: Apply product patch
        run: python tools/apply_velia_developer_oauth_callback_fix.py
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
      - name: Compile changed modules
        run: |
          python -m py_compile \
            services/velia_developer_github_service.py \
            services/velia_developer_routes.py
      - name: Run focused regression tests
        env:
          PYTHONPATH: .
        run: |
          pytest -q \
            tests/test_velia_developer_github_service.py \
            tests/test_velia_developer_bootstrap.py
      - name: Commit clean product fix
        run: |
          rm -f tools/apply_velia_developer_oauth_callback_fix.py
          rm -f .github/workflows/apply-velia-developer-oauth-callback-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add services/velia_developer_github_service.py \
                  services/velia_developer_routes.py \
                  tests/test_velia_developer_github_service.py \
                  tools/apply_velia_developer_oauth_callback_fix.py \
                  .github/workflows/apply-velia-developer-oauth-callback-fix.yml
          git commit -m "Fix VELIA Developer OAuth callback installation discovery"
          git push origin HEAD:fix/velia-developer-oauth-callback-discovery
