name: VELIA dedicated Telegram bot
on:
  push:
    branches: [feature/turbo-short-term-btc, fix/velia-quantum-deploy-isolation]
    paths: ['services/velia_telegram*', 'services/velia_admin_telegram_auth_service.py', 'tests/test_velia_telegram*', '.github/workflows/velia-telegram.yml']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: velia_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      VELIA_FLASH_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/velia_test
      PYTHONPATH: vendor/aiogram_compat
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt pytest
      - run: python -m pytest -q tests/test_velia_telegram_runtime.py tests/test_velia_telegram_pairing.py tests/test_velia_control_center.py
