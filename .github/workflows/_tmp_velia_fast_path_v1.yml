name: Temporary VELIA Developer Fast Path v1

on:
  push:
    branches:
      - feature/velia-developer-fast-path-v1

permissions:
  contents: write

jobs:
  apply-test-clean:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: feature/velia-developer-fast-path-v1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
      - name: Apply Fast Path integration
        run: python .github/scripts/_tmp_apply_velia_fast_path_v1.py
      - name: Compile affected modules
        run: |
          python -m py_compile \
            services/kimi_gateway.py \
            services/velia_developer_agent_service.py \
            services/velia_developer_fast_path_service.py \
            services/velia_developer_chat_runtime_patch.py \
            services/velia_developer_routes.py \
            run_web_process.py
      - name: Run Fast Path and complete Developer regressions
        env:
          PYTHONPATH: .
        run: |
          pytest -q \
            tests/test_velia_developer_fast_path_service.py \
            tests/test_velia_developer_fast_path_bootstrap.py \
            tests/test_velia_developer_agent_service.py \
            tests/test_velia_developer_github_service.py \
            tests/test_velia_developer_project_service.py \
            tests/test_velia_developer_chat_runtime_patch.py \
            tests/test_velia_developer_branch_selection.py \
            tests/test_velia_developer_bootstrap.py \
            tests/test_velia_mobile_streaming_service.py
      - name: Verify Fast Path cost and safety contracts
        run: |
          grep -q 'VELIA_DEVELOPER_MAX_MODEL_CALLS' services/velia_developer_fast_path_service.py
          grep -q 'VELIA_DEVELOPER_MAX_COST_USD' services/velia_developer_fast_path_service.py
          grep -q 'max_attempts=1' services/velia_developer_fast_path_service.py
          grep -q 'feature="velia_developer_fast"' services/velia_developer_fast_path_service.py
          grep -q 'VELIA_DEVELOPER_RESULT_CACHE_TTL_SECONDS' services/velia_developer_fast_path_service.py
          grep -q 'velia_developer_fast_path_service as agent_service' services/velia_developer_chat_runtime_patch.py
          grep -q 'velia_developer_fast_path_service as agent_service' services/velia_developer_routes.py
          grep -q '"velia_developer_fast"' services/kimi_gateway.py
          ! grep -R -nE 'create_branch|open_pull_request|apply_patch|run_command|contents.:.?write' services/velia_developer_fast_path_service.py
      - name: Remove temporary automation
        run: |
          rm .github/scripts/_tmp_apply_velia_fast_path_v1.py
          rm .github/workflows/_tmp_velia_fast_path_v1.yml
      - name: Commit clean product patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            services/kimi_gateway.py \
            services/velia_developer_fast_path_service.py \
            services/velia_developer_chat_runtime_patch.py \
            services/velia_developer_routes.py \
            tests/test_velia_developer_fast_path_service.py \
            tests/test_velia_developer_fast_path_bootstrap.py \
            .github/workflows/velia-developer-readonly.yml \
            .github/scripts/_tmp_apply_velia_fast_path_v1.py \
            .github/workflows/_tmp_velia_fast_path_v1.yml
          git commit -m 'Add VELIA Developer Fast Path v1'
          git push origin HEAD:feature/velia-developer-fast-path-v1
