name: VELIA Model Lab

on:
  pull_request:
    branches: [feature/turbo-short-term-btc]
    paths:
      - 'admin_routes.py'
      - 'run_velia_research_worker.py'
      - 'services/velia_model_lab_*.py'
      - 'services/velia_admin_security_service.py'
      - 'services/velia_flash_service.py'
      - 'tests/test_velia_model_lab.py'
      - '.github/workflows/velia-model-lab.yml'
  push:
    branches: [feature/turbo-short-term-btc]
    paths:
      - 'admin_routes.py'
      - 'run_velia_research_worker.py'
      - 'services/velia_model_lab_*.py'
      - 'tests/test_velia_model_lab.py'
      - '.github/workflows/velia-model-lab.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  model-lab:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: velia_model_lab_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      VELIA_MODEL_LAB_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/velia_model_lab_test
      VELIA_MODEL_LAB_NATIVE_POSTGRES_TESTS: '1'
      VELIA_MODEL_LAB_EMBEDDED_WORKER_ENABLED: 'false'
      VELIA_FLASH_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/velia_model_lab_test
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt pytest
      - name: Compile lab boundary
        run: >-
          python -m py_compile admin_routes.py run_velia_research_worker.py
          services/velia_model_lab_service.py services/velia_model_lab_routes.py
      - name: Owner security, durable jobs, concurrency, datasets and Flash regression
        run: >-
          python -m pytest -q tests/test_velia_model_lab.py tests/test_velia_flash.py
          tests/test_velia_admin_mobile_ui.py
