name: VELIA Design Taste integration

on:
  pull_request:
    branches:
      - feature/turbo-short-term-btc
    paths:
      - 'services/velia_developer_taste_skill_service.py'
      - 'services/velia_developer_coding_service.py'
      - 'skills/velia-design-taste/SKILL.md'
      - 'third_party/taste-skill/**'
      - 'tests/test_velia_developer_taste_*.py'
      - '.github/scripts/apply_velia_design_taste.py'
      - '.github/workflows/velia-design-taste-integration.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: velia-design-taste-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  integrate-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
      - name: Apply Design Taste integration
        run: python .github/scripts/apply_velia_design_taste.py
      - name: Compile Developer modules
        run: |
          python -m py_compile \
            services/kimi_gateway.py \
            services/velia_developer_github_service.py \
            services/velia_developer_github_write_service.py \
            services/velia_developer_project_service.py \
            services/velia_developer_agent_service.py \
            services/velia_developer_fast_path_service.py \
            services/velia_developer_taste_skill_service.py \
            services/velia_developer_coding_service.py \
            services/velia_developer_chat_runtime_patch.py \
            services/velia_developer_routes.py \
            services/velia_mobile_streaming_service.py \
            run_web_process.py
      - name: Run Design Taste and Developer regression tests
        env:
          PYTHONPATH: .
        run: |
          pytest -q \
            tests/test_velia_developer_taste_skill_service.py \
            tests/test_velia_developer_taste_integration.py \
            tests/test_velia_developer_github_service.py \
            tests/test_velia_developer_github_write_service.py \
            tests/test_velia_developer_project_service.py \
            tests/test_velia_developer_agent_service.py \
            tests/test_velia_developer_fast_path_service.py \
            tests/test_velia_developer_fast_path_bootstrap.py \
            tests/test_velia_developer_coding_service.py \
            tests/test_velia_developer_coding_chat_gate.py \
            tests/test_velia_developer_coding_intent_classifier.py \
            tests/test_velia_developer_chat_runtime_patch.py \
            tests/test_velia_developer_branch_selection.py \
            tests/test_velia_developer_bootstrap.py \
            tests/test_velia_mobile_streaming_service.py
      - name: Verify adaptation and cost contracts
        run: |
          grep -q 'UPSTREAM_COMMIT = "e988add20dab0fa97d7a76781c48961c8184288e"' services/velia_developer_taste_skill_service.py
          grep -q 'VELIA_DEVELOPER_TASTE_SKILL_ENABLED' services/velia_developer_taste_skill_service.py
          grep -q 'taste_skill.classify(normalized_goal, paths)' services/velia_developer_coding_service.py
          grep -q 'taste_skill.planning_guidance' services/velia_developer_coding_service.py
          grep -q 'taste_skill.execution_guidance' services/velia_developer_coding_service.py
          grep -q 'taste_skill.preflight_checks' services/velia_developer_coding_service.py
          grep -q 'Leonxlnx/taste-skill' third_party/taste-skill/UPSTREAM.md
          grep -q 'MIT License' third_party/taste-skill/LICENSE
          grep -q 'This skill adds prompt guidance only' skills/velia-design-taste/SKILL.md
          test "$(grep -c '_model_call(' services/velia_developer_coding_service.py)" -eq 3
      - name: Commit product integration
        if: github.event_name == 'pull_request'
        run: |
          if git diff --quiet -- services/velia_developer_coding_service.py; then
            echo 'Design Taste integration already committed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add services/velia_developer_coding_service.py
          git commit -m 'Integrate VELIA Design Taste with Coding Agent'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
