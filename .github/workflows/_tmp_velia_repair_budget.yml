name: Temporary VELIA repair budget

on:
  push:
    branches:
      - fix/velia-developer-repair-budget

permissions:
  contents: write

concurrency:
  group: velia-repair-budget-${{ github.ref }}
  cancel-in-progress: false

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/velia-developer-repair-budget
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
      - name: Apply repair budget patch
        run: python .github/scripts/_tmp_apply_velia_repair_budget.py
      - name: Compile affected modules
        run: |
          python -m py_compile \
            services/kimi_gateway.py \
            services/velia_developer_fast_path_service.py
      - name: Run complete Developer regressions
        env:
          PYTHONPATH: .
        run: |
          pytest -q \
            tests/test_velia_developer_github_service.py \
            tests/test_velia_developer_project_service.py \
            tests/test_velia_developer_agent_service.py \
            tests/test_velia_developer_fast_path_service.py \
            tests/test_velia_developer_fast_path_bootstrap.py \
            tests/test_velia_developer_chat_runtime_patch.py \
            tests/test_velia_developer_branch_selection.py \
            tests/test_velia_developer_bootstrap.py \
            tests/test_velia_mobile_streaming_service.py
      - name: Verify repair cost contracts
        run: |
          grep -q 'feature == "velia_developer_fast_repair"' services/kimi_gateway.py
          grep -q 'VELIA_DEVELOPER_FAST_REPAIR_OUTPUT_TOKENS' services/velia_developer_fast_path_service.py
          grep -q 'VELIA_DEVELOPER_FAST_REPAIR_RESERVE_USD' services/velia_developer_fast_path_service.py
          grep -q 'current_feature = "velia_developer_fast_repair"' services/velia_developer_fast_path_service.py
          grep -q 'test_repair_budget_survives_real_first_call_cost' tests/test_velia_developer_fast_path_service.py
          grep -q 'test_gateway_uses_compact_completion_cap_for_developer_repair' tests/test_velia_developer_fast_path_service.py
      - name: Commit product code
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            services/kimi_gateway.py \
            services/velia_developer_fast_path_service.py \
            tests/test_velia_developer_fast_path_service.py
          if git diff --cached --quiet; then
            echo "Product patch already committed"
            exit 0
          fi
          git commit -m "fix: reserve VELIA Developer repair budget"
          git push origin HEAD:fix/velia-developer-repair-budget
