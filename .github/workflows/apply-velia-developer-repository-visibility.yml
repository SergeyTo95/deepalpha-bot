name: Apply VELIA Developer repository visibility

on:
  pull_request:
    branches:
      - feature/turbo-short-term-btc

permissions:
  contents: write

jobs:
  apply-test-clean:
    if: github.head_ref == 'fix/velia-developer-repository-visibility'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/velia-developer-repository-visibility
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply product patch
        run: python .github/scripts/apply_velia_developer_repository_visibility.py
      - name: Install focused dependencies
        run: python -m pip install --disable-pip-version-check pytest requests cryptography
      - name: Compile affected module
        run: python -m py_compile services/velia_developer_github_service.py tests/test_velia_developer_repository_visibility.py
      - name: Run focused tests
        env:
          PYTHONPATH: .
        run: python -m pytest -q tests/test_velia_developer_repository_visibility.py tests/test_velia_developer_github_service.py
      - name: Remove one-shot files and commit product source
        run: |
          rm -f .github/scripts/apply_velia_developer_repository_visibility.py
          rm -f .github/workflows/apply-velia-developer-repository-visibility.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add services/velia_developer_github_service.py tests/test_velia_developer_repository_visibility.py
          git add -u .github/scripts .github/workflows
          git commit -m "fix: expose repositories from read-only GitHub installations"
          git push origin HEAD:fix/velia-developer-repository-visibility
