name: VELIA Research Meta Analysis
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  research-meta-analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: velia_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/velia_test
      VELIA_RESEARCH_CENTER_ENABLED: 'false'
      VELIA_RESEARCH_LITERATURE_ENABLED: 'false'
      VELIA_RESEARCH_CLAIM_LEDGER_ENABLED: 'false'
      VELIA_RESEARCH_META_ANALYSIS_ENABLED: 'false'
      VELIA_RESEARCH_PROTOCOL_OFFICER_ENABLED: 'false'
      VELIA_RESEARCH_EXPERIMENT_EXECUTION_ENABLED: 'false'
      VELIA_RESEARCH_COMPUTE_ENABLED: 'false'
      VELIA_RESEARCH_EXPERIMENT_PIPELINE_ENABLED: 'false'
      VELIA_RESEARCH_AUTO_REPORT_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt pytest pytest-asyncio
      - name: Meta-analysis and downstream research tests
        run: >
          python -m pytest -q
          tests/test_velia_research_meta_analysis.py
          tests/test_velia_research_claim_ledger.py
          tests/test_velia_research_protocol_officer.py
          tests/test_velia_research_dataset_registry.py
          tests/test_velia_research_experiment_pipeline.py
          tests/test_velia_research_compute.py
          tests/test_velia_research_report.py
      - name: Compile meta-analysis surface
        run: >
          python -m compileall -q
          services/velia_research_meta_analysis_service.py
          services/velia_research_claim_service.py
          services/velia_research_report_service.py
          run_velia_research_worker.py
          velia_research_routes.py
      - name: Static meta-analysis safety and inference boundary
        run: |
          python - <<'PY'
          from pathlib import Path

          meta = Path('services/velia_research_meta_analysis_service.py').read_text()
          claims = Path('services/velia_research_claim_service.py').read_text()
          report = Path('services/velia_research_report_service.py').read_text()
          routes = Path('velia_research_routes.py').read_text()
          env = Path('.env.example').read_text()

          assert 'VELIA_RESEARCH_META_ANALYSIS_ENABLED", False' in meta
          assert 'ALLOWED_EFFECT_TYPES = {"correlation", "standardized_mean_difference", "log_odds_ratio"}' in meta
          assert '"random_effects": "dersimonian_laird"' in meta
          assert 'math.atanh(r)' in meta
          assert '"normalized_metric": "hedges_g"' in meta
          assert '"normalized_metric": "log_odds_ratio"' in meta
          assert '"cochran_q"' in meta
          assert '"i_squared_percent"' in meta
          assert '"tau_squared"' in meta
          assert 'requires_at_least_10_studies' in meta
          assert '"proof_of_publication_bias": False' in meta
          assert '"claim_promotion_allowed": False' in meta
          assert 'research_meta_effect_incompatible_with_claim' in meta
          assert 'safety.classify' in meta

          forbidden = (
              'subprocess', 'os.system', 'eval(', 'exec(', 'compile(',
              '__import__(', 'requests.', 'aiohttp.', 'socket.', 'open(',
          )
          for token in forbidden:
              assert token not in meta, token

          assert 'velia_research_claim_calibrations' in claims
          assert 'may_caution_or_contradict_but_never_promote_stage' in claims
          assert 'action == "contradict"' in claims
          assert '"meta_analysis": meta_evidence' in report
          assert '"meta_analysis_claim_promotion_allowed": False' in report
          assert '"immutable_meta_evidence_hashes"' in report

          assert '/claims/{claim_id}/meta-studies' in routes
          assert '/claims/{claim_id}/meta-analysis' in routes
          assert '/missions/{mission_id}/meta-evidence' in routes
          assert 'VELIA_RESEARCH_META_ANALYSIS_ENABLED=false' in env
          PY
