name: VELIA Control Center guard hardening

on:
  pull_request:
    branches:
      - feature/turbo-short-term-btc
    paths:
      - "services/http_security_service.py"
      - "tests/test_velia_control_center_guard_truthiness.py"
      - "tests/test_velia_control_center.py"
      - "tests/test_velia_control_center_login_origin.py"
      - ".github/workflows/velia-control-center-guard-truthiness.yml"
  workflow_dispatch:

jobs:
  guard-hardening:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: ${{ github.workspace }}
      ADMIN_ID: "123456789"

    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest

      - name: Prove checked out SHA
        run: |
          echo "checked_out_sha=$(git rev-parse HEAD)"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          fi

      - name: Compile security boundary
        run: |
          python -m py_compile services/http_security_service.py tests/test_velia_control_center_guard_truthiness.py

      - name: Run focused Control Center security tests
        run: |
          python -m pytest -q \
            tests/test_velia_control_center_guard_truthiness.py \
            tests/test_velia_control_center.py \
            tests/test_velia_control_center_login_origin.py

      - name: Verify fail-closed installation order
        run: |
          python - <<'PY'
          from pathlib import Path

          source = Path("services/http_security_service.py").read_text(encoding="utf-8")
          assert "class _TruthyAdminGuardResponse(web.Response):" in source
          assert "def __bool__(self) -> bool:" in source
          assert "if denied is None:" in source
          assert "_truthy_admin_guard_response(denied)" in source
          install = source.index("_install_admin_guard_fail_closed(admin_routes_module)")
          secondary = source.index("setup_velia_admin_economy(app, admin_routes_module)")
          middleware = source.index("app.middlewares.append(deepalpha_security_middleware)")
          assert install < secondary < middleware
          PY

      - name: Reject newly added Python bytecode
        run: |
          if git diff --name-only "${{ github.event.pull_request.base.sha || github.sha }}" "${{ github.event.pull_request.head.sha || github.sha }}" | grep -E '(^|/)(__pycache__/|.*\.pyc$)'; then
            echo "Python bytecode must not be committed"
            exit 1
          fi
