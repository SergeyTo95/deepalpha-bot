name: Harden VELIA Developer chat routing

on:
  pull_request:
    branches:
      - feature/turbo-short-term-btc
    paths:
      - '.github/workflows/_tmp_harden_velia_developer_chat.yml'

permissions:
  contents: write

jobs:
  patch-test-clean:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
      - name: Harden fail-closed routing and follow-up context
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('services/velia_developer_chat_runtime_patch.py')
          source = path.read_text(encoding='utf-8')

          old = '''    history: List[str] = []\n    for row in rows:\n'''
          new = '''    current = str(current_message).strip()\n    for index in range(len(rows) - 1, -1, -1):\n        row = rows[index]\n        if isinstance(row, dict):\n            role = str(row.get("role") or "")\n            content = str(row.get("content") or "").strip()\n        else:\n            role = str(row[0] or "")\n            content = str(row[1] or "").strip()\n        if role == "user" and content == current:\n            del rows[index]\n            break\n\n    history: List[str] = []\n    for row in rows:\n'''
          if source.count(old) != 1:
              raise SystemExit('history anchor missing or duplicated')
          source = source.replace(old, new, 1)

          duplicate = '''        if role == "user" and content == str(current_message).strip() and not history:\n            continue\n'''
          if source.count(duplicate) != 1:
              raise SystemExit('duplicate-current guard missing or duplicated')
          source = source.replace(duplicate, '', 1)

          kind_anchor = '''    if kind == "failure":\n'''
          connect_block = '''    if kind == "connect":\n        return (\n            "Сначала создай Developer-проект из подключённого репозитория, затем спроси о коде в любом чате."\n            if russian\n            else "Create a Developer project from the connected repository first, then ask about its code in any chat."\n        )\n    if kind == "failure":\n'''
          if source.count(kind_anchor) != 1:
              raise SystemExit('language kind anchor missing or duplicated')
          source = source.replace(kind_anchor, connect_block, 1)

          helper_anchor = '''def _looks_engineering_follow_up(message: str) -> bool:\n'''
          helper = '''def _looks_repository_request(message: str) -> bool:\n    normalized = str(message or "").strip()\n    return _looks_scoped_repository_question(normalized) or "deepalpha-" in normalized.lower()\n\n\n'''
          if source.count(helper_anchor) != 1:
              raise SystemExit('repository request helper anchor missing or duplicated')
          source = source.replace(helper_anchor, helper + helper_anchor, 1)

          try_anchor = '''        try:\n            message = _latest_request_user_message(str(request_id or ""), int(user_id))\n'''
          try_replacement = '''        message = ""\n        try:\n            message = _latest_request_user_message(str(request_id or ""), int(user_id))\n'''
          if source.count(try_anchor) != 1:
              raise SystemExit('routing try anchor missing or duplicated')
          source = source.replace(try_anchor, try_replacement, 1)

          no_projects = '''            projects = project_service.list_projects(int(user_id))\n            if not projects:\n                return original_generate(\n                    prompt,\n                    user_id=user_id,\n                    conversation_id=conversation_id,\n                    request_id=request_id,\n                )\n'''
          no_projects_replacement = '''            projects = project_service.list_projects(int(user_id))\n            if not projects:\n                if _looks_repository_request(message):\n                    return _deterministic_result(\n                        _language_text(message, kind="connect"),\n                        request_id,\n                        reason="developer_project_missing",\n                    )\n                return original_generate(\n                    prompt,\n                    user_id=user_id,\n                    conversation_id=conversation_id,\n                    request_id=request_id,\n                )\n'''
          if source.count(no_projects) != 1:
              raise SystemExit('no-project block missing or duplicated')
          source = source.replace(no_projects, no_projects_replacement, 1)

          except_block = '''        except Exception as exc:\n            logger.exception(\n                "VELIA_DEVELOPER_CHAT_ROUTING_FAILED user_id=%s conversation_id=%s error=%s",\n                int(user_id),\n                str(conversation_id),\n                exc.__class__.__name__,\n            )\n            return original_generate(\n                prompt,\n                user_id=user_id,\n                conversation_id=conversation_id,\n                request_id=request_id,\n            )\n'''
          except_replacement = '''        except Exception as exc:\n            logger.exception(\n                "VELIA_DEVELOPER_CHAT_ROUTING_FAILED user_id=%s conversation_id=%s error=%s",\n                int(user_id),\n                str(conversation_id),\n                exc.__class__.__name__,\n            )\n            if _looks_repository_request(message):\n                return _deterministic_result(\n                    _language_text(message, kind="failure", code="developer_router_unavailable"),\n                    request_id,\n                    reason="developer_router_unavailable",\n                )\n            return original_generate(\n                prompt,\n                user_id=user_id,\n                conversation_id=conversation_id,\n                request_id=request_id,\n            )\n'''
          if source.count(except_block) != 1:
              raise SystemExit('routing exception block missing or duplicated')
          source = source.replace(except_block, except_replacement, 1)
          path.write_text(source, encoding='utf-8')

          test_path = Path('tests/test_velia_developer_chat_runtime_patch.py')
          tests = test_path.read_text(encoding='utf-8')
          tests += '''\n\ndef test_repository_question_without_project_is_fail_closed(monkeypatch):\n    module = _chat_module(lambda *args, **kwargs: pytest.fail("ordinary model must not run"))\n    monkeypatch.setattr(patch.project_service, "developer_enabled", lambda: True)\n    monkeypatch.setattr(patch.project_service, "list_projects", lambda user_id: [])\n    monkeypatch.setattr(\n        patch,\n        "_latest_request_user_message",\n        lambda request_id, user_id: "Проверь код в deepalpha-bot",\n    )\n\n    patch.install(module)\n    result = _call(module)\n\n    assert result["reason"] == "developer_project_missing"\n    assert "Developer-проект" in result["text"]\n\n\ndef test_repository_router_storage_failure_does_not_hallucinate(monkeypatch):\n    module = _chat_module(lambda *args, **kwargs: pytest.fail("ordinary model must not run"))\n    monkeypatch.setattr(patch.project_service, "developer_enabled", lambda: True)\n    monkeypatch.setattr(\n        patch,\n        "_latest_request_user_message",\n        lambda request_id, user_id: "Проверь в нашем репозитории этот endpoint",\n    )\n    monkeypatch.setattr(\n        patch.project_service,\n        "list_projects",\n        lambda user_id: (_ for _ in ()).throw(RuntimeError("db down")),\n    )\n\n    patch.install(module)\n    result = _call(module)\n\n    assert result["reason"] == "developer_router_unavailable"\n    assert "developer_router_unavailable" in result["text"]\n'''
          test_path.write_text(tests, encoding='utf-8')
          PY
      - name: Compile and test Developer integration
        env:
          PYTHONPATH: .
        run: |
          python -m py_compile services/velia_developer_chat_runtime_patch.py run_web_process.py
          pytest -q tests/test_velia_developer_chat_runtime_patch.py tests/test_velia_developer_bootstrap.py
      - name: Run complete Developer suite
        env:
          PYTHONPATH: .
        run: |
          pytest -q \
            tests/test_velia_developer_github_service.py \
            tests/test_velia_developer_project_service.py \
            tests/test_velia_developer_agent_service.py \
            tests/test_velia_developer_chat_runtime_patch.py \
            tests/test_velia_developer_branch_selection.py \
            tests/test_velia_developer_bootstrap.py
      - name: Remove workflow and commit hardening
        run: |
          rm -f .github/workflows/_tmp_harden_velia_developer_chat.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add services/velia_developer_chat_runtime_patch.py tests/test_velia_developer_chat_runtime_patch.py
          git add -u .github/workflows/_tmp_harden_velia_developer_chat.yml
          git commit -m "Harden VELIA Developer chat routing"
          git push origin HEAD:feature/velia-developer-in-every-chat
