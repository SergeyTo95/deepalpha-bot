name: Polywar SQL Execution

on:
  pull_request:
    branches:
      - feature/turbo-short-term-btc
    paths:
      - "services/polywar_service.py"
      - "tests/test_polywar_sql_execution.py"
      - ".github/workflows/polywar-sql-execution.yml"
  workflow_dispatch:

jobs:
  sql-dialect-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: ${{ github.workspace }}

    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest pytest-asyncio

      - name: Prove checked out SHA
        run: |
          echo "checked_out_sha=$(git rev-parse HEAD)"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          fi

      - name: Compile Polywar SQL boundary
        run: python -m py_compile services/polywar_service.py tests/test_polywar_sql_execution.py

      - name: Run SQL execution regressions
        run: python -m pytest -q tests/test_polywar_sql_execution.py

      - name: Verify hotfix diff boundary
        if: github.event_name == 'pull_request'
        run: |
          python - <<'PY'
          import subprocess

          base = "${{ github.event.pull_request.base.sha }}"
          head = "${{ github.event.pull_request.head.sha }}"
          changed = set(subprocess.check_output(["git", "diff", "--name-only", base, head], text=True).splitlines())
          allowed = {
              "services/polywar_service.py",
              "tests/test_polywar_sql_execution.py",
              ".github/workflows/polywar-sql-execution.yml",
          }
          unexpected = changed - allowed
          assert not unexpected, f"unexpected Polywar hotfix files: {sorted(unexpected)}"
          PY

      - name: Reject newly added Python bytecode
        if: github.event_name == 'pull_request'
        run: |
          if git diff --name-only "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}" | grep -E '(^|/)(__pycache__/|.*\.pyc$)'; then
            echo "Python bytecode must not be committed"
            exit 1
          fi
