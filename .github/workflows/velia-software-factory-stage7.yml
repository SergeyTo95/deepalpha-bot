name: VELIA Software Factory Stage 7

on:
  pull_request:
    branches:
      - feature/turbo-short-term-btc
    paths:
      - 'services/velia_software_factory_stage7_limited_admin_rollout_service.py'
      - 'services/velia_software_factory_admin_acceptance_service.py'
      - 'services/velia_software_factory_rollout_service.py'
      - 'services/velia_software_factory_live_pilot_preflight_service.py'
      - 'tests/test_velia_software_factory_stage7_limited_admin_rollout.py'
      - 'docs/VELIA_SOFTWARE_FACTORY_STAGE7_LIMITED_ADMIN_ROLLOUT.md'
      - '.github/workflows/velia-software-factory-stage6-7.yml'
      - '.github/workflows/velia-software-factory-stage7.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  limited-admin-rollout:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest pytest-asyncio

      - name: Prove checked out SHA
        run: |
          echo "checked_out_sha=$(git rev-parse HEAD)"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          fi

      - name: Compile Stage 7 boundary
        run: |
          python -m py_compile \
            services/velia_software_factory_stage7_limited_admin_rollout_service.py \
            services/velia_software_factory_admin_acceptance_service.py \
            services/velia_software_factory_rollout_service.py \
            services/velia_software_factory_live_pilot_preflight_service.py

      - name: Run Stage 7 and prior safety regressions
        run: |
          python -m pytest -q \
            tests/test_velia_software_factory_stage7_limited_admin_rollout.py \
            tests/test_velia_software_factory_stage6_admin_pilot.py \
            tests/test_velia_software_factory_stage6_7_admin_acceptance.py \
            tests/test_velia_software_factory_stage6_6_reviewer_remediation.py \
            tests/test_velia_software_factory_stage6_5b_reviewer_pilot_gate.py \
            tests/test_velia_software_factory_stage6_4a_pilot_preflight.py \
            tests/test_velia_software_factory_stage6_3_live_pilot_control.py \
            tests/test_velia_software_factory_stage6_2_live_pilot_guard.py \
            tests/test_velia_software_factory_reviewer_gate.py

      - name: Prove limited_admin is separate from unrestricted live
        run: |
          python - <<'PY'
          from pathlib import Path
          rollout = Path('services/velia_software_factory_rollout_service.py').read_text()
          assert 'ROLLOUT_LIMITED_ADMIN = "limited_admin"' in rollout
          assert 'ROLLOUT_LIMITED_ADMIN' in rollout
          assert 'mode == ROLLOUT_LIMITED_ADMIN' in rollout
          assert 'allow_limited_admin=True' in rollout
          assert '"release": _stage_readiness(int(user_id), _RELEASE_FLAGS, require_live=True)' in rollout
          assert '_mode_user_allowed' in rollout
          PY

      - name: Prove Stage 7 is acceptance-backed and release-closed
        run: |
          python - <<'PY'
          from pathlib import Path
          stage7 = Path('services/velia_software_factory_stage7_limited_admin_rollout_service.py').read_text()
          acceptance = Path('services/velia_software_factory_admin_acceptance_service.py').read_text()
          assert 'VELIA_SOFTWARE_FACTORY_STAGE7_LIMITED_ADMIN_ROLLOUT_ENABLED' in stage7
          assert 'VELIA_SOFTWARE_FACTORY_STAGE7_ACCEPTANCE_RUN_ID' in stage7
          assert 'VELIA_SOFTWARE_FACTORY_STAGE7_ACCEPTANCE_REPOSITORY' in stage7
          assert 'VELIA_SOFTWARE_FACTORY_STAGE7_ACCEPTANCE_CERTIFICATE_ID' in stage7
          assert 'acceptance.verify_passed_certificate(' in stage7
          assert 'VELIA_SOFTWARE_FACTORY_RELEASE_EXECUTION_ENABLED' in stage7
          assert 'stage67_acceptance_harness_must_be_closed' in stage7
          assert '"merge_supported": False' in stage7
          assert '"release_supported": False' in stage7
          assert '"deployment_supported": False' in stage7
          assert 'def verify_passed_certificate(' in acceptance
          assert 'acceptance_certificate_fingerprint_mismatch' in acceptance
          assert 'grant_status == "consumed"' in acceptance
          assert 'run_status == "ready_for_review"' in acceptance
          assert 'reviewer_status == "passed"' in acceptance
          assert 'remediation_attempts >= 1' in acceptance
          PY

      - name: Reject new merge, deployment, rollout mutation, or parallel write authority
        run: |
          python - <<'PY'
          from pathlib import Path
          files = (
              'services/velia_software_factory_stage7_limited_admin_rollout_service.py',
              'services/velia_software_factory_admin_acceptance_service.py',
              'services/velia_software_factory_rollout_service.py',
              'services/velia_software_factory_live_pilot_preflight_service.py',
          )
          stage7 = Path(files[0]).read_text()
          forbidden_stage7 = (
              'factory.advance_run(',
              'guard.issue_grant(',
              'guard.claim_dispatch(',
              'autopilot.enqueue_task(',
              'merge_pull_request',
              'merge_exact_head',
              'create_deployment',
              'redeploy',
              'set-variables',
              'os.environ[',
              'os.putenv',
          )
          for token in forbidden_stage7:
              assert token not in stage7, token
          preflight = Path(files[3]).read_text()
          assert 'advance_run(' not in preflight
          assert 'issue_grant(' not in preflight
          assert 'get_connection(' not in preflight
          PY

      - name: Verify bounded Stage 7 diff surface
        if: github.event_name == 'pull_request'
        run: |
          python - <<'PY'
          import subprocess
          base = '${{ github.event.pull_request.base.sha }}'
          head = '${{ github.event.pull_request.head.sha }}'
          changed = set(subprocess.check_output(['git','diff','--name-only',base,head], text=True).splitlines())
          allowed = {
              'services/velia_software_factory_stage7_limited_admin_rollout_service.py',
              'services/velia_software_factory_admin_acceptance_service.py',
              'services/velia_software_factory_rollout_service.py',
              'services/velia_software_factory_live_pilot_preflight_service.py',
              'tests/test_velia_software_factory_stage7_limited_admin_rollout.py',
              'docs/VELIA_SOFTWARE_FACTORY_STAGE7_LIMITED_ADMIN_ROLLOUT.md',
              '.github/workflows/velia-software-factory-stage6-7.yml',
              '.github/workflows/velia-software-factory-stage7.yml',
          }
          unexpected = changed - allowed
          assert not unexpected, f'unexpected Stage 7 files: {sorted(unexpected)}'
          runtime = {
              'services/velia_software_factory_stage7_limited_admin_rollout_service.py',
              'services/velia_software_factory_admin_acceptance_service.py',
              'services/velia_software_factory_rollout_service.py',
              'services/velia_software_factory_live_pilot_preflight_service.py',
          }
          if changed & runtime:
              assert 'tests/test_velia_software_factory_stage7_limited_admin_rollout.py' in changed, sorted(changed)
          assert changed & (runtime | {
              'tests/test_velia_software_factory_stage7_limited_admin_rollout.py',
              'docs/VELIA_SOFTWARE_FACTORY_STAGE7_LIMITED_ADMIN_ROLLOUT.md',
              '.github/workflows/velia-software-factory-stage6-7.yml',
              '.github/workflows/velia-software-factory-stage7.yml',
          }), sorted(changed)
          PY

      - name: Reject newly added Python bytecode
        if: github.event_name == 'pull_request'
        run: |
          if git diff --name-only --diff-filter=A "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}" | grep -E '(^|/)__pycache__/|.*\.py[co]$'; then
            echo "Python bytecode must not be committed"
            exit 1
          fi
