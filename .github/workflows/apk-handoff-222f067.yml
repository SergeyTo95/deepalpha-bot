name: APK handoff 222f067

on:
  push:
    branches:
      - ops/apk-handoff-222f067
  workflow_dispatch:

permissions:
  contents: read

jobs:
  handoff:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout handoff branch
        uses: actions/checkout@v4
        with:
          ref: ops/apk-handoff-222f067
          fetch-depth: 1
      - name: Reassemble verified APK
        shell: bash
        run: |
          set -euo pipefail
          cat tmp/apk-binary-parts/VELIA.part00               tmp/apk-binary-parts/VELIA.part01               tmp/apk-binary-parts/VELIA.part02               > VELIA-0.13.1-Flash-merged.apk
          sha256sum -c tmp/apk-binary-parts/SHA256.txt
          test "$(stat -c %s VELIA-0.13.1-Flash-merged.apk)" = "168058060"
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: VELIA-0.13.1-Flash-merged
          path: VELIA-0.13.1-Flash-merged.apk
          compression-level: 0
          retention-days: 1
          if-no-files-found: error
