name: APK handoff from Railway

on:
  push:
    branches:
      - ops/apk-handoff-222f067

permissions:
  contents: read

jobs:
  handoff:
    runs-on: ubuntu-latest
    steps:
      - name: Download exact Railway APK
        run: |
          set -euo pipefail
          curl -fL --retry 3 --connect-timeout 20 --max-time 900             "https://velia-android-apk-c2205e4-production.up.railway.app/VELIA-debug-222f067.apk"             -o VELIA-0.13.1-Flash.apk
          test "$(stat -c %s VELIA-0.13.1-Flash.apk)" = "168058060"
          echo "6c1bda3ef3d1b4e4e73fd39550d145e516478d6cb51dbe83b0b3b75b0212ea9b  VELIA-0.13.1-Flash.apk" | sha256sum -c -

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VELIA-0.13.1-Flash
          path: VELIA-0.13.1-Flash.apk
          compression-level: 0
          retention-days: 1
