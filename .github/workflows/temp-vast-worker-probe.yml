name: temp-vast-worker-probe

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe Vast worker
        shell: bash
        run: |
          set +e
          echo '=== TCP/API probe ==='
          date -u
          curl -sv --connect-timeout 8 --max-time 12 http://122.51.254.66:24163/health/live
          echo
          echo 'LIVE_EXIT='$?
          curl -sv --connect-timeout 8 --max-time 12 http://122.51.254.66:24163/health/ready
          echo
          echo 'READY_EXIT='$?
          python - <<'PY'
          import socket
          for port in (24163, 24997):
              s=socket.socket(); s.settimeout(8)
              try:
                  s.connect(('122.51.254.66', port))
                  print(f'TCP {port}: OPEN')
              except Exception as e:
                  print(f'TCP {port}: {type(e).__name__}: {e}')
              finally:
                  s.close()
          PY
