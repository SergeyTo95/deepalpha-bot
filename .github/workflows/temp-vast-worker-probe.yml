name: temp-vast-worker-probe

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe Vast worker
        shell: bash
        run: |
          set +e
          echo '=== Vast worker probe ==='
          curl -sv --connect-timeout 8 --max-time 12 http://180.189.55.38:48729/health/live
          echo
          curl -sv --connect-timeout 8 --max-time 12 http://180.189.55.38:48729/health/ready
          echo
          python - <<'PY'
          import socket
          for port in (48729, 48799):
              s=socket.socket(); s.settimeout(8)
              try:
                  s.connect(('180.189.55.38', port))
                  print(f'TCP {port}: OPEN')
              except Exception as e:
                  print(f'TCP {port}: {type(e).__name__}: {e}')
              finally:
                  s.close()
          PY
