name: Apply VELIA idempotency follow-up

on:
  push:
    branches:
      - fix/velia-file-analyst-idempotency
    paths:
      - "tools/apply_velia_idempotency_followup.py"
      - ".github/workflows/apply-velia-idempotency-followup.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fix branch
        uses: actions/checkout@v4
        with:
          ref: fix/velia-file-analyst-idempotency
          fetch-depth: 0

      - name: Apply focused source and test patch
        run: python tools/apply_velia_idempotency_followup.py

      - name: Remove one-shot patch machinery
        run: |
          rm tools/apply_velia_idempotency_followup.py
          rm .github/workflows/apply-velia-idempotency-followup.yml

      - name: Commit product fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add services/velia_attachment_idempotency_service.py \
                  tests/test_velia_attachment_idempotency_followup.py \
                  tools/apply_velia_idempotency_followup.py \
                  .github/workflows/apply-velia-idempotency-followup.yml
          git diff --cached --check
          git commit -m "fix VELIA attachment idempotency recovery"
          git push origin HEAD:fix/velia-file-analyst-idempotency
