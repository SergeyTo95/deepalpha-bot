name: Decision-first forecast card

on:
  pull_request:
    branches:
      - fix/tag-parent-market-fallback
      - feature/turbo-short-term-btc
    paths:
      - "agents/__init__.py"
      - "agents/decision_first_trading_plan_agent.py"
      - "agents/schemas/forecast_card.py"
      - "services/decision_first_renderer_patch.py"
      - "run_bot_process.py"
      - "supervisord.conf"
      - "tests/test_decision_first_forecast_card.py"
      - ".github/workflows/decision-first-forecast.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: decision-first-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  decision-first:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest

      - name: Compile changed modules
        run: |
          python -m py_compile \
            agents/__init__.py \
            agents/decision_first_trading_plan_agent.py \
            agents/schemas/forecast_card.py \
            services/decision_first_renderer_patch.py \
            run_bot_process.py

      - name: Run focused tests
        run: |
          PYTHONPATH=. python -m pytest -q tests/test_decision_first_forecast_card.py
