name: VELIA Software Factory Stage 5

on:
  pull_request:
    paths:
      - 'services/velia_software_factory_delivery_gate_*.py'
      - 'services/velia_software_factory_workspace_hardening_patch.py'
      - 'tests/test_velia_software_factory_delivery_gate_*.py'
      - '.env.example'
      - '.github/workflows/velia-software-factory-stage5.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stage5-delivery-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
      - name: Compile Stage 5 modules
        run: |
          python -m py_compile \
            services/velia_software_factory_delivery_gate_service.py \
            services/velia_software_factory_delivery_gate_runtime_patch.py \
            services/velia_software_factory_workspace_hardening_patch.py
      - name: Run Stage 5 focused tests
        env:
          PYTHONPATH: .
        run: |
          python -m pytest -q \
            tests/test_velia_software_factory_delivery_gate_service.py \
            tests/test_velia_software_factory_delivery_gate_runtime.py \
            tests/test_velia_agent_coding_autopilot_merge_policy_service.py
      - name: Verify fail-closed delivery gate
        env:
          PYTHONPATH: .
        run: |
          python - <<'PY'
          import os
          from services import velia_software_factory_delivery_gate_service as delivery
          os.environ.pop('VELIA_SOFTWARE_FACTORY_DELIVERY_GATE_ENABLED', None)
          status = delivery.public_status()
          assert status['enabled'] is False
          assert status['mode'] == 'read_only_candidate'
          assert status['execution_supported'] is False
          assert status['merge_supported'] is False
          assert status['deployment_supported'] is False
          assert status['user_approval_required'] is True
          PY
      - name: Verify Delivery Gate write boundary
        run: |
          ! grep -nE 'merge_pull_request|merge_pull\(|create_deployment|redeploy|github_service\._request|write_service\.(create|update|delete)|autopilot\.enqueue_task' \
            services/velia_software_factory_delivery_gate_service.py \
            services/velia_software_factory_delivery_gate_runtime_patch.py
          grep -q 'merge_policy.evaluate_merge_policy' services/velia_software_factory_delivery_gate_service.py
          grep -q 'integration_validation_not_passed' services/velia_software_factory_delivery_gate_service.py
          grep -q 'execution_supported=false merge_supported=false deployment_supported=false' \
            services/velia_software_factory_delivery_gate_runtime_patch.py
      - name: Verify immutable source fingerprint inputs
        run: |
          grep -q 'plan_fingerprint' services/velia_software_factory_delivery_gate_service.py
          grep -q 'contract_fingerprint' services/velia_software_factory_delivery_gate_service.py
          grep -q 'head_sha' services/velia_software_factory_delivery_gate_service.py
          grep -q 'reason_codes' services/velia_software_factory_delivery_gate_service.py
      - name: Reject newly added Python bytecode
        if: github.event_name == 'pull_request'
        run: |
          if git diff --name-only --diff-filter=A "origin/${GITHUB_BASE_REF}...HEAD" | grep -E '(^|/)__pycache__/|\.py[co]$'; then
            echo 'Generated Python bytecode was added by this PR.'
            exit 1
          fi
