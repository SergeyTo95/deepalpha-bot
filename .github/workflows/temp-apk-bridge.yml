name: temp-apk-bridge

on:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  APK_URL: https://velia-android-apk-c2205e4-production.up.railway.app/VELIA-debug-8715b5a.apk
  APK_SHA256: f3d9b3aa47d5c4c8c55ffae16aa68d495140dd1817e182df2f752338e9cf170b
  APK_SIZE: '167626888'

jobs:
  fetch-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Download and verify APK
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 5 --retry-delay 2 "$APK_URL" --output /tmp/VELIA-Studio.apk
          test "$(stat -c%s /tmp/VELIA-Studio.apk)" -eq "$APK_SIZE"
          echo "$APK_SHA256  /tmp/VELIA-Studio.apk" | sha256sum -c -
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: VELIA-Studio-apk
          path: /tmp/VELIA-Studio.apk
          compression-level: 0
          retention-days: 1
          if-no-files-found: error
