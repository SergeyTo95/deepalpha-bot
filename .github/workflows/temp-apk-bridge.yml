name: temp-apk-bridge

on:
  push:
    branches:
      - ops/temp-apk-bridge-20260828

permissions:
  contents: read

jobs:
  fetch-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Download APK from Railway
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 5 --retry-delay 2 \
            'https://velia-android-apk-c2205e4-production.up.railway.app/VELIA-debug-8715b5a.apk' \
            --output /tmp/VELIA-Studio.apk
          test "$(stat -c%s /tmp/VELIA-Studio.apk)" -eq 167626888
          echo 'f3d9b3aa47d5c4c8c55ffae16aa68d495140dd1817e182df2f752338e9cf170b  /tmp/VELIA-Studio.apk' | sha256sum -c -
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: VELIA-Studio-apk
          path: /tmp/VELIA-Studio.apk
          compression-level: 0
          retention-days: 1
          if-no-files-found: error
