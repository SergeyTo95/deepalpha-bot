name: VELIA Control Center

on:
  pull_request:
    branches:
      - feature/turbo-short-term-btc
    paths:
      - "admin_routes.py"
      - "run_bot_process.py"
      - "run_web_process.py"
      - "run_payment_worker.py"
      - "services/http_security_service.py"
      - "services/velia_admin_*.py"
      - "services/payments/**"
      - "tests/test_velia_control_center*.py"
      - "tests/test_velia_admin_*.py"
      - "tests/test_velia_economy_v02.py"
      - "tests/test_velia_payment_foundation.py"
      - "tests/test_velia_payment_observability.py"
      - ".github/workflows/velia-control-center.yml"
  workflow_dispatch:

jobs:
  control-center-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: ${{ github.workspace }}
      ADMIN_ID: "123456789"

    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest

      - name: Prove checked out SHA
        run: |
          echo "checked_out_sha=$(git rev-parse HEAD)"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          fi

      - name: Compile Control Center boundary
        run: |
          python -m py_compile \
            admin_routes.py \
            services/http_security_service.py \
            services/velia_admin_security_service.py \
            services/velia_admin_control_service.py \
            services/velia_admin_observability_service.py \
            services/velia_admin_telegram_auth_service.py \
            services/velia_admin_telegram_bridge.py \
            services/velia_admin_user_display_service.py \
            services/velia_admin_mobile_ui_patch.py \
            services/velia_admin_agent_memory_recall_patch.py \
            services/velia_admin_economy_service.py \
            services/velia_admin_economy_routes.py \
            services/velia_admin_economy_bootstrap_service.py \
            services/velia_admin_economy_v02_service.py \
            services/velia_admin_economy_v02_ui_patch.py \
            services/velia_admin_payments_service.py \
            services/velia_admin_payments_routes.py \
            services/payments/__init__.py \
            services/payments/config.py \
            services/payments/models.py \
            services/payments/schema.py \
            services/payments/repository.py \
            services/payments/worker.py \
            services/payments/chains/__init__.py \
            services/payments/chains/base.py \
            services/payments/chains/tron.py \
            services/payments/chains/solana.py \
            services/payments/chains/ton.py \
            services/payments/chains/bnb.py \
            services/payments/chains/polygon.py \
            services/developer_api_admin_observability_patch.py \
            services/developer_api_admin_opportunity_patch.py \
            services/developer_api_admin_webhook_patch.py \
            developer_api_commercial_admin_routes_v2.py \
            run_bot_process.py \
            run_web_process.py \
            run_payment_worker.py

      - name: Run focused security tests
        shell: bash
        run: |
          set -o pipefail
          pytest -q \
            tests/test_velia_control_center.py \
            tests/test_velia_control_center_login_origin.py \
            tests/test_velia_admin_user_display.py \
            tests/test_velia_admin_mobile_ui.py \
            tests/test_velia_admin_agent_memory_recall.py \
            tests/test_velia_admin_economy.py \
            tests/test_velia_economy_v02.py \
            tests/test_velia_payment_foundation.py \
            tests/test_velia_payment_observability.py \
            tests/test_velia_telegram_pairing.py \
            2>&1 | tee velia-control-center-pytest.log

      - name: Verify admin credential, commercial and payment boundaries
        run: |
          python - <<'PY'
          from pathlib import Path

          admin = Path("admin_routes.py").read_text(encoding="utf-8")
          security = Path("services/http_security_service.py").read_text(encoding="utf-8")
          telegram = Path("services/velia_admin_telegram_auth_service.py").read_text(encoding="utf-8")
          auth = Path("services/velia_admin_security_service.py").read_text(encoding="utf-8")
          mobile_ui = Path("services/velia_admin_mobile_ui_patch.py").read_text(encoding="utf-8")
          memory_recall_admin = Path("services/velia_admin_agent_memory_recall_patch.py").read_text(encoding="utf-8")
          economy = Path("services/velia_admin_economy_service.py").read_text(encoding="utf-8")
          economy_v02 = Path("services/velia_admin_economy_v02_service.py").read_text(encoding="utf-8")
          economy_v02_ui = Path("services/velia_admin_economy_v02_ui_patch.py").read_text(encoding="utf-8")
          bootstrap = Path("services/velia_admin_economy_bootstrap_service.py").read_text(encoding="utf-8")
          payment_repo = Path("services/payments/repository.py").read_text(encoding="utf-8")
          payment_worker = Path("services/payments/worker.py").read_text(encoding="utf-8")
          payment_schema = Path("services/payments/schema.py").read_text(encoding="utf-8")
          payment_entry = Path("run_payment_worker.py").read_text(encoding="utf-8")
          web_process = Path("run_web_process.py").read_text(encoding="utf-8")

          assert "ADMIN_SECRET_KEY" not in admin
          assert "ADMIN_SECRET_KEY" not in security
          assert "?key=" not in admin
          assert "deepalpha_admin_session" not in security
          assert "BOT_TOKEN" not in admin
          assert "BOT_TOKEN" not in telegram
          assert "velia_admin_session" in auth
          assert "csrf_token_hash" in auth
          assert "session_token_hash" in auth
          assert "Legacy admin URL secrets are disabled" in security
          assert '_admin_mutation_requires_origin(request.path)' in security
          assert 'normalized != "/admin/login"' in security
          assert "setup_velia_admin_economy(app, admin_routes_module)" in security

          # Mobile UI and Agent recall diagnostics remain presentation/read-only
          # layers and cannot mutate data/auth or expose private memory payloads.
          assert "get_connection" not in mobile_ui
          assert "UPDATE users" not in mobile_ui
          assert "UPDATE settings" not in mobile_ui
          assert "UPDATE token_packages" not in mobile_ui
          assert "install_admin_mobile_ui_patch(admin_routes_module)" in bootstrap
          assert "install_agent_memory_recall_admin(admin_routes_module)" in bootstrap
          assert "Authorization" not in memory_recall_admin
          assert "VELIA_MEMORY_API_KEY" not in memory_recall_admin
          assert '"items"' not in memory_recall_admin
          assert '"content"' not in memory_recall_admin
          assert "probe_atomic_search_support" in memory_recall_admin

          # Economy drafts remain isolated from live billing/runtime balances.
          assert "UPDATE settings" not in economy
          assert "UPDATE token_packages" not in economy
          assert "DELETE FROM token_packages" not in economy
          assert "UPDATE users SET token_balance" not in economy
          assert "EXCEPTION WHEN OTHERS THEN" in economy

          # Economy v0.2 is Velia-first versioned draft data only. It may mirror
          # into the old draft workspace but cannot touch live billing.
          assert "velia_commercial_draft_versions" in economy_v02
          assert "draft_only_not_enforced" in economy_v02
          assert "UPDATE settings" not in economy_v02
          assert "UPDATE token_packages" not in economy_v02
          assert "DELETE FROM token_packages" not in economy_v02
          assert "UPDATE users" not in economy_v02
          assert "MAX_PROVIDER_COST_PER_VELIA_CREDIT_USD = 0.0024" in economy_v02
          assert "CRYPTO_DISCOUNT_PERCENT = 30.0" in economy_v02
          assert '("public_usage_unit", "VELIA Credits"' in economy_v02
          assert '("upstream_models_public", "false"' in economy_v02
          assert "economy_v02_snapshot()" in economy_v02_ui

          # Economy/token ledger bootstrap remains production-only and serialized.
          assert 'environment in {"production", "prod"}' in bootstrap
          assert "pg_advisory_lock" in bootstrap
          assert "pg_advisory_unlock" in bootstrap
          assert "await asyncio.to_thread(_ensure_economy_tables_serialized)" in bootstrap
          assert "ensure_economy_v02_tables()" in bootstrap
          assert "install_economy_v02_ui_patch(economy_routes_module)" in bootstrap
          assert "ensure_payment_tables_serialized" in bootstrap
          assert "setup_velia_admin_payments_routes(app, admin_routes_module)" in bootstrap

          # Payment runtime is additive, watch-only and fail-closed at signing boundaries.
          payment_text = "\n".join((payment_repo, payment_worker, payment_schema, payment_entry))
          assert "UPDATE users SET token_balance" not in payment_text
          assert "seed_encrypted" not in payment_text
          assert "send_transaction" not in payment_text
          assert "sign_transaction" not in payment_text
          assert "send_raw_transaction" not in payment_text.lower()
          assert 'os.getenv("PRIVATE_KEY' not in payment_text
          assert '"private_key"' in payment_repo  # redaction key only
          assert "_redact_payload" in payment_repo
          assert "ALTER TABLE payment_intents" not in payment_schema
          assert "UPDATE payment_intents" not in payment_schema
          assert "process_finalized_transfer" in payment_worker
          assert "update_worker_state" in payment_worker
          assert "VELIA_PAYMENT_POLL_OK" in payment_worker
          assert '"signing_capability": False' in payment_worker
          assert "VELIA_PAYMENT_ALLOW_NONPROD_SCHEMA_BOOTSTRAP" in payment_entry

          # Legacy Developer API patch modules may remain initialized for
          # compatibility, but their secret-bearing admin HTTP routes must not
          # be attached to the aiohttp application. Public Developer API stays.
          assert "install_admin_observability()" in web_process
          assert "install_admin_webhooks()" in web_process
          assert "install_admin_opportunity()" in web_process
          assert "install_admin_commercial()" in web_process
          assert "setup_developer_api_admin_routes(deepalpha_web.app)" not in web_process
          assert "setup_developer_api_commercial_admin_routes(deepalpha_web.app)" not in web_process
          assert "setup_developer_api_routes(deepalpha_web.app)" in web_process
          assert "setup_developer_api_commercial_routes(deepalpha_web.app)" in web_process
          PY

      - name: Upload focused test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: velia-control-center-pytest-log
          path: velia-control-center-pytest.log
          if-no-files-found: warn
