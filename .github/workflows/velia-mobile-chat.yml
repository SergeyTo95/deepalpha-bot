name: VELIA mobile chat

on:
  pull_request:
    branches:
      - feature/turbo-short-term-btc
    paths:
      - "run_bot_process.py"
      - "run_web_process.py"
      - "run_velia_memory_shadow_worker.py"
      - "supervisord.conf"
      - "velia_mobile_routes.py"
      - "velia_image_routes.py"
      - "velia_plugin_routes.py"
      - "velia_profile_routes.py"
      - "services/http_security_service.py"
      - "services/velia_mobile_auth_service.py"
      - "services/velia_chat_service.py"
      - "services/velia_llm_service.py"
      - "services/velia_conversation_quality_patch.py"
      - "services/velia_image_intent_service.py"
      - "services/velia_images_service.py"
      - "services/velia_images_runtime_patch.py"
      - "services/velia_images_queue_runtime_patch.py"
      - "services/velia_memory_shadow_service.py"
      - "services/velia_memory_shadow_runtime_patch.py"
      - "services/velia_mobile_hardening_service.py"
      - "services/velia_plugin_service.py"
      - "services/velia_plugin_router.py"
      - "services/velia_live_plugins_patch.py"
      - "services/velia_weather_location_patch.py"
      - "services/velia_telegram_pairing_service.py"
      - "services/velia_telegram_connect_page_patch.py"
      - "services/velia_user_profile_service.py"
      - "services/velia_user_profile_runtime_patch.py"
      - "tests/test_velia_mobile_auth_service.py"
      - "tests/test_velia_chat_service.py"
      - "tests/test_velia_llm_service.py"
      - "tests/test_velia_conversation_quality_patch.py"
      - "tests/test_velia_image_intent_service.py"
      - "tests/test_velia_images_service.py"
      - "tests/test_velia_images_queue_runtime_patch.py"
      - "tests/test_velia_memory_shadow_service.py"
      - "tests/test_velia_memory_shadow_runtime_patch.py"
      - "tests/test_run_velia_memory_shadow_worker.py"
      - "tests/test_velia_mobile_hardening_service.py"
      - "tests/test_velia_plugin_service.py"
      - "tests/test_velia_plugin_router_limits.py"
      - "tests/test_velia_weather_location_patch.py"
      - "tests/test_velia_telegram_pairing.py"
      - "tests/test_velia_user_profile_service.py"
      - "docs/velia-mobile-chat-beta.md"
      - "docs/velia-memory-shadow-pilot.md"
      - ".github/workflows/velia-mobile-chat.yml"
  workflow_dispatch:

jobs:
  velia-mobile-chat-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: ${{ github.workspace }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest

      - name: Compile VELIA mobile modules
        run: |
          python -m py_compile \
            services/http_security_service.py \
            services/velia_mobile_auth_service.py \
            services/velia_chat_service.py \
            services/velia_llm_service.py \
            services/velia_conversation_quality_patch.py \
            services/velia_image_intent_service.py \
            services/velia_images_service.py \
            services/velia_images_runtime_patch.py \
            services/velia_images_queue_runtime_patch.py \
            services/velia_memory_shadow_service.py \
            services/velia_memory_shadow_runtime_patch.py \
            services/velia_mobile_hardening_service.py \
            services/velia_plugin_service.py \
            services/velia_plugin_router.py \
            services/velia_live_plugins_patch.py \
            services/velia_weather_location_patch.py \
            services/velia_telegram_pairing_service.py \
            services/velia_telegram_connect_page_patch.py \
            services/velia_user_profile_service.py \
            services/velia_user_profile_runtime_patch.py \
            velia_mobile_routes.py \
            velia_image_routes.py \
            velia_plugin_routes.py \
            velia_profile_routes.py \
            run_bot_process.py \
            run_velia_memory_shadow_worker.py \
            run_web_process.py

      - name: Run focused tests
        shell: bash
        run: |
          set -o pipefail
          pytest -q \
            tests/test_velia_mobile_auth_service.py \
            tests/test_velia_chat_service.py \
            tests/test_velia_llm_service.py \
            tests/test_velia_conversation_quality_patch.py \
            tests/test_velia_image_intent_service.py \
            tests/test_velia_images_service.py \
            tests/test_velia_images_queue_runtime_patch.py \
            tests/test_velia_memory_shadow_service.py \
            tests/test_velia_memory_shadow_runtime_patch.py \
            tests/test_run_velia_memory_shadow_worker.py \
            tests/test_velia_mobile_hardening_service.py \
            tests/test_velia_plugin_service.py \
            tests/test_velia_plugin_router_limits.py \
            tests/test_velia_weather_location_patch.py \
            tests/test_velia_telegram_pairing.py \
            tests/test_velia_user_profile_service.py \
            2>&1 | tee velia-mobile-chat-pytest.log

      - name: Verify no mobile credential or provider exposure
        run: |
          python - <<'PY'
          from pathlib import Path

          public_files = [
              Path("velia_mobile_routes.py"),
              Path("velia_image_routes.py"),
              Path("velia_plugin_routes.py"),
              Path("velia_profile_routes.py"),
              Path("services/velia_image_intent_service.py"),
              Path("services/velia_images_runtime_patch.py"),
              Path("services/velia_user_profile_runtime_patch.py"),
              Path("services/velia_telegram_connect_page_patch.py"),
              Path("docs/velia-mobile-chat-beta.md"),
              Path("docs/velia-memory-shadow-pilot.md"),
          ]
          forbidden_literals = [
              "Authorization: Bearer <KIMI",
              "KIMI_API_KEY=sk-",
              "BRAVE_SEARCH_API_KEY=",
          ]
          forbidden_provider_terms = [
              "reve",
              "fal.ai",
              "fal.run",
              "fal.media",
              "tencentdb",
          ]
          for path in public_files:
              text = path.read_text(encoding="utf-8")
              for literal in forbidden_literals:
                  assert literal not in text, f"credential-like literal found in {path}"
              lowered = text.lower()
              for term in forbidden_provider_terms:
                  assert term not in lowered, f"provider name found in public file {path}"
          PY

      - name: Upload pytest log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: velia-mobile-chat-pytest-log
          path: velia-mobile-chat-pytest.log
          if-no-files-found: warn
