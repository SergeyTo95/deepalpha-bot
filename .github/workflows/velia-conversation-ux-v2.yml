name: VELIA Conversation UX v2

on:
  pull_request:
    branches:
      - feature/turbo-short-term-btc
    paths:
      - "services/velia_conversation_ux_*.py"
      - "services/velia_telegram_connect_page_patch.py"
      - "tests/test_velia_conversation_ux.py"
      - ".github/workflows/velia-conversation-ux-v2.yml"
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
    env:
      PYTHONPATH: ${{ github.workspace }}

    steps:
      - name: Checkout exact PR head
        if: github.event_name == 'pull_request'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Checkout workflow head
        if: github.event_name != 'pull_request'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Prove checked out SHA
        shell: bash
        run: |
          set -euo pipefail
          ACTUAL="$(git rev-parse HEAD)"
          echo "checked_out_sha=$ACTUAL"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            test "$ACTUAL" = "${{ github.event.pull_request.head.sha }}"
          else
            test "$ACTUAL" = "${{ github.sha }}"
          fi

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest

      - name: Compile Conversation UX boundary
        run: |
          python -m py_compile \
            services/velia_conversation_ux_service.py \
            services/velia_conversation_ux_routes.py \
            services/velia_telegram_connect_page_patch.py

      - name: Run Conversation UX regressions
        run: |
          pytest -q \
            tests/test_velia_conversation_ux.py \
            tests/test_velia_telegram_pairing.py

      - name: Verify share and merge privacy boundary
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          service = Path("services/velia_conversation_ux_service.py").read_text(encoding="utf-8")
          routes = Path("services/velia_conversation_ux_routes.py").read_text(encoding="utf-8")

          assert "role IN ('user','assistant')" in service
          assert "status='completed'" in service
          assert "token_hash" in service
          assert "hashlib.sha256" in service
          assert "provider" not in routes.lower()
          assert "private_key" not in routes.lower()
          assert "mnemonic" not in routes.lower()
          assert "seed_encrypted" not in routes.lower()
          assert "ai.deepalpha.android" in routes
          PY

      - name: Reject conflict markers
        run: |
          if grep -RniE '^(<<<<<<<|=======|>>>>>>>)' \
            services/velia_conversation_ux_service.py \
            services/velia_conversation_ux_routes.py \
            services/velia_telegram_connect_page_patch.py \
            tests/test_velia_conversation_ux.py; then
            exit 1
          fi
