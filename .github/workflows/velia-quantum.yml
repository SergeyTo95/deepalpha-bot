name: VELIA Quantum
on:
  push:
    branches: [feature/turbo-short-term-btc, feature/velia-desktop-harness, feature/velia-quantum-account-api, feature/velia-quantum-production-api]
    paths:
      - 'velia_quantum_provider.py'
      - 'velia_quantum_transport.py'
      - 'velia_quantum_turn.py'
      - 'velia_request_understanding.py'
      - 'services/velia*chat*'
      - 'services/velia_quantum_service.py'
      - 'services/velia_flash_service.py'
      - 'services/velia_mobile*'
      - 'velia_mobile_routes.py'
      - 'ci/probe-velia-quantum.py'
      - 'tests/test_velia_quantum*.py'
      - '.github/workflows/velia-quantum.yml'
  pull_request:
    paths:
      - 'velia_quantum_provider.py'
      - 'velia_quantum_transport.py'
      - 'velia_quantum_turn.py'
      - 'velia_request_understanding.py'
      - 'services/velia_quantum_service.py'
      - 'services/velia_attachment_chat_runtime_patch.py'
      - 'services/velia_chat_service.py'
      - 'services/velia_flash_service.py'
      - 'services/velia_mobile_hardening_service.py'
      - 'velia_mobile_routes.py'
      - 'ci/probe-velia-quantum.py'
      - 'tests/test_velia_quantum*.py'
      - '.github/workflows/velia-quantum.yml'
permissions:
  contents: read
jobs:
  account-provider:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: velia_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      VELIA_FLASH_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/velia_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pytest requests psycopg2-binary python-dotenv aiohttp tonsdk cryptography pillow pypdf python-multipart
      - run: python -m pytest -q tests/test_velia_quantum_provider.py tests/test_velia_quantum_transport.py tests/test_velia_quantum_chat.py tests/test_velia_quantum_probe.py tests/test_velia_quantum_identity.py tests/test_velia_flash.py tests/test_velia_chat_service.py tests/test_velia_mobile_hardening_service.py tests/test_velia_chat_streaming_runtime_patch.py
