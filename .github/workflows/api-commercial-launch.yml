name: API commercial launch

on:
  pull_request:
    branches:
      - feature/turbo-short-term-btc
    paths:
      - "developer_api_commercial_routes.py"
      - "developer_api_commercial_admin_routes.py"
      - "run_api_commercial_worker.py"
      - "run_web_process.py"
      - "supervisord.conf"
      - "services/developer_api_commercial_service.py"
      - "services/developer_api_commercial_runtime_patch.py"
      - "webapp/developer.html"
      - "webapp/developer_commercial.js"
      - "webapp/developer_commercial.css"
      - "tests/test_api_commercial_launch.py"
      - "docs/api_commercial_launch.md"
      - "docs/developer_api_v1.md"
      - ".env.example"
      - ".github/workflows/api-commercial-launch.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: api-commercial-launch-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  api-commercial-launch:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest pytest-asyncio

      - name: Compile commercial modules
        run: |
          python -m py_compile developer_api_commercial_routes.py
          python -m py_compile developer_api_commercial_admin_routes.py
          python -m py_compile run_api_commercial_worker.py
          python -m py_compile run_web_process.py
          python -m py_compile services/developer_api_commercial_service.py
          python -m py_compile services/developer_api_commercial_runtime_patch.py

      - name: Validate Developer Portal JavaScript
        run: node --check webapp/developer_commercial.js

      - name: Run commercial and API regression tests
        run: |
          set +e
          PYTHONPATH=. python -m pytest -q tests/test_api_commercial_launch.py tests/test_openapi_contract.py tests/test_opportunity_scan_api.py tests/test_signed_webhooks.py tests/test_quick_analysis_api.py tests/test_api_beta_hardening.py tests/test_developer_api_foundation.py tests/test_developer_api_billing.py tests/test_developer_portal.py tests/test_treasury_financial_security.py > commercial-test-output.txt 2>&1
          code=$?
          echo "$code" > commercial-test-exit-code.txt
          cat commercial-test-output.txt
          exit 0

      - name: Upload commercial test output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: commercial-test-output
          path: |
            commercial-test-output.txt
            commercial-test-exit-code.txt
          retention-days: 3

      - name: Enforce commercial test result
        run: |
          code=$(cat commercial-test-exit-code.txt)
          if [ "$code" != "0" ]; then
            exit "$code"
          fi
