name: VELIA Research Living Reassessment
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  research-living-reassessment:
    runs-on: ubuntu-latest
    timeout-minutes: 24
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: velia_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/velia_test
      VELIA_RESEARCH_CENTER_ENABLED: 'false'
      VELIA_RESEARCH_LITERATURE_ENABLED: 'false'
      VELIA_RESEARCH_CLAIM_LEDGER_ENABLED: 'false'
      VELIA_RESEARCH_META_ANALYSIS_ENABLED: 'false'
      VELIA_RESEARCH_SYSTEMATIC_REVIEW_ENABLED: 'false'
      VELIA_RESEARCH_LIVING_RESEARCH_ENABLED: 'false'
      VELIA_RESEARCH_LIVING_RESEARCH_WORKER_ENABLED: 'false'
      VELIA_RESEARCH_LIVING_REASSESSMENT_ENABLED: 'false'
      VELIA_RESEARCH_LIVING_REASSESSMENT_WORKER_ENABLED: 'false'
      VELIA_RESEARCH_PROTOCOL_OFFICER_ENABLED: 'false'
      VELIA_RESEARCH_EXPERIMENT_EXECUTION_ENABLED: 'false'
      VELIA_RESEARCH_COMPUTE_ENABLED: 'false'
      VELIA_RESEARCH_EXPERIMENT_PIPELINE_ENABLED: 'false'
      VELIA_RESEARCH_AUTO_REPORT_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt pytest pytest-asyncio
      - name: Living reassessment and downstream research tests
        run: >
          python -m pytest -q
          tests/test_velia_research_living_reassessment.py
          tests/test_velia_research_living_research.py
          tests/test_velia_research_systematic_review.py
          tests/test_velia_research_meta_analysis.py
          tests/test_velia_research_claim_ledger.py
          tests/test_velia_research_protocol_officer.py
          tests/test_velia_research_dataset_registry.py
          tests/test_velia_research_experiment_pipeline.py
          tests/test_velia_research_compute.py
          tests/test_velia_research_report.py
      - name: Compile living reassessment surface
        run: >
          python -m compileall -q
          services/velia_research_living_reassessment_service.py
          services/velia_research_living_service.py
          services/velia_research_claim_service.py
          services/velia_research_report_service.py
          run_velia_research_worker.py
          velia_research_routes.py
      - name: Static reassessment scientific and safety boundary
        run: |
          python - <<'PY'
          from pathlib import Path

          reassess = Path('services/velia_research_living_reassessment_service.py').read_text()
          claims = Path('services/velia_research_claim_service.py').read_text()
          report = Path('services/velia_research_report_service.py').read_text()
          worker = Path('run_velia_research_worker.py').read_text()
          routes = Path('velia_research_routes.py').read_text()
          env = Path('.env.example').read_text()

          assert 'VELIA_RESEARCH_LIVING_REASSESSMENT_ENABLED", False' in reassess
          assert 'VELIA_RESEARCH_LIVING_REASSESSMENT_WORKER_ENABLED", False' in reassess
          assert '"full_text_verified_extraction_required_for_new_meta_evidence": True' in reassess
          assert '"llm_guessed_effect_sizes_allowed": False' in reassess
          assert '"claim_promotion_allowed": False' in reassess
          assert 'basis != "full_text_verified"' in reassess
          assert 'meta._normalize(effect_type, statistics)' in reassess
          assert 'meta._risk(data.get("risk_of_bias"))' in reassess
          assert 'retracted_or_withdrawn_source_removed_from_living_pool' in reassess
          assert 'claims.record_calibration' in reassess
          assert '"living_reassessment"' in reassess
          assert 'FOR UPDATE SKIP LOCKED' in reassess
          assert 'MAX_CANDIDATES_PER_RUN = 20' in reassess
          assert 'MAX_AFFECTED_CLAIMS = 8' in reassess
          assert 'original_meta_snapshot_mutated": False' in reassess
          assert 'prior_report_mutated": False' in reassess

          forbidden = (
              'subprocess', 'os.system', 'eval(', 'exec(', 'compile(',
              '__import__(', 'requests.', 'aiohttp.', 'socket.', 'open(',
          )
          for token in forbidden:
              assert token not in reassess, token

          assert 'source_type not in {"meta_analysis", "living_reassessment"}' in claims
          assert '"living_reassessment_policy"' in claims
          assert '"version": 9 if reassessment_evidence is not None' in report
          assert '"living_reassessment": reassessment_evidence' in report
          assert '"immutable_living_reassessment_hash"' in report
          assert '"immutable_scientific_diff_hash"' in report
          assert '"living_reassessment_claim_promotion_allowed": False' in report
          assert 'living_reassessment.claim_next(worker)' in worker
          assert 'living_reassessment.execute_claimed' in worker
          assert '/living-scans/{scan_id}/reassessment' in routes
          assert '/living-reassessments/{run_id}/extractions' in routes
          assert '/living-reassessments/{run_id}/run' in routes
          assert 'VELIA_RESEARCH_LIVING_REASSESSMENT_ENABLED=false' in env
          assert 'VELIA_RESEARCH_LIVING_REASSESSMENT_WORKER_ENABLED=false' in env
          PY
