name: VELIA Code Archive Bootstrap Patch

on:
  push:
    branches:
      - feature/velia-code-archive-download
    paths:
      - "tools/patch_velia_code_archive_bootstrap.py"
      - ".github/workflows/velia-code-archive-bootstrap-patch.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/velia-code-archive-download
          fetch-depth: 0
      - name: Apply exact bootstrap patch
        run: python tools/patch_velia_code_archive_bootstrap.py
      - name: Verify only bootstrap changed
        run: |
          git diff --check
          git diff -- run_web_process.py
          test -z "$(git status --porcelain | grep -v '^ M run_web_process.py$' || true)"
      - name: Commit bootstrap patch
        run: |
          if git diff --quiet -- run_web_process.py; then
            echo "No bootstrap changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add run_web_process.py
          git commit -m "feat(velia): wire code archive runtime"
          git push origin HEAD:feature/velia-code-archive-download
