name: VELIA Software Factory

on:
  pull_request:
    paths:
      - 'services/velia_software_factory_*.py'
      - 'services/velia_agent_coding_autopilot_*.py'
      - 'tests/test_velia_software_factory_*.py'
      - '.github/workflows/velia-software-factory.yml'
      - 'run_web_process.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  software-factory-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
      - name: Compile Software Factory modules
        run: |
          python -m py_compile \
            services/velia_software_factory_core_service.py \
            services/velia_software_factory_lead_service.py \
            services/velia_software_factory_team_service.py \
            services/velia_software_factory_stage2_runtime_patch.py \
            services/velia_software_factory_routes.py
      - name: Run Stage 1 and Stage 2 focused tests
        env:
          PYTHONPATH: .
        run: |
          python -m pytest -q \
            tests/test_velia_software_factory_core_service.py \
            tests/test_velia_software_factory_team_service.py
      - name: Verify Factory write and review boundary
        run: |
          grep -q 'from services import velia_agent_coding_autopilot_service as autopilot' services/velia_software_factory_lead_service.py
          grep -q 'autopilot.enqueue_task' services/velia_software_factory_lead_service.py
          grep -q 'write_owner.*coding_autopilot' services/velia_software_factory_team_service.py
          grep -q 'review_owner.*coding_autopilot' services/velia_software_factory_team_service.py
          ! grep -nE 'create_branch|open_pull_request|merge_pull|merge_pull_request|apply_patch|contents.:.?write|railway (up|deploy)|kubectl|terraform apply' \
            services/velia_software_factory_core_service.py \
            services/velia_software_factory_team_service.py \
            services/velia_software_factory_stage2_runtime_patch.py \
            services/velia_software_factory_routes.py
      - name: Verify fail-closed rollout flags
        run: |
          grep -q 'VELIA_SOFTWARE_FACTORY_ENABLED.*false' services/velia_software_factory_lead_service.py
          grep -q 'VELIA_SOFTWARE_FACTORY_TEAM_ENABLED.*false' services/velia_software_factory_team_service.py
      - name: Reject newly added Python bytecode
        if: github.event_name == 'pull_request'
        run: |
          if git diff --name-only --diff-filter=A "origin/${GITHUB_BASE_REF}...HEAD" \
            | grep -E '(^|/)__pycache__/|\.py[co]$'; then
            echo "Generated Python bytecode was added by this PR."
            exit 1
          fi
