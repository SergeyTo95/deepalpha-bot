name: VELIA Software Factory

on:
  pull_request:
    paths:
      - 'services/velia_software_factory_*.py'
      - 'services/velia_agent_coding_autopilot_*.py'
      - 'tests/test_velia_software_factory_*.py'
      - '.github/workflows/velia-software-factory.yml'
      - 'run_web_process.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  software-factory-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
      - name: Compile Software Factory modules
        run: |
          python -m py_compile \
            services/velia_software_factory_core_service.py \
            services/velia_software_factory_lead_service.py \
            services/velia_software_factory_team_service.py \
            services/velia_software_factory_stage2_runtime_patch.py \
            services/velia_software_factory_autonomy_service.py \
            services/velia_software_factory_rollout_service.py \
            services/velia_software_factory_rollout_runtime_patch.py \
            services/velia_software_factory_stage3_hardening_patch.py \
            services/velia_software_factory_workspace_service.py \
            services/velia_software_factory_workspace_hardening_patch.py \
            services/velia_software_factory_workspace_execution_service.py \
            services/velia_software_factory_workspace_execution_hardening_patch.py \
            services/velia_software_factory_chat_runtime_patch.py \
            services/velia_software_factory_routes.py \
            run_web_process.py
      - name: Run Stage 1 through Stage 4.1 focused tests
        env:
          PYTHONPATH: .
        run: |
          python -m pytest -q \
            tests/test_velia_software_factory_core_service.py \
            tests/test_velia_software_factory_team_service.py \
            tests/test_velia_software_factory_autonomy_service.py \
            tests/test_velia_software_factory_rollout_service.py \
            tests/test_velia_software_factory_workspace_service.py \
            tests/test_velia_software_factory_workspace_hardening.py \
            tests/test_velia_software_factory_workspace_execution_service.py
      - name: Verify Factory write and review boundary
        run: |
          grep -q 'from services import velia_agent_coding_autopilot_service as autopilot' services/velia_software_factory_lead_service.py
          grep -q 'autopilot.enqueue_task' services/velia_software_factory_lead_service.py
          grep -q 'write_owner.*coding_autopilot' services/velia_software_factory_team_service.py
          grep -q 'review_owner.*coding_autopilot' services/velia_software_factory_team_service.py
          ! grep -nE 'create_branch|open_pull_request|merge_pull|merge_pull_request|apply_patch|contents.:.?write|railway (up|deploy)|kubectl|terraform apply' \
            services/velia_software_factory_core_service.py \
            services/velia_software_factory_team_service.py \
            services/velia_software_factory_stage2_runtime_patch.py \
            services/velia_software_factory_autonomy_service.py \
            services/velia_software_factory_rollout_service.py \
            services/velia_software_factory_rollout_runtime_patch.py \
            services/velia_software_factory_stage3_hardening_patch.py \
            services/velia_software_factory_workspace_service.py \
            services/velia_software_factory_workspace_hardening_patch.py \
            services/velia_software_factory_workspace_execution_hardening_patch.py \
            services/velia_software_factory_chat_runtime_patch.py \
            services/velia_software_factory_routes.py
      - name: Verify autonomy safety contract
        run: |
          grep -q 'autopilot_module.set_mission_status.*paused' services/velia_software_factory_autonomy_service.py
          grep -q 'autopilot_module.cancel_task' services/velia_software_factory_autonomy_service.py
          grep -q 'pg_try_advisory_lock' services/velia_software_factory_autonomy_service.py
          grep -q 'FROM velia_software_factory_chat_contexts c' services/velia_software_factory_stage3_hardening_patch.py
          grep -q 'item.pop("allowed_paths", None)' services/velia_software_factory_stage3_hardening_patch.py
          grep -q 'stage3_hardening.install(autonomy)' services/velia_software_factory_routes.py
          grep -q 'install_velia_software_factory_chat(velia_chat_service_module)' run_web_process.py
          grep -q 'install_velia_software_factory_autonomy(deepalpha_web.app)' run_web_process.py
      - name: Verify controlled rollout safety contract
        run: |
          grep -q 'VELIA_SOFTWARE_FACTORY_ROLLOUT_MODE' services/velia_software_factory_rollout_service.py
          grep -q 'VELIA_SOFTWARE_FACTORY_USER_IDS' services/velia_software_factory_rollout_service.py
          grep -q 'if rollout.dry_run_enabled' services/velia_software_factory_rollout_runtime_patch.py
          grep -q 'if not rollout.supervisor_allowed' services/velia_software_factory_rollout_runtime_patch.py
          grep -q 'GitHub was not modified' services/velia_software_factory_rollout_runtime_patch.py
          ! grep -n 'autopilot.enqueue_task' \
            services/velia_software_factory_rollout_service.py \
            services/velia_software_factory_rollout_runtime_patch.py
      - name: Verify multi-repo workspace safety contract
        run: |
          grep -q 'scope_approved BOOLEAN NOT NULL DEFAULT FALSE' services/velia_software_factory_workspace_service.py
          grep -q 'velia_factory_workspace_scope_requires_separate_approval' services/velia_software_factory_workspace_service.py
          grep -q 'allowed_paths = \[path for path in requested_paths if path in approved_paths\]' services/velia_software_factory_workspace_service.py
          grep -q 'velia_factory_workspace_scope_path_outside_safe_tree' services/velia_software_factory_workspace_hardening_patch.py
          grep -q 'velia_factory_workspace_scope_locked_by_execution' services/velia_software_factory_workspace_hardening_patch.py
          ! grep -nE 'autopilot|enqueue_task|create_branch|open_pull_request|merge_pull|merge_pull_request' \
            services/velia_software_factory_workspace_service.py \
            services/velia_software_factory_workspace_hardening_patch.py
      - name: Verify multi-repo execution safety contract
        env:
          PYTHONPATH: .
        run: |
          python - <<'PY'
          import os
          from services import velia_software_factory_workspace_execution_service as execution

          os.environ.pop("VELIA_SOFTWARE_FACTORY_WORKSPACE_EXECUTION_ENABLED", None)
          assert execution.workspace_execution_enabled() is False
          assert execution.workspace_supervisor_enabled() is False
          PY
          grep -q 'velia_factory_workspace_live_rollout_required' services/velia_software_factory_workspace_execution_service.py
          grep -q 'velia_factory_workspace_mission_conflict' services/velia_software_factory_workspace_execution_service.py
          grep -q 'client_request_id=f"workspace:' services/velia_software_factory_workspace_execution_service.py
          grep -q 'never merge' services/velia_software_factory_workspace_execution_service.py
          grep -q 'ready_for_review' services/velia_software_factory_workspace_execution_service.py
          grep -q '_preflight_mission_conflicts' services/velia_software_factory_workspace_execution_hardening_patch.py
          grep -q 'stop_requested' services/velia_software_factory_workspace_execution_hardening_patch.py
          grep -q 'execution_hardening.install(execution_module)' services/velia_software_factory_workspace_hardening_patch.py
          ! grep -nE 'create_branch|open_pull_request|merge_pull|merge_pull_request|apply_patch|contents.:.?write' \
            services/velia_software_factory_workspace_execution_service.py \
            services/velia_software_factory_workspace_execution_hardening_patch.py
      - name: Verify fail-closed rollout flags
        env:
          PYTHONPATH: .
        run: |
          python - <<'PY'
          import os
          from services import velia_software_factory_autonomy_service as autonomy
          from services import velia_software_factory_lead_service as lead
          from services import velia_software_factory_rollout_service as rollout
          from services import velia_software_factory_team_service as team
          from services import velia_software_factory_workspace_execution_service as workspace_execution

          for name in (
              "VELIA_SOFTWARE_FACTORY_ENABLED",
              "VELIA_SOFTWARE_FACTORY_TEAM_ENABLED",
              "VELIA_SOFTWARE_FACTORY_AUTONOMY_ENABLED",
              "VELIA_SOFTWARE_FACTORY_SUPERVISOR_ENABLED",
              "VELIA_SOFTWARE_FACTORY_ROLLOUT_MODE",
              "VELIA_SOFTWARE_FACTORY_USER_IDS",
              "VELIA_SOFTWARE_FACTORY_WORKSPACE_EXECUTION_ENABLED",
          ):
              os.environ.pop(name, None)

          assert lead.software_factory_enabled() is False
          assert team.team_enabled() is False
          assert autonomy.autonomy_enabled() is False
          assert autonomy.supervisor_enabled() is False
          assert rollout.rollout_mode() == "off"
          assert rollout.allowed_user_ids() == set()
          assert rollout.intake_allowed(1) is False
          assert rollout.supervisor_allowed() is False
          assert workspace_execution.workspace_execution_enabled() is False
          assert workspace_execution.workspace_supervisor_enabled() is False
          PY
      - name: Reject newly added Python bytecode
        if: github.event_name == 'pull_request'
        run: |
          if git diff --name-only --diff-filter=A "origin/${GITHUB_BASE_REF}...HEAD" \
            | grep -E '(^|/)__pycache__/|\.py[co]$'; then
            echo "Generated Python bytecode was added by this PR."
            exit 1
          fi
