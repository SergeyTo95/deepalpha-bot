name: Clean VELIA Developer bytecode

on:
  pull_request:
    branches:
      - feature/turbo-short-term-btc
    paths:
      - '.github/workflows/cleanup-velia-developer-bytecode.yml'

permissions:
  contents: write

jobs:
  clean:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/velia-developer-readonly
          fetch-depth: 0
      - name: Remove generated bytecode and ignore it
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('.gitignore')
          text = path.read_text(encoding='utf-8') if path.exists() else ''
          block = '\n# Python generated bytecode\n__pycache__/\n*.py[cod]\n'
          if '__pycache__/' not in text:
              path.write_text(text.rstrip() + block, encoding='utf-8')
          PY
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          find . -type f \( -name '*.pyc' -o -name '*.pyo' \) -delete
      - name: Commit clean source only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/cleanup-velia-developer-bytecode.yml
          git add .gitignore
          git add -u
          test -z "$(git ls-files | grep -E '(^|/)__pycache__/|\.py[co]$' || true)"
          git commit -m 'Remove generated Python bytecode from Developer PR'
          git push origin HEAD:feature/velia-developer-readonly
