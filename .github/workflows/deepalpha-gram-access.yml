name: DeepAlpha Gram payments and viewer access
on:
  pull_request:
  push:
    branches: [feature/turbo-short-term-btc]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: deepalpha_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/deepalpha_test
      PYTHONPATH: vendor/aiogram_compat
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt pytest pytest-asyncio
      - run: >-
          python -m pytest -q tests/test_deepalpha_gram_access.py
          tests/test_treasury_admin_command.py tests/test_gram_admin_treasury_panel.py
          tests/test_gram_treasury_diagnostics.py tests/test_treasury_financial_security.py
          tests/test_ton_security_hotfix.py tests/test_ton_purchase_summary_fail_safe.py
      - run: python -m compileall -q services bot db telegram_bot.py web.py app.py
      - run: node --check webapp/app.js
