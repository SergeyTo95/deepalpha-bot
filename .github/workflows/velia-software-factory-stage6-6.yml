name: VELIA Software Factory Stage 6.6

on:
  pull_request:
    branches:
      - feature/turbo-short-term-btc
    paths:
      - "services/velia_software_factory_reviewer_service.py"
      - "services/velia_software_factory_reviewer_runtime_patch.py"
      - "services/velia_software_factory_reviewer_remediation_service.py"
      - "services/velia_agent_coding_autopilot_ci_service.py"
      - "tests/test_velia_software_factory_stage6_6_reviewer_remediation.py"
      - "tests/test_velia_software_factory_reviewer_gate.py"
      - "tests/test_velia_software_factory_reviewer_runtime_atomic.py"
      - ".github/workflows/velia-software-factory-stage6-5b.yml"
      - ".github/workflows/velia-software-factory-stage6-6.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reviewer-remediation-loop:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: ${{ github.workspace }}

    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest pytest-asyncio

      - name: Prove checked out SHA
        run: |
          echo "checked_out_sha=$(git rev-parse HEAD)"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          fi

      - name: Compile Stage 6.6 boundary
        run: |
          python -m py_compile \
            services/velia_software_factory_reviewer_service.py \
            services/velia_software_factory_reviewer_runtime_patch.py \
            services/velia_software_factory_reviewer_remediation_service.py \
            services/velia_agent_coding_autopilot_ci_service.py

      - name: Run remediation and prior reviewer regressions
        run: |
          python -m pytest -q \
            tests/test_velia_software_factory_stage6_6_reviewer_remediation.py \
            tests/test_velia_software_factory_reviewer_gate.py \
            tests/test_velia_software_factory_reviewer_runtime_atomic.py \
            tests/test_velia_software_factory_stage6_5b_reviewer_pilot_gate.py

      - name: Verify bounded remediation contract
        run: |
          python - <<'PY'
          from pathlib import Path

          remediation = Path("services/velia_software_factory_reviewer_remediation_service.py").read_text(encoding="utf-8")
          runtime = Path("services/velia_software_factory_reviewer_runtime_patch.py").read_text(encoding="utf-8")

          assert 'VELIA_SOFTWARE_FACTORY_REVIEWER_REMEDIATION_ENABLED", False' in remediation
          assert 'VELIA_SOFTWARE_FACTORY_REVIEWER_REMEDIATION_MAX_ATTEMPTS", 2, 0, 2' in remediation
          assert "ci_module.ci_repair_enabled()" in remediation
          assert "ci_module._execute_repair" in remediation
          assert '"phase": "waiting_ci"' in remediation
          assert '"reviewer.remediation_ci_success"' in remediation
          assert '"ready_for_review"' in remediation
          assert "schedule_after_failed_review" in runtime
          assert 'remediating["status"] = "remediating"' in runtime
          assert 'result["status"] = "executing"' in runtime
          assert runtime.index("schedule_after_failed_review") < runtime.index("original_set_run_state(\n        run,\n        \"blocked\"")
          PY

      - name: Verify safety failures cannot auto-remediate
        run: |
          python - <<'PY'
          from pathlib import Path

          source = Path("services/velia_software_factory_reviewer_remediation_service.py").read_text(encoding="utf-8")
          for code in (
              "reviewer_path_outside_scope",
              "reviewer_files_exceeded",
              "reviewer_pr_not_open",
              "reviewer_pr_not_draft",
              "reviewer_pr_head_changed",
              "reviewer_ci_failure_observed",
          ):
              assert code in source, code
          assert "reviewed_head_sha" in source
          assert "branch_head" in source
          PY

      - name: Reject new GitHub release or direct write primitives
        run: |
          python - <<'PY'
          from pathlib import Path

          source = Path("services/velia_software_factory_reviewer_remediation_service.py").read_text(encoding="utf-8")
          assert "ci_module._execute_repair" in source
          for forbidden in (
              "merge_pull_request",
              "merge_exact_head",
              "create_deployment",
              "create_pull_request",
              "commit_operations(",
              "github_service._request(",
              "os.environ[",
              "os.putenv",
              "enqueue_task(",
          ):
              assert forbidden not in source, forbidden
          PY

      - name: Verify Stage 6.6-owned diff surface
        if: github.event_name == 'pull_request'
        run: |
          python - <<'PY'
          import subprocess

          base = "${{ github.event.pull_request.base.sha }}"
          head = "${{ github.event.pull_request.head.sha }}"
          changed = set(subprocess.check_output(["git", "diff", "--name-only", base, head], text=True).splitlines())
          allowed = {
              "services/velia_software_factory_reviewer_runtime_patch.py",
              "services/velia_software_factory_reviewer_remediation_service.py",
              "tests/test_velia_software_factory_stage6_6_reviewer_remediation.py",
              ".github/workflows/velia-software-factory-stage6-6.yml",
          }
          stage_surface = {
              path for path in changed
              if path.startswith("services/velia_software_factory_reviewer_")
              or path.startswith("tests/test_velia_software_factory_stage6_6")
              or path == ".github/workflows/velia-software-factory-stage6-6.yml"
          }
          unexpected = stage_surface - allowed
          assert not unexpected, f"unexpected Stage 6.6 surface files: {sorted(unexpected)}"
          PY

      - name: Reject newly added Python bytecode
        if: github.event_name == 'pull_request'
        run: |
          if git diff --name-only "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}" | grep -E '(^|/)(__pycache__/|.*\.pyc$)'; then
            echo "Python bytecode must not be committed"
            exit 1
          fi