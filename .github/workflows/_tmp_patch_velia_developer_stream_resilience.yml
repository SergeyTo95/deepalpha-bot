name: Patch VELIA Developer stream resilience

on:
  push:
    branches:
      - fix/velia-developer-chat-stream-resilience
    paths:
      - '.github/scripts/_tmp_patch_velia_developer_stream_resilience.py'
      - '.github/workflows/_tmp_patch_velia_developer_stream_resilience.yml'

permissions:
  contents: write

jobs:
  patch-test-clean:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
      - name: Apply resilience patch
        run: python .github/scripts/_tmp_patch_velia_developer_stream_resilience.py
      - name: Compile affected modules
        run: |
          python -m py_compile \
            services/velia_developer_agent_service.py \
            services/velia_developer_chat_runtime_patch.py \
            services/velia_mobile_streaming_service.py
      - name: Run focused resilience tests
        env:
          PYTHONPATH: .
        run: |
          pytest -q \
            tests/test_velia_developer_agent_service.py \
            tests/test_velia_developer_chat_runtime_patch.py \
            tests/test_velia_mobile_streaming_service.py
      - name: Run complete Developer suite
        env:
          PYTHONPATH: .
        run: pytest -q tests/test_velia_developer_*.py
      - name: Verify read-only and timeout boundaries
        run: |
          ! grep -R -nE 'create_branch|open_pull_request|apply_patch|run_command|contents.:.?write' services/velia_developer_*.py
          grep -q 'VELIA_DEVELOPER_WALL_TIMEOUT_SECONDS' services/velia_developer_agent_service.py
          grep -q 'max_attempts=1' services/velia_developer_agent_service.py
          grep -q '_worker_exception_code' services/velia_mobile_streaming_service.py
      - name: Commit clean product patch
        run: |
          rm -f \
            .github/scripts/_tmp_patch_velia_developer_stream_resilience.py \
            .github/workflows/_tmp_patch_velia_developer_stream_resilience.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Harden VELIA Developer chat streaming'
          git push origin HEAD:fix/velia-developer-chat-stream-resilience
