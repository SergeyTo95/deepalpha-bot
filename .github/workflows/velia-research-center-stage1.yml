name: VELIA Research Center Stage 1
on:
  pull_request:
  push:
    branches: [feature/turbo-short-term-btc]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  research-center-stage1:
    if: ${{ github.event_name != 'push' }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: velia_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/velia_test
      VELIA_RESEARCH_CENTER_ENABLED: 'false'
      VELIA_RESEARCH_AUTONOMY_ENABLED: 'false'
      VELIA_RESEARCH_EXPERIMENT_EXECUTION_ENABLED: 'false'
      VELIA_RESEARCH_LITERATURE_ENABLED: 'false'
      VELIA_RESEARCH_REASONING_ENABLED: 'false'
      VELIA_RESEARCH_DIRECTOR_ENABLED: 'false'
      VELIA_RESEARCH_COMPUTE_ENABLED: 'false'
      VELIA_RESEARCH_EXPERIMENT_PIPELINE_ENABLED: 'false'
      VELIA_RESEARCH_AUTO_REPORT_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt pytest pytest-asyncio
      - name: Focused Research Center validation
        run: bash scripts/validate_velia_research_center_stage1.sh
      - name: Safety boundary static assertions
        run: |
          python - <<'PY'
          from pathlib import Path
          center = Path('services/velia_research_center_service.py').read_text()
          safety = Path('services/velia_research_safety_service.py').read_text()
          literature = Path('services/velia_research_literature_service.py').read_text()
          search_quality = Path('services/velia_research_search_quality_service.py').read_text()
          reasoning = Path('services/velia_research_reasoning_service.py').read_text()
          director = Path('services/velia_research_director_service.py').read_text()
          pipeline = Path('services/velia_research_experiment_pipeline_service.py').read_text()
          report = Path('services/velia_research_report_service.py').read_text()
          worker = Path('run_velia_research_worker.py').read_text()
          routes = Path('velia_research_routes.py').read_text()
          assert 'VELIA_RESEARCH_CENTER_ENABLED", False' in center
          assert 'VELIA_RESEARCH_AUTONOMY_ENABLED", False' in center
          assert 'VELIA_RESEARCH_EXPERIMENT_EXECUTION_ENABLED", False' in center
          assert 'arbitrary_shell": False' in center
          assert 'arbitrary_url_fetch": False' in center
          assert 'VELIA_RESEARCH_LITERATURE_ENABLED", False' in literature
          assert 'ALLOWED_ENDPOINTS' in literature
          assert 'allow_redirects=False' in literature
          assert 'arbitrary_url_fetch": False' in literature
          assert 'QUALITY_VERSION = "v2"' in search_quality
          assert 'rank_relevant' in search_quality
          assert 'scholarly_query_planner' in search_quality
          assert 'VELIA_RESEARCH_REASONING_ENABLED", False' in reasoning
          assert 'source_text_is_untrusted": True' in reasoning
          assert 'VELIA_RESEARCH_DIRECTOR_ENABLED", False' in director
          assert 'experiment_execution": experiment_pipeline.enabled()' in director
          assert 'VELIA_RESEARCH_AUTO_REPORT_ENABLED", False' in director
          assert 'subprocess' not in director
          assert 'os.system' not in director
          assert 'plan_experiment' not in director
          assert 'VELIA_RESEARCH_EXPERIMENT_PIPELINE_ENABLED\", False' in pipeline
          assert 'invented_numeric_data_allowed\": False' in pipeline
          assert 'extra_model_calls": 0' in report
          assert 'operational_harmful_instructions_allowed": False' in report
          assert 'subprocess' not in report
          assert 'os.system' not in report
          assert 'subprocess' not in worker
          assert 'os.system' not in worker
          assert 'execution_allowed": False' in safety
          assert 'safety.classify' in center
          assert 'subprocess' not in center
          assert 'os.system' not in center
          assert 'eval(' not in center
          assert 'exec(' not in center
          assert '_require_mobile_auth' in routes
          PY
