name: Kimi completion hotfix

on:
  pull_request:
    branches:
      - feature/turbo-short-term-btc
    paths:
      - "services/kimi_gateway.py"
      - "tests/test_kimi_provider.py"
      - "tests/test_kimi_runtime_config.py"
      - "docs/kimi-k3-runtime.md"
      - ".env.example"
      - ".github/workflows/kimi-completion-hotfix.yml"
  workflow_dispatch:

jobs:
  kimi-completion-hotfix:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest

      - name: Compile Kimi gateway
        run: python -m py_compile services/kimi_gateway.py

      - name: Run Kimi regression tests
        shell: bash
        run: |
          set -o pipefail
          pytest -q \
            tests/test_kimi_provider.py \
            tests/test_kimi_runtime_config.py \
            2>&1 | tee kimi-completion-hotfix.log

      - name: Upload test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kimi-completion-hotfix-log
          path: kimi-completion-hotfix.log
          if-no-files-found: warn
