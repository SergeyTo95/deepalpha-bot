name: Kimi provider integration

on:
  pull_request:
    branches:
      - feature/turbo-short-term-btc
    paths:
      - "services/kimi_gateway.py"
      - "services/llm_service.py"
      - "services/ai_provider_gateway.py"
      - "tests/test_kimi_provider.py"
      - "tests/test_llm_service.py"
      - "tests/test_ai_control_center.py"
      - ".env.example"
      - ".github/workflows/kimi-provider.yml"
  workflow_dispatch:

jobs:
  kimi-provider-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest

      - name: Compile provider modules
        run: |
          python -m py_compile \
            services/kimi_gateway.py \
            services/llm_service.py \
            services/ai_provider_gateway.py

      - name: Run focused provider tests
        shell: bash
        run: |
          set -o pipefail
          pytest -q \
            tests/test_kimi_provider.py \
            tests/test_llm_service.py \
            tests/test_ai_control_center.py \
            2>&1 | tee kimi-provider-pytest.log

      - name: Upload pytest log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kimi-provider-pytest-log
          path: kimi-provider-pytest.log
          if-no-files-found: warn
