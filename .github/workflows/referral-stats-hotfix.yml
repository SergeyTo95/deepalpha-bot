name: Referral stats hotfix

on:
  pull_request:
    paths:
      - "services/airdrop_referral_service.py"
      - "tests/test_airdrop_referral_service.py"
      - "tests/test_referral_stats_display_hotfix.py"
      - ".github/workflows/referral-stats-hotfix.yml"
  workflow_dispatch:

jobs:
  referral-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
      - name: Compile referral service
        run: python -m py_compile services/airdrop_referral_service.py
      - name: Run referral regression tests
        run: pytest -q tests/test_airdrop_referral_service.py tests/test_referral_stats_display_hotfix.py
