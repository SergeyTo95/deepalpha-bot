name: Restore pre-existing bytecode scope

on:
  pull_request:
    branches:
      - feature/turbo-short-term-btc
    paths:
      - '.github/workflows/restore-base-bytecode-scope.yml'

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/velia-developer-readonly
          fetch-depth: 0
      - name: Restore only bytecode files tracked by production base
        run: |
          git diff --name-status 1362a04d7adeaf18bb6ffe4f0457a0aadd9fa9fe HEAD \
            | awk '$1 == "D" && ($2 ~ /__pycache__\// || $2 ~ /\.py[co]$/) {print $2}' \
            > /tmp/base-bytecode.txt
          if test -s /tmp/base-bytecode.txt; then
            while IFS= read -r path; do
              git checkout 1362a04d7adeaf18bb6ffe4f0457a0aadd9fa9fe -- "$path"
            done < /tmp/base-bytecode.txt
          fi
      - name: Commit scoped restoration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/restore-base-bytecode-scope.yml
          git add -u
          if test -s /tmp/base-bytecode.txt; then
            git add -f --pathspec-from-file=/tmp/base-bytecode.txt
          fi
          git commit -m 'Restore pre-existing bytecode outside Developer scope'
          git push origin HEAD:feature/velia-developer-readonly
