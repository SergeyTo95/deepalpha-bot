name: VELIA Research Claim Ledger
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  research-claim-ledger:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: velia_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/velia_test
      VELIA_RESEARCH_CENTER_ENABLED: 'false'
      VELIA_RESEARCH_DATASET_REGISTRY_ENABLED: 'false'
      VELIA_RESEARCH_PROTOCOL_OFFICER_ENABLED: 'false'
      VELIA_RESEARCH_CLAIM_LEDGER_ENABLED: 'false'
      VELIA_RESEARCH_EXPERIMENT_EXECUTION_ENABLED: 'false'
      VELIA_RESEARCH_COMPUTE_ENABLED: 'false'
      VELIA_RESEARCH_EXPERIMENT_PIPELINE_ENABLED: 'false'
      VELIA_RESEARCH_AUTO_REPORT_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt pytest pytest-asyncio
      - name: Claim ledger and downstream research tests
        run: >
          python -m pytest -q
          tests/test_velia_research_claim_ledger.py
          tests/test_velia_research_protocol_officer.py
          tests/test_velia_research_dataset_registry.py
          tests/test_velia_research_experiment_pipeline.py
          tests/test_velia_research_compute.py
          tests/test_velia_research_report.py
      - name: Compile claim ledger surface
        run: >
          python -m compileall -q
          services/velia_research_claim_service.py
          services/velia_research_protocol_service.py
          services/velia_research_dataset_service.py
          services/velia_research_experiment_pipeline_service.py
          services/velia_research_report_service.py
          run_velia_research_worker.py
          velia_research_routes.py
      - name: Static claim and replication boundary
        run: |
          python - <<'PY'
          from pathlib import Path

          claim = Path('services/velia_research_claim_service.py').read_text()
          protocol = Path('services/velia_research_protocol_service.py').read_text()
          pipeline = Path('services/velia_research_experiment_pipeline_service.py').read_text()
          report = Path('services/velia_research_report_service.py').read_text()
          routes = Path('velia_research_routes.py').read_text()
          env = Path('.env.example').read_text()

          assert 'VELIA_RESEARCH_CLAIM_LEDGER_ENABLED", False' in claim
          assert 'ALLOWED_DIRECTIONS = {"positive", "negative", "nonzero"}' in claim
          assert 'STAGES = {"exploratory", "preregistered", "replicated", "contradicted"}' in claim
          assert '"replication_requires_distinct_dataset_hash": True' in claim
          assert '"replication_requires_distinct_provenance_fingerprint": True' in claim
          assert 'research_claim_must_precede_confirmatory_test' in claim
          assert 'dataset_distinct_replication' in claim
          assert 'dataset_distinct_conflict' in claim
          assert 'affirmative_claim_prohibited' in claim
          assert 'safety.classify' in claim

          forbidden = (
              'subprocess', 'os.system', 'eval(', 'exec(', 'compile(',
              '__import__(', 'requests.', 'aiohttp.', 'socket.', 'open(',
          )
          for token in forbidden:
              assert token not in claim, token

          assert 'claims.authorize_protocol' in protocol
          assert 'research_claim_required' in protocol
          assert '"claim_binding": claim_binding' in protocol
          assert 'protocol_hash = _sha(frozen)' in protocol

          assert '"claim_id"' in pipeline
          assert 'claims.refresh_claim' in pipeline
          assert 'protocol.authorize_test_plan' in pipeline

          assert '"claim_ledger": claim_ledger' in report
          assert '"claim_overstatement_allowed": False' in report
          assert '"claim_ledger_bounded"' in report
          assert '"immutable_claim_evidence_hashes"' in report

          assert '/missions/{mission_id}/claims' in routes
          assert '/claims/{claim_id}/evaluate' in routes
          assert '/missions/{mission_id}/claim-ledger' in routes
          assert 'VELIA_RESEARCH_CLAIM_LEDGER_ENABLED=false' in env
          PY
