name: Developer API v1 foundation

on:
  pull_request:
    branches:
      - feature/turbo-short-term-btc
    paths:
      - "developer_api_routes.py"
      - "developer_api_admin_routes.py"
      - "run_web_process.py"
      - "run_api_worker.py"
      - "services/developer_api_analysis_service.py"
      - "services/developer_api_analysis_result_patch.py"
      - "services/chief_agent_persistence_patch.py"
      - "services/developer_api_service.py"
      - "services/http_security_service.py"
      - "supervisord.conf"
      - "tests/test_developer_api_foundation.py"
      - "tests/test_quick_analysis_api.py"
      - "docs/developer_api_v1.md"
      - "docs/quick_analysis_api.md"
      - ".github/workflows/developer-api-v1.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: developer-api-v1-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  developer-api-foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest pytest-asyncio

      - name: Compile API, worker and security modules
        run: |
          python -m py_compile \
            developer_api_routes.py \
            developer_api_admin_routes.py \
            run_web_process.py \
            run_api_worker.py \
            services/developer_api_analysis_service.py \
            services/developer_api_analysis_result_patch.py \
            services/chief_agent_persistence_patch.py \
            services/developer_api_service.py \
            services/http_security_service.py

      - name: Verify API secrets are never stored raw
        run: |
          ! grep -RIn "raw_key TEXT\|api_key TEXT\|Access-Control-Allow-Origin.*\*" \
            services/developer_api_service.py \
            services/http_security_service.py \
            developer_api_routes.py

      - name: Verify Quick Analysis is open but wallet execution remains closed
        run: |
          grep -q 'add_post("/api/v1/analyses"' developer_api_routes.py
          grep -q 'add_get("/api/v1/analyses/{job_id}"' developer_api_routes.py
          ! grep -En "add_(post|get)\(.*(/api/v1/wallet|/api/v1/opportunities)" developer_api_routes.py

      - name: Run focused tests
        run: |
          PYTHONPATH=. python -m pytest -q \
            tests/test_developer_api_foundation.py \
            tests/test_quick_analysis_api.py
