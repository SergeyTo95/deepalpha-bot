name: Probe VELIA mobile auth production

on:
  pull_request:
    branches:
      - feature/turbo-short-term-btc
    paths:
      - '.github/workflows/_tmp_probe_velia_mobile_auth.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe production DNS, TLS and pairing exchange
        env:
          VELIA_BASE_URL: https://deepalpha-ai.com
        run: |
          python3 - <<'PY'
          import json
          import socket
          import ssl
          import urllib.error
          import urllib.request

          base = "https://deepalpha-ai.com"
          host = "deepalpha-ai.com"

          addresses = sorted({item[4][0] for item in socket.getaddrinfo(host, 443, type=socket.SOCK_STREAM)})
          print("dns_addresses=", addresses)
          if not addresses:
              raise SystemExit("DNS returned no addresses")

          context = ssl.create_default_context()

          def get(path: str) -> None:
              request = urllib.request.Request(base + path, headers={"User-Agent": "VELIA-production-probe/1"})
              try:
                  with urllib.request.urlopen(request, timeout=15, context=context) as response:
                      print(f"GET {path} status={response.status} final_url={response.geturl()}")
              except urllib.error.HTTPError as error:
                  print(f"GET {path} status={error.code} final_url={error.geturl()}")
                  if error.code >= 500:
                      raise

          get("/")
          get("/mobile-connect")

          payload = json.dumps({
              "pairing_code": "AAAAAAAAAAAAAAAA",
              "device_id": "github-production-probe",
              "device_name": "GitHub production probe",
          }).encode("utf-8")
          request = urllib.request.Request(
              base + "/mobile-api/v1/auth/exchange",
              data=payload,
              method="POST",
              headers={
                  "Content-Type": "application/json",
                  "Accept": "application/json",
                  "User-Agent": "VELIA-production-probe/1",
              },
          )

          try:
              with urllib.request.urlopen(request, timeout=15, context=context) as response:
                  raw = response.read(4096)
                  body = json.loads(raw.decode("utf-8")) if raw else {}
                  print(f"POST /mobile-api/v1/auth/exchange status={response.status} error={body.get('error')}")
                  if response.status >= 500:
                      raise SystemExit("pairing exchange returned server error")
          except urllib.error.HTTPError as error:
              raw = error.read(4096)
              try:
                  body = json.loads(raw.decode("utf-8")) if raw else {}
              except Exception:
                  body = {}
              print(f"POST /mobile-api/v1/auth/exchange status={error.code} error={body.get('error')}")
              if error.code >= 500:
                  raise

          print("production_probe=success")
          PY
