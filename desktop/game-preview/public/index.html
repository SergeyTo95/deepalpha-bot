<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Geckoshi</title>
  <link rel="stylesheet" href="/style.css">
  <script src="/phaser.min.js" defer></script>
  <script type="module" src="/game.mjs"></script>
</head>
<body>
  <main>
    <header>
      <div class="heading"><p id="world">GECKOSHI</p><h1 id="title">Сад светлячков</h1></div>
      <button type="button" id="restart" aria-label="Начать заново" title="Начать заново">↻</button>
    </header>
    <p id="objective" class="objective"></p>
    <div class="hud">
      <span id="score"></span>
      <span id="clock"></span>
    </div>
    <section class="arena" aria-label="Игровое поле">
      <div id="game"></div>
      <div id="overlay">
        <p id="status" role="status">Управляй гекконом</p>
        <button type="button" id="play">Играть</button>
      </div>
    </section>
    <section class="controls" aria-label="Управление">
      <div class="directions">
        <button type="button" data-direction="up" aria-label="Вверх">↑</button>
        <button type="button" data-direction="left" aria-label="Влево">←</button>
        <button type="button" data-direction="down" aria-label="Вниз">↓</button>
        <button type="button" data-direction="right" aria-label="Вправо">→</button>
      </div>
      <p>Стрелки или WASD<br>На телефоне — кнопки или касание поля</p>
    </section>
    <a id="game-download" href="/download">Скачать ZIP</a>
  </main>
</body>
</html>
