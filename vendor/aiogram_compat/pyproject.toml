[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "aiogram"
version = "2.25.1+velia.1"
description = "VELIA compatibility packaging of unmodified aiogram 2.25.1 for patched aiohttp"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "aiohttp==3.14.3",
    "Babel>=2.9.1,<2.10.0",
    "certifi>=2021.10.8",
    "magic-filter>=1.0.9",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["aiogram", "aiogram.*"]
